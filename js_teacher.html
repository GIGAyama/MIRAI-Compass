<script>
/**
 * 🧭 みらいコンパス Ver. 1.0 - Teacher Logic (先生用機能)
 * ==============================================================================
 * このファイルは、先生モード（管理画面）の動作を制御します。
 * ・認証（パスワード確認）
 * ・ダッシュボード（LIVEモニタリング、座席表、ヒートマップ、まとめ一覧）
 * ・単元設計（ドラッグ＆ドロップでの計画作成、AIによる案作成）
 * ・授業コントロール（スケジュール配信、メッセージ）
 * ・名簿管理
 */

// ==========================================
//  1. 認証・ログイン (Authentication)
// ==========================================

/**
 * [モーダル] 先生用ログイン
 * サーバーが Session.getActiveUser().getEmail() で本人を判定する。
 * クライアントはパスワードもトークンも送らず、役割だけ問い合わせる。
 */
function attemptTeacherLogin() {
  google.script.run
    .withSuccessHandler(res => {
      if (res && res.isTeacher) {
        switchMode('teacher'); // コア機能でモード切り替え
        showToast('success', '先生モードでログインしました');
      } else {
        var email = (res && res.email) ? res.email : '';
        Swal.fire({
          icon: 'info',
          title: '先生として登録されていません',
          html: 'このGoogleアカウント（' + escapeHtml(email) + '）は先生として登録されていません。すでに先生の方に、設定画面の先生管理からあなたのメールアドレスを追加してもらってください。'
        });
      }
    })
    .withFailureHandler(handleError)
    .getMyRole();
}

// 先生専用のサーバー呼び出し。呼び出し元はサーバーが自分で判定するので、トークンは付けない。
function runTeacher(fnName, args, onSuccess, onFailure) {
  var r = google.script.run
    .withSuccessHandler(onSuccess || function(){})
    .withFailureHandler(onFailure || handleError);
  r[fnName].apply(r, args || []);
}

// ==========================================
//  ワークシート統合（js_worksheet.html への橋渡し）
// ==========================================

/**
 * [モーダル] AI設定（Geminiキー・先生名）
 * getAiConfig() で現在の設定状態を読み、saveAiConfig(key,name) で保存する。
 * キーは空欄なら変更なし（サーバー側で既存を保持）。
 */
function openAiSettings() {
  runTeacher('getAiConfig', [], function(cfg) {
    cfg = cfg || {};
    Swal.fire({
      title: 'AI設定（Geminiキー）',
      html:
        '<div class="text-start">'
        + '  <div class="mb-3">'
        + '    <label class="form-label small fw-bold">Gemini APIキー</label>'
        + '    <input type="password" id="ai-key" class="form-control" autocomplete="off" placeholder="変更するときだけ入力">'
        + '    <div class="form-text small">現在: ' + (cfg.hasApiKey ? '<span class="text-success fw-bold">設定済み</span>' : '<span class="text-danger">未設定</span>') + ' ／ 空欄のまま保存すると変更されません。</div>'
        + '  </div>'
        + '  <div class="mb-1">'
        + '    <label class="form-label small fw-bold">先生の名前</label>'
        + '    <input type="text" id="ai-name" class="form-control" value="' + escapeHtml(cfg.teacherName || '') + '">'
        + '  </div>'
        + '</div>',
      showCancelButton: true,
      confirmButtonText: '保存',
      cancelButtonText: '閉じる',
      preConfirm: function() {
        return {
          key: (document.getElementById('ai-key') || {}).value || '',
          name: (document.getElementById('ai-name') || {}).value || ''
        };
      }
    }).then(function(r) {
      if (!r.isConfirmed) return;
      runTeacher('saveAiConfig', [r.value.key, r.value.name], function() {
        showToast('success', 'AI設定を保存しました');
      });
    });
  });
}

/**
 * タスク編集モーダルから「ワークシート作成・編集」を開く。
 * @param {string} taskId 対象タスクID
 */
function openWorksheetEditorForTask(taskId) {
  var t = (dataStore.masterTasks || []).find(function(x){ return x.taskId === taskId; });
  if (!t) { handleError({ message: '課題が見つかりません' }); return; }
  Swal.close();
  Worksheet.openTeacherEditor(t);
}

/**
 * タスクの提出物一覧を表示し、選んだ提出物の添削（赤ペン）画面を開く。
 * getTaskSubmissions → 一覧、行クリックで Worksheet.openGrading。
 * @param {string} taskId 対象タスクID
 */
function openWorksheetSubmissions(taskId) {
  Swal.close();
  showLoading();
  runTeacher('getTaskSubmissions', [taskId], function(subs) {
    hideLoading();
    subs = subs || [];
    window._wsSubmissions = subs;
    if (subs.length === 0) {
      Swal.fire('提出物なし', 'まだ提出された回答はありません。', 'info');
      return;
    }
    var rows = subs.map(function(s, i) {
      var badge = (s.status === 'graded')
        ? '<span class="badge bg-primary">添削済</span>'
        : '<span class="badge bg-success">提出済</span>';
      var when = s.submittedAt ? new Date(s.submittedAt).toLocaleString() : '';
      return '<button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" '
        + 'data-ws-sub="' + i + '">'
        + '<span class="fw-bold text-truncate">' + escapeHtml(s.studentName || '名無し') + '</span>'
        + '<span class="d-flex align-items-center gap-2">' + badge + '<small class="text-muted">' + escapeHtml(when) + '</small></span>'
        + '</button>';
    }).join('');
    Swal.fire({
      title: '提出物（' + subs.length + '件）',
      html: '<div class="list-group text-start" id="ws-sub-list">' + rows + '</div>',
      showConfirmButton: false,
      showCloseButton: true,
      width: '600px',
      didOpen: function() {
        var popup = Swal.getPopup();
        popup.querySelectorAll('[data-ws-sub]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var idx = parseInt(btn.getAttribute('data-ws-sub'), 10);
            var sub = window._wsSubmissions[idx];
            Swal.close();
            Worksheet.openGrading(sub);
          });
        });
      }
    });
  }, function(err) {
    hideLoading();
    handleError(err);
  });
}

/**
 * [モーダル] 先生の管理（メールアドレスの許可リスト）
 * 現在の先生一覧を表示し、追加・削除できる。
 */
function openTeacherManager() {
  runTeacher('getTeacherList', [], (res) => {
    renderTeacherManager((res && res.teachers) || []);
  });
}

function renderTeacherManager(teachers) {
  var rows = (teachers || []).map(function (em) {
    var safe = escapeHtml(em);
    return '<li class="list-group-item d-flex justify-content-between align-items-center">' +
      '<span>' + safe + '</span>' +
      '<button type="button" class="btn btn-outline-danger btn-sm" data-tm-remove="' + safe + '">削除</button>' +
      '</li>';
  }).join('');
  if (!rows) rows = '<li class="list-group-item text-muted">まだ先生が登録されていません。</li>';

  Swal.fire({
    title: '先生の管理（メールアドレス）',
    html:
      '<ul class="list-group mb-3 text-start" id="tm-list">' + rows + '</ul>' +
      '<div class="input-group">' +
      '  <input type="email" id="tm-input" class="form-control" placeholder="teacher@example.com" autocapitalize="off">' +
      '  <button type="button" class="btn btn-primary" id="tm-add">追加</button>' +
      '</div>',
    showConfirmButton: false,
    showCloseButton: true,
    didOpen: () => {
      var popup = Swal.getPopup();
      var addBtn = popup.querySelector('#tm-add');
      var input = popup.querySelector('#tm-input');
      if (addBtn) addBtn.addEventListener('click', function () {
        var v = (input && input.value || '').trim();
        if (!v) return;
        runTeacher('addTeacherEmail', [v], (res) => {
          renderTeacherManager((res && res.teachers) || []);
        });
      });
      popup.querySelectorAll('[data-tm-remove]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var em = btn.getAttribute('data-tm-remove');
          runTeacher('removeTeacherEmail', [em], (res) => {
            renderTeacherManager((res && res.teachers) || []);
          }, handleError);
        });
      });
    }
  });
}

// ==========================================
//  2. ダッシュボード表示 (Dashboard Views)
// ==========================================

/**
 * [画面描画] 先生用メイン画面の枠組み
 */
// 先生画面のビュー定義。「授業の流れ」の3フェーズにグループ分けして、
// 初めての先生でも「今なにをする画面か」「次にどこを見るか」が分かるようにする。
const TEACHER_VIEWS = {
  design:    { group: 'prep',  label: '単元設計', icon: 'bi-pencil-ruler',  title: '単元設計',
               hint: '単元と課題を用意します。テンプレートを選ぶだけでも始められます。' },
  control:   { group: 'prep',  label: '授業配信', icon: 'bi-broadcast',     title: '授業の配信',
               hint: '「いまこの授業をやっています」を児童の画面に知らせます。' },
  cards:     { group: 'live',  label: 'LIVE',     icon: 'bi-activity',      title: 'LIVEモニター', auto: true,
               hint: '子どもの「いまの課題」とSOSがリアルタイムで並びます。' },
  seating:   { group: 'live',  label: '座席',     icon: 'bi-grid-3x3-gap',  title: '座席表', auto: true,
               hint: '教室の座席の並びで見守れます（カードはドラッグで配置）。' },
  heatmap:   { group: 'live',  label: '進捗一覧', icon: 'bi-table',         title: '進捗一覧',
               hint: 'クラス全員×課題の進み具合を一目で確認。セルを押すとスタンプを送れます。' },
  dashboard: { group: 'after', label: '添削',     icon: 'bi-check2-square', title: 'ワークシート添削',
               hint: '提出されたワークシートを確認して、赤ペンとコメントで返却します。' },
  summaries: { group: 'after', label: 'まとめ',   icon: 'bi-journal-check', title: 'ふりかえり・まとめ',
               hint: '単元のまとめにスタンプとコメントを返します。' }
};
const TEACHER_NAV_GROUPS = [
  { id: 'prep',  caption: '① じゅんび',      views: ['design', 'control'] },
  { id: 'live',  caption: '② 授業中',        views: ['cards', 'seating', 'heatmap'] },
  { id: 'after', caption: '③ みとり・かえす', views: ['dashboard', 'summaries'] }
];

/**
 * [判定] はじめかたガイド用：準備がどこまでできているか。
 * schedules はサーバーが「今日以降」だけを返すため、hasSchedule は「今日の配信があるか」。
 */
function getTeacherSetupStatus() {
  return {
    hasUnit: appState.unitList.length > 0,
    hasRoster: (dataStore.roster || []).some(r => r && r.isActive !== false && r.name),
    hasSchedule: (appState.schedules || []).length > 0
  };
}

/**
 * [HTML生成] はじめかたガイド。
 * 単元がまだ無い（＝初回）ときは3ステップのカードを大きく出し、
 * 単元はあるが名簿・配信が未了のときは残りだけを控えめなバーで出す。
 * すべて済んでいれば何も出さない。
 */
function renderTeacherSetupGuideHtml() {
  const st = getTeacherSetupStatus();
  if (st.hasUnit && st.hasRoster && st.hasSchedule) return '';

  const stepRow = (done, num, title, desc, btnLabel, onclick) => `
    <div class="d-flex align-items-center gap-3 p-2 rounded-3 ${done ? 'opacity-50' : 'bg-white shadow-sm'}">
      <span class="setup-step-num ${done ? 'done' : ''}">${done ? '<i class="bi bi-check-lg" aria-hidden="true"></i>' : num}</span>
      <div class="flex-grow-1">
        <div class="fw-bold small">${title}</div>
        <div class="x-small text-muted">${desc}</div>
      </div>
      ${done ? '' : `<button class="btn btn-primary btn-sm rounded-pill px-3 flex-shrink-0" onclick="${onclick}">${btnLabel}</button>`}
    </div>`;

  if (!st.hasUnit) {
    return `
      <div class="card border-0 rounded-4 p-3 mb-3 flex-shrink-0 setup-guide-card">
        <div class="fw-bold text-primary mb-1"><i class="bi bi-stars me-2" aria-hidden="true"></i>3ステップではじめる自由進度学習</div>
        <div class="x-small text-muted mb-2">はじめてでも大丈夫。上から順に進めるだけで、今日から授業で使えます。</div>
        <div class="d-grid gap-2">
          ${stepRow(st.hasUnit, 1, '単元をつくる', 'テンプレートを選ぶだけでOK。あとから自由に手直しできます。', 'テンプレートを見る', 'openUnitManagerModal()')}
          ${stepRow(st.hasRoster, 2, '名簿をとうろく', 'ExcelやCSVから貼り付けるだけ。児童のログインに使います。', '名簿をひらく', 'openRosterManagerModal()')}
          ${stepRow(st.hasSchedule, 3, 'きょうの授業を配信', '児童の画面に「いまの授業」への案内が表示されます。', '配信画面へ', "setTeacherView('control')")}
        </div>
      </div>`;
  }

  // 単元はある：残りのステップだけを1行で（このセッション中は ✕ で消せる）
  let dismissed = false;
  try { dismissed = sessionStorage.getItem('mirai_setup_bar_dismissed') === '1'; } catch (e) { /* プライベートモード等 */ }
  if (dismissed) return '';

  const chips = [];
  if (!st.hasRoster) chips.push(`<button class="btn btn-sm btn-outline-primary rounded-pill" onclick="openRosterManagerModal()"><i class="bi bi-people me-1" aria-hidden="true"></i>名簿をとうろくする</button>`);
  if (!st.hasSchedule) chips.push(`<button class="btn btn-sm btn-outline-primary rounded-pill" onclick="setTeacherView('control')"><i class="bi bi-broadcast me-1" aria-hidden="true"></i>きょうの授業を配信する</button>`);
  return `
    <div class="d-flex align-items-center gap-2 flex-wrap mb-3 flex-shrink-0 setup-guide-bar rounded-3 px-3 py-2">
      <span class="small text-muted"><i class="bi bi-lightbulb me-1" aria-hidden="true"></i>つぎのじゅんび：</span>
      ${chips.join('')}
      <button type="button" class="btn-close ms-auto" style="font-size:.65rem" aria-label="このお知らせを閉じる" onclick="dismissSetupGuideBar()"></button>
    </div>`;
}

/** [アクション] じゅんびリマインダーを閉じる（このセッションの間だけ） */
function dismissSetupGuideBar() {
  try { sessionStorage.setItem('mirai_setup_bar_dismissed', '1'); } catch (e) { /* 保存できなくても閉じる */ }
  renderTeacherView();
}

function renderTeacherView() {
  const container = document.getElementById('app-container');
  const view = TEACHER_VIEWS[appState.view.teacher] || TEACHER_VIEWS.cards;

  // クラス切り替えタブの生成
  const classes = ['All', ...dataStore.classList];
  const tabsHtml = classes.map(c =>
    `<li class="nav-item"><a class="nav-link ${appState.view.teacherClassId === c ? 'active fw-bold' : ''}" href="#" onclick="setTeacherClass('${escJs(c)}')">${c === 'All' ? '全員' : escapeHtml(c)}</a></li>`
  ).join('');

  // フェーズ別ナビ（① じゅんび / ② 授業中 / ③ みとり・かえす）
  const navHtml = TEACHER_NAV_GROUPS.map(g => {
    const btns = g.views.map(v => {
      const def = TEACHER_VIEWS[v];
      const active = appState.view.teacher === v;
      return `<button type="button" class="tnav-btn ${active ? 'active' : ''}" ${active ? 'aria-current="page"' : ''} onclick="setTeacherView('${v}')">
                <i class="bi ${def.icon} me-1" aria-hidden="true"></i>${def.label}
              </button>`;
    }).join('');
    // 「じゅんび」グループには名簿（モーダル）も並べる
    const rosterBtn = g.id === 'prep'
      ? `<button type="button" class="tnav-btn" onclick="openRosterManagerModal()"><i class="bi bi-people me-1" aria-hidden="true"></i>名簿</button>`
      : '';
    return `<div class="tnav-group" role="group" aria-label="${escapeHtml(g.caption)}">
              <span class="tnav-caption">${escapeHtml(g.caption)}</span>
              <div class="tnav-btns">${btns}${rosterBtn}</div>
            </div>`;
  }).join('');

  const autoBadge = view.auto ? `<span class="badge bg-success ms-2 small" style="font-size:0.6rem" title="この画面は自動で更新されます">AUTO</span>` : '';

  container.innerHTML = `
    <div class="card shadow-sm p-4 border-0 rounded-4 teacher-view-card h-100">
      <!-- 上部ヘッダー：現在のビュー名 + 主要アクション -->
      <div class="d-flex justify-content-between align-items-start gap-3 mb-2 flex-shrink-0 flex-wrap">
        <div>
          <h5 class="fw-bold m-0 text-primary"><i class="bi ${view.icon} me-2" aria-hidden="true"></i>${view.title}${autoBadge}</h5>
          <div class="x-small text-muted mt-1">${view.hint}</div>
        </div>
        <div class="d-flex gap-2 align-items-center flex-shrink-0">
          <!-- 印刷：まとめ一覧・ヒートマップを紙で配るときに使う。
               印刷用スタイル（css.html の @media print）が当たり、
               ナビ・フッター・ボタン・タイマーは出ない。 -->
          <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="printCurrentView()" aria-label="いまの画面を印刷する"><i class="bi bi-printer me-1" aria-hidden="true"></i>印刷</button>
          <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" onclick="openUnitManagerModal()"><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>新規単元登録</button>
        </div>
      </div>

      <!-- フェーズ別ナビ -->
      <nav class="tnav mb-3 flex-shrink-0" aria-label="先生メニュー">${navHtml}</nav>

      <!-- はじめかたガイド（準備が済んでいないときだけ出る） -->
      ${renderTeacherSetupGuideHtml()}

      <!-- クラスフィルタータブ -->
      <ul class="nav nav-tabs mb-3 border-bottom-0 flex-shrink-0">${tabsHtml}</ul>

      <!-- メインコンテンツエリア -->
      <div id="t-area" class="position-relative flex-grow-1 d-flex flex-column overflow-hidden"></div>
    </div>`;

  renderTeacherDashboardContent(); // 中身を描画
}

/**
 * [HTML生成] 先生ビュー共通の空状態。
 * 「データが無い」で終わらせず、次にやることへのボタンを必ず添える。
 */
function teacherEmptyState(icon, title, desc, actionsHtml) {
  return `
    <div class="d-flex flex-column align-items-center justify-content-center text-center p-5 flex-grow-1">
      <i class="bi ${icon} text-secondary opacity-50 mb-3" style="font-size:2.6rem" aria-hidden="true"></i>
      <div class="fw-bold mb-1">${title}</div>
      <div class="small text-muted mb-3" style="max-width:420px">${desc}</div>
      <div class="d-flex gap-2 flex-wrap justify-content-center">${actionsHtml || ''}</div>
    </div>`;
}

// ビュー切り替えヘルパー
function setTeacherClass(cls) { appState.view.teacherClassId = cls; renderTeacherView(); }
function setTeacherView(mode) { appState.view.teacher = mode; renderTeacherView(); }

/**
 * [画面描画] ダッシュボードの中身を振り分け
 */
function renderTeacherDashboardContent() {
  const el = document.getElementById('t-area');
  if (!el) return;
  
  // スクロール位置の維持
  const scrollPos = el.scrollTop;
  
  // 設計画面(design)の時だけ、全体スクロールを止めてドラッグ操作をしやすくする
  const mainEl = document.querySelector('main');
  const appContainer = document.getElementById('app-container');
  if (mainEl && appContainer) {
    if (appState.view.teacher === 'design') {
      mainEl.style.overflow = 'hidden';        
      mainEl.style.display = 'flex';            
      mainEl.style.flexDirection = 'column';
      mainEl.style.paddingBottom = '0';
      appContainer.classList.add('h-100');
      appContainer.style.overflow = 'hidden';
    } else {
      mainEl.style.overflow = '';
      mainEl.style.display = '';
      mainEl.style.flexDirection = '';
      mainEl.style.paddingBottom = ''; 
      appContainer.classList.remove('h-100');
      appContainer.style.overflow = '';
    }
  }

  // 表示モードに応じた関数呼び出し
  if (appState.view.teacher === 'summaries') { renderSummaryListView(el); if(scrollPos>0) el.scrollTop = scrollPos; return; }
  if (appState.view.teacher === 'seating') { renderSeatingView(el); return; }
  if (appState.view.teacher === 'control') { renderControlView(el); return; }
  if (appState.view.teacher === 'design') { renderTeacherDesignView(el); return; }
  if (appState.view.teacher === 'dashboard') { renderTeacherDashboardView(el); return; }

  const targetStudents = getFilteredStudents();
  if (appState.view.teacher === 'cards') {
    renderLiveCards(el, targetStudents);
  } else {
    renderHeatmap(el, targetStudents);
  }
  
  if(appState.view.teacher !== 'design' && scrollPos > 0) el.scrollTop = scrollPos;
}

/**
 * [データ処理] 表示対象の生徒データを抽出
 */
function getFilteredStudents() {
  const classId = appState.view.teacherClassId;
  const live = Array.isArray(dataStore.liveStatus) ? dataStore.liveStatus : [];
  // dataStore.liveStatus への参照をそのまま返さない（呼び出し側の sort 等で元データを壊さないため）
  const base = (classId === 'All') ? live.slice() : live.filter(s => s.classId === classId);

  // 名簿（在籍中）にいるがまだ一度もログインしていない児童も一覧に出す。
  // liveStatus に無い在籍児童を、待機状態として補う。
  const roster = Array.isArray(dataStore.roster) ? dataStore.roster : [];
  const seen = new Set(base.map(s => s.name));
  roster.forEach(r => {
    if (!r || r.isActive === false || !r.name) return;
    if (classId !== 'All' && r.classId !== classId) return;
    if (seen.has(r.name)) return;
    seen.add(r.name);
    base.push({ name: r.name, classId: r.classId, number: r.number, mode: '通常', task: '-' });
  });
  return base;
}

// [まとめビュー] 一括保存の pf-N と行を必ず同じ並びにするため、

function getSummaryStudentsSorted() {

}

/**
 * [高速更新] 自動更新時に画面全体を再描画せず、カードの色や文字だけ書き換える
 */
function updateLiveViews() {
  const students = getFilteredStudents();
  
  // LIVEビューの場合
  if (appState.view.teacher === 'cards') {
    students.forEach(s => {
      // id は生成時に escapeHtml した文字列で作られるため、& や引用符を含む名前だと
      // getElementById の生文字列と一致しなくなる。座席表と同じ data-name + CSS.escape 方式で引く。
      const nameSel = (window.CSS && CSS.escape) ? CSS.escape(s.name) : String(s.name).replace(/["\\\]]/g, '\\$&');
      const card = document.querySelector(`.live-card[data-name="${nameSel}"]`);
      if (card) {
        const isSos = (s.mode === 'たすけて' || s.mode === 'sos');
        const isFocus = (s.mode === 'しゅうちゅう' || s.mode === 'focus');
        const isOtherUnit = s.currentUnitId && s.currentUnitId !== appState.unit.id;
        
        // クラスの付け替え（検索用の live-card は残す）
        card.className = `live-card card h-100 text-center p-3 shadow-sm border-0 rounded-4 ${isSos ? 'sos-alert bg-light-danger border-danger' : ''} ${isFocus ? 'border-info' : ''}`;
        card.style.opacity = isOtherUnit ? '0.5' : '1';
        
        // アイコン更新
        const icon = card.querySelector('.bi-person-circle');
        if (icon) {
          icon.className = `bi bi-person-circle fs-1 my-2 ${isSos ? 'text-danger' : (isFocus ? 'text-info' : 'text-secondary')}`;
        }
        
        // テキスト更新
        const taskEl = card.querySelector('.task-text');
        if (taskEl) taskEl.innerHTML = isOtherUnit ? '<span class="small text-secondary">他単元を学習中</span>' : escapeHtml(s.task || '-');
        
        const badgeEl = card.querySelector('.mode-badge');
        if (badgeEl) badgeEl.textContent = s.mode || '通常';
      }
    });
  }
  
  // 座席表ビューの場合
  else if (appState.view.teacher === 'seating' && !isDraggingSeat) {
    const canvas = document.getElementById('seating-canvas');
    if (canvas) {
      students.forEach(s => {
        const nameSel = (window.CSS && CSS.escape) ? CSS.escape(s.name) : String(s.name).replace(/["\\\]]/g, '\\$&');
        const card = canvas.querySelector(`.seat-card[data-name="${nameSel}"]`);
        if (card) {
          const isSos = (s.mode === 'たすけて' || s.mode === 'sos');
          const isFocus = (s.mode === 'しゅうちゅう' || s.mode === 'focus');
          
          if (isSos) card.classList.add('sos-alert', 'bg-light-danger');
          else card.classList.remove('sos-alert', 'bg-light-danger');
          
          const icon = card.querySelector('.bi-person-circle');
          if (icon) icon.className = `bi bi-person-circle fs-3 ${isSos ? 'text-danger' : (isFocus ? 'text-info' : 'text-secondary')}`;
          
          const taskDiv = card.querySelector('.x-small');
          if(taskDiv) taskDiv.textContent = s.task || '-';
        }
      });
    }
  }
}

// 座席ドラッグの処理（グリッドスナップ付き）
let dragSrcEl = null;
let isDraggingSeat = false;
let dragStartX = 0; // [追加] ドラッグ開始時のX座標
let dragStartY = 0; // [追加] ドラッグ開始時のY座標

function startDragSeat(e, cardBody) {
  e.preventDefault(); 
  const card = cardBody.parentElement;
  dragSrcEl = card;
  isDraggingSeat = true;
  
  const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
  const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
  
  // [追加] 開始位置を記録
  dragStartX = parseInt(card.style.left, 10) || 0;
  dragStartY = parseInt(card.style.top, 10) || 0;
  
  const shiftX = clientX - card.getBoundingClientRect().left;
  const shiftY = clientY - card.getBoundingClientRect().top;
  
  const canvas = document.getElementById('seating-canvas');
  const canvasRect = canvas.getBoundingClientRect();

  function moveAt(pageX, pageY) {
    let newLeft = pageX - shiftX - canvasRect.left;
    let newTop = pageY - shiftY - canvasRect.top;
    
    if (newLeft < 0) newLeft = 0;
    if (newTop < 0) newTop = 0;
    if (newLeft > canvasRect.width - card.offsetWidth) newLeft = canvasRect.width - card.offsetWidth;
    if (newTop > canvasRect.height - card.offsetHeight) newTop = canvasRect.height - card.offsetHeight;

    card.style.left = newLeft + 'px';
    card.style.top = newTop + 'px';
  }

  function onMouseMove(e) {
    const px = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
    const py = e.type.includes('mouse') ? e.pageY : e.touches[0].pageY;
    moveAt(px, py);
  }

  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    document.removeEventListener('touchmove', onMouseMove);
    document.removeEventListener('touchend', onMouseUp);
    
    // グリッドに吸着
    const GRID = CONSTANTS.SEAT_GRID_SIZE;
    const currentLeft = parseInt(card.style.left, 10);
    const currentTop = parseInt(card.style.top, 10);
    
    const snapLeft = Math.round(currentLeft / GRID) * GRID + 10;
    const snapTop = Math.round(currentTop / GRID) * GRID + 10;
    
    // [追加] 重なりチェック
    if (checkCollision(card, snapLeft, snapTop)) {
        // 重なっているので元の位置に戻す
        card.style.transition = 'all 0.2s ease-out';
        card.style.left = dragStartX + 'px';
        card.style.top = dragStartY + 'px';
        showToast('warning', 'そこにカードは置けません');
    } else {
        // 移動確定
        card.style.transition = 'all 0.2s ease-out';
        card.style.left = snapLeft + 'px';
        card.style.top = snapTop + 'px';
    }
    
    setTimeout(() => { card.style.transition = ''; }, 200);

    dragSrcEl = null;
    isDraggingSeat = false;
  }

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
  document.addEventListener('touchmove', onMouseMove, {passive: false});
  document.addEventListener('touchend', onMouseUp);
}

// [追加] 衝突判定関数
function checkCollision(targetCard, x, y) {
    const cards = document.querySelectorAll('.seat-card');
    for (let i = 0; i < cards.length; i++) {
        const other = cards[i];
        if (other === targetCard) continue; // 自分自身はスキップ
        
        const otherX = parseInt(other.style.left, 10);
        const otherY = parseInt(other.style.top, 10);
        
        // 許容誤差を含めて判定（グリッドサイズ未満の距離なら重なりとみなす）
        const dist = Math.sqrt(Math.pow(x - otherX, 2) + Math.pow(y - otherY, 2));
        if (dist < CONSTANTS.SEAT_GRID_SIZE / 2) {
            return true;
        }
    }
    return false;
}

function saveSeating() {
  // [修正] ボタンの取得とローディング状態への変更
  const btn = document.getElementById('btn-save-seating');
  const originalText = btn ? btn.innerHTML : '配置を保存';
  
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>保存中...';
  }

  const cards = document.querySelectorAll('.seat-card');
  const coords = [];
  cards.forEach(c => {
    coords.push({
      name: c.getAttribute('data-name'),
      x: parseInt(c.style.left, 10),
      y: parseInt(c.style.top, 10)
    });
  });
  
  runTeacher('saveSeatCoordinates', [coords],
    () => {
      showToast('success', '座席配置を保存しました');

      // [追加] ローカルのデータストアも更新して、タブ切り替え等でリセットされないようにする
      coords.forEach(c => {
        const student = dataStore.liveStatus.find(s => s.name === c.name);
        if (student) {
          student.x = c.x;
          student.y = c.y;
        }
      });

      // [修正] 処理成功時にボタンを元に戻す
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    },
    (e) => {
      handleError(e);
      // [修正] エラー時もボタンを元に戻す
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
}

// ==========================================
//  3.5 添削ダッシュボード (Teacher Submissions Dashboard / Phase H)
// ==========================================
//  提出物の一覧・絞り込み・並べ替え・添削（赤ペン / クイックコメント）・AI一括コメント。
//  データは getDashboardData を一度だけ取得して dashboardCache に保持し、
//  絞り込み・並べ替えはすべてクライアント側で再描画する（キー入力ごとの再取得はしない）。

// --- モジュール状態（先生ダッシュボード専用） ---
var dashboardCache = null;                 // { submissions:[...], worksheets:[...] } 取得結果のキャッシュ
var dashboardFilter = { taskId: 'all', status: 'all', name: '', sort: 'submittedAt' };
var dashboardBatch = null;                 // AI 一括コメントのレビュー中データ（配列）または null
var dashboardBatchTitle = '';              // AI 一括レビューの見出し（授業名）

// 入力中（input/textarea/select/contentEditable）ならキーボード操作を横取りしない
function isDashTypingTarget(t) {
  if (!t) return false;
  if (t.isContentEditable) return true;
  var tag = (t.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}

// キャッシュから該当行の提出物を探す
function findDashSub(rowIndex) {
  var subs = (dashboardCache && dashboardCache.submissions) || [];
  for (var i = 0; i < subs.length; i++) {
    if (String(subs[i].rowIndex) === String(rowIndex)) return subs[i];
  }
  return null;
}

// 未提出（draft/空）を除いた対象提出物。提出ずみ・添削ずみのみ。
function dashboardEligible() {
  var subs = (dashboardCache && dashboardCache.submissions) || [];
  return subs.filter(function (s) {
    var n = MiraiShared.normSubmission(s.status);
    return n === 'submitted' || n === 'graded';
  });
}

// 授業（taskId）と 名前 での絞り込みだけを適用（状態バッジ集計に使う）
function dashboardFilteredByTaskName() {
  var name = (dashboardFilter.name || '').trim().toLowerCase();
  return dashboardEligible().filter(function (s) {
    if (dashboardFilter.taskId !== 'all' && String(s.taskId) !== String(dashboardFilter.taskId)) return false;
    if (name && String(s.studentName || '').toLowerCase().indexOf(name) < 0) return false;
    return true;
  });
}

function dashStatusRank(s) {
  return MiraiShared.normSubmission(s.status) === 'graded' ? 1 : 0; // 未添削(0) を先に
}

// 表示するカード用に、状態絞り込み＋並べ替えまで適用した配列
function dashboardVisible() {
  var list = dashboardFilteredByTaskName();
  if (dashboardFilter.status === 'submitted') {
    list = list.filter(function (s) { return MiraiShared.normSubmission(s.status) === 'submitted'; });
  } else if (dashboardFilter.status === 'graded') {
    list = list.filter(function (s) { return MiraiShared.normSubmission(s.status) === 'graded'; });
  }
  list = list.slice();
  var sort = dashboardFilter.sort;
  list.sort(function (a, b) {
    if (sort === 'name') {
      return String(a.studentName || '').localeCompare(String(b.studentName || ''), 'ja');
    }
    if (sort === 'status') {
      var r = dashStatusRank(a) - dashStatusRank(b);
      if (r !== 0) return r;
      return (b.submittedAt || 0) - (a.submittedAt || 0);
    }
    return (b.submittedAt || 0) - (a.submittedAt || 0); // 提出日時の新しい順
  });
  return list;
}

/**
 * [画面描画] 添削ダッシュボードの本体。
 * 初回は getDashboardData を取得してキャッシュ。以降は全てクライアント再描画。
 */
function renderTeacherDashboardView(el) {
  if (!el) return;
  el.className = 'flex-grow-1 p-3 overflow-auto d-flex flex-column';

  // 初回のみサーバーから取得
  if (dashboardCache === null) {
    el.innerHTML = '<div class="text-center p-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>提出物を読み込み中...</div>';
    runTeacher('getDashboardData', [], function (res) {
      dashboardCache = {
        submissions: (res && res.submissions) || [],
        worksheets: (res && res.worksheets) || []
      };
      // 直前に選んでいた授業がもう無ければ全てに戻す（自己リセットではなく整合性の担保）
      if (dashboardFilter.taskId !== 'all') {
        var exists = dashboardCache.worksheets.some(function (w) { return String(w.taskId) === String(dashboardFilter.taskId); });
        if (!exists) dashboardFilter.taskId = 'all';
      }
      renderTeacherDashboardView(el);
    }, function (e) {
      dashboardCache = null;
      el.innerHTML = '<div class="text-center p-5 text-danger">読み込みに失敗しました。更新してください。</div>';
      handleError(e);
    });
    return;
  }

  var worksheets = dashboardCache.worksheets || [];

  // 授業ドロップダウン（選択は dashboardFilter を正とする＝自己リセットしない）
  var taskOptions = '<option value="all"' + (dashboardFilter.taskId === 'all' ? ' selected' : '') + '>すべての授業</option>';
  worksheets.forEach(function (w) {
    var label = (w.unitName ? w.unitName + ' / ' : '') + (w.stepTitle || w.taskId);
    var sel = String(dashboardFilter.taskId) === String(w.taskId) ? ' selected' : '';
    taskOptions += '<option value="' + escapeHtml(w.taskId) + '"' + sel + '>' + escapeHtml(label) + '</option>';
  });

  function statusOpt(v, lbl) {
    return '<option value="' + v + '"' + (dashboardFilter.status === v ? ' selected' : '') + '>' + lbl + '</option>';
  }
  function sortOpt(v, lbl) {
    return '<option value="' + v + '"' + (dashboardFilter.sort === v ? ' selected' : '') + '>' + lbl + '</option>';
  }

  var batchDisabled = (dashboardFilter.taskId === 'all') ? ' disabled' : '';

  var controls =
    '<div class="d-flex flex-wrap gap-2 align-items-end mb-3 flex-shrink-0">'
    + '  <div><label class="form-label small fw-bold mb-1">授業でしぼる</label>'
    + '    <select class="form-select form-select-sm" style="min-width:200px" onchange="setDashTask(this.value)">' + taskOptions + '</select></div>'
    + '  <div><label class="form-label small fw-bold mb-1">状態</label>'
    + '    <select class="form-select form-select-sm" onchange="setDashStatus(this.value)">'
    + statusOpt('all', 'すべて') + statusOpt('submitted', '未添削（提出ずみ）') + statusOpt('graded', '添削ずみ') + '</select></div>'
    + '  <div><label class="form-label small fw-bold mb-1">並べ替え</label>'
    + '    <select class="form-select form-select-sm" onchange="setDashSort(this.value)">'
    + sortOpt('submittedAt', '提出日時') + sortOpt('name', '名前') + sortOpt('status', '状態') + '</select></div>'
    + '  <div class="flex-grow-1" style="min-width:160px"><label class="form-label small fw-bold mb-1">名前でさがす</label>'
    + '    <input type="text" class="form-control form-control-sm" placeholder="名前の一部..." value="' + escapeHtml(dashboardFilter.name) + '" oninput="setDashName(this.value)"></div>'
    + '  <div class="d-flex gap-2">'
    + '    <button class="btn btn-outline-success btn-sm rounded-pill px-3" onclick="openDashboardBatch()"' + batchDisabled + ' title="' + (batchDisabled ? '授業を1つ選ぶと使えます' : 'AIが全員分のコメント案を作ります') + '"><i class="bi bi-robot me-1" aria-hidden="true"></i>AI一括コメント</button>'
    + '    <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="refreshDashboard()"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>更新</button>'
    + '  </div>'
    + '</div>';

  // AI 一括レビュー中はカードグリッドの代わりにレビュー画面を出す
  if (dashboardBatch !== null) {
    el.innerHTML = controls + '<div id="dash-batch" class="flex-grow-1 overflow-auto"></div>';
    renderDashboardBatchPanel();
    return;
  }

  el.innerHTML = controls
    + '<div id="dash-stats" class="mb-2 flex-shrink-0"></div>'
    + '<div id="dash-grid" class="flex-grow-1" tabindex="-1"></div>'
    + '<div id="dash-detail" class="d-none"></div>';

  // グリッドへキーボード操作を一度だけ束ねる（カードが対象。入力中は横取りしない）
  var gridEl = document.getElementById('dash-grid');
  if (gridEl) {
    gridEl.addEventListener('keydown', onDashGridKeydown);
    gridEl.addEventListener('click', function (ev) {
      var card = ev.target && ev.target.closest ? ev.target.closest('[data-dash-card]') : null;
      if (!card) return;
      openDashboardDetail(card.getAttribute('data-dash-card'));
    });
  }
  renderDashboardGrid();
}

// フィルタ操作ハンドラ ---------------------------------------------------------
function setDashTask(v) { dashboardFilter.taskId = v; dashboardBatch = null; renderTeacherDashboardView(document.getElementById('t-area')); }
function setDashStatus(v) { dashboardFilter.status = v; renderDashboardGrid(); }
function setDashSort(v) { dashboardFilter.sort = v; renderDashboardGrid(); }
function setDashName(v) { dashboardFilter.name = v; renderDashboardGrid(); }
function refreshDashboard() { dashboardCache = null; dashboardBatch = null; renderTeacherDashboardView(document.getElementById('t-area')); }

// カードグリッド＋統計バッジだけを再描画（コントロールは作り直さない＝入力フォーカスを保つ）
function renderDashboardGrid() {
  var statsEl = document.getElementById('dash-stats');
  var gridEl = document.getElementById('dash-grid');
  if (!gridEl) return;

  var scope = dashboardFilteredByTaskName();
  var graded = scope.filter(function (s) { return MiraiShared.normSubmission(s.status) === 'graded'; }).length;
  var total = scope.length;
  if (statsEl) {
    statsEl.innerHTML =
      '<span class="badge bg-secondary me-1">提出 ' + total + '</span>'
      + '<span class="badge bg-primary me-1">添削ずみ ' + graded + '</span>'
      + '<span class="badge bg-warning text-dark">未添削 ' + (total - graded) + '</span>';
  }

  var list = dashboardVisible();
  if (list.length === 0) {
    gridEl.innerHTML = '<div class="text-center p-5 text-muted">条件に合う提出物がありません</div>';
    return;
  }

  var cards = list.map(function (s) {
    var graded = MiraiShared.normSubmission(s.status) === 'graded';
    var badge = graded
      ? '<span class="badge bg-primary">添削ずみ</span>'
      : '<span class="badge bg-success">提出ずみ</span>';
    var hasComment = s.feedbackText && String(s.feedbackText).trim()
      ? '<span class="badge bg-info text-dark"><i class="bi bi-chat-left-text me-1" aria-hidden="true"></i>コメント有</span>'
      : '<span class="badge bg-light text-muted">コメント無</span>';
    var when = (s.submittedAt && s.submittedAt > 0) ? new Date(s.submittedAt).toLocaleString() : '';
    var thumb = s.canvasImage
      ? '<img src="' + escUrl(s.canvasImage) + '" alt="" class="w-100 rounded" style="height:120px;object-fit:cover;background:#f8f9fa" loading="lazy">'
      : '<div class="w-100 rounded d-flex align-items-center justify-content-center text-muted" style="height:120px;background:#f8f9fa"><i class="bi bi-image fs-2" aria-hidden="true"></i></div>';
    return '<button type="button" class="card border-0 shadow-sm rounded-4 p-2 text-start" '
      + 'data-dash-card="' + escapeHtml(String(s.rowIndex)) + '" '
      + 'style="width:100%;cursor:pointer" '
      + 'title="' + escapeHtml(s.studentName || '名無し') + ' さんの提出を開く">'
      + thumb
      + '<div class="mt-2 fw-bold text-truncate">' + escapeHtml(s.studentName || '名無し') + '</div>'
      + '<div class="d-flex flex-wrap gap-1 mt-1">' + badge + hasComment + '</div>'
      + (when ? '<div class="small text-muted mt-1">' + escapeHtml(when) + '</div>' : '')
      + '</button>';
  }).join('');

  gridEl.innerHTML = '<div class="dash-card-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.75rem">' + cards + '</div>';
}

// グリッド内キーボード操作：矢印で移動、Enter で開く。入力欄では無効。
function dashGridColumns(cards) {
  if (!cards.length) return 1;
  var top0 = cards[0].offsetTop, cols = 0;
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].offsetTop === top0) cols++; else break;
  }
  return Math.max(1, cols);
}

function onDashGridKeydown(e) {
  if (isDashTypingTarget(e.target)) return; // 入力中は横取りしない
  var cards = Array.prototype.slice.call(document.querySelectorAll('#dash-grid [data-dash-card]'));
  if (!cards.length) return;
  var idx = cards.indexOf(document.activeElement);
  if (e.key === 'Enter') {
    if (idx >= 0) { e.preventDefault(); cards[idx].click(); }
    return;
  }
  var cols = dashGridColumns(cards);
  var next = -1;
  if (e.key === 'ArrowRight') next = (idx < 0 ? 0 : idx + 1);
  else if (e.key === 'ArrowLeft') next = (idx < 0 ? 0 : idx - 1);
  else if (e.key === 'ArrowDown') next = (idx < 0 ? 0 : idx + cols);
  else if (e.key === 'ArrowUp') next = (idx < 0 ? 0 : idx - cols);
  else return;
  e.preventDefault();
  if (next < 0) next = 0;
  if (next >= cards.length) next = cards.length - 1;
  cards[next].focus();
}

// 詳細パネル（1件の添削操作）--------------------------------------------------
function openDashboardDetail(rowIndex) {
  var s = findDashSub(rowIndex);
  var panel = document.getElementById('dash-detail');
  if (!s || !panel) return;

  var graded = MiraiShared.normSubmission(s.status) === 'graded';
  var badge = graded ? '<span class="badge bg-primary">添削ずみ</span>' : '<span class="badge bg-success">提出ずみ</span>';
  var thumb = s.canvasImage
    ? '<img src="' + escUrl(s.canvasImage) + '" alt="" class="w-100 rounded mb-3" style="max-height:280px;object-fit:contain;background:#f8f9fa">'
    : '';
  var ri = escapeHtml(String(s.rowIndex));

  panel.className = 'card border-0 shadow rounded-4 p-3 mt-3';
  panel.setAttribute('tabindex', '-1');
  panel.innerHTML =
    '<div class="d-flex justify-content-between align-items-center mb-2">'
    + '  <h6 class="fw-bold m-0">' + escapeHtml(s.studentName || '名無し') + ' さん ' + badge + '</h6>'
    + '  <button type="button" class="btn-close" aria-label="閉じる" onclick="closeDashboardDetail()"></button>'
    + '</div>'
    + thumb
    + '<label class="form-label small fw-bold mb-1">クイックコメント（文字だけ返す）</label>'
    + '<textarea id="dash-detail-comment" class="form-control mb-2" rows="3" placeholder="コメントを入力...">' + escapeHtml(s.feedbackText || '') + '</textarea>'
    + '<div class="d-flex flex-wrap gap-2">'
    + '  <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" onclick="saveDashboardComment(\'' + escJs(String(s.rowIndex)) + '\')"><i class="bi bi-save me-1" aria-hidden="true"></i>コメントを保存</button>'
    + '  <button type="button" class="btn btn-danger btn-sm rounded-pill px-3" onclick="openDashboardGrading(\'' + escJs(String(s.rowIndex)) + '\')"><i class="bi bi-pencil-fill me-1" aria-hidden="true"></i>赤ペンで添削</button>'
    + '  <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="closeDashboardDetail()">閉じる</button>'
    + '</div>'
    + '<div class="form-text small mt-1">赤ペン添削で返却したあとは「更新」を押すと状態が反映されます。</div>';
  panel.classList.remove('d-none');
  // Esc で閉じる（入力中は横取りしない）
  panel.onkeydown = function (e) {
    if (isDashTypingTarget(e.target)) return;
    if (e.key === 'Escape') { e.preventDefault(); closeDashboardDetail(); }
  };
  panel.focus();
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDashboardDetail() {
  var panel = document.getElementById('dash-detail');
  if (!panel) return;
  panel.classList.add('d-none');
  panel.innerHTML = '';
  panel.onkeydown = null;
  var gridEl = document.getElementById('dash-grid');
  if (gridEl) gridEl.focus();
}

// クイックコメント（文字だけ）を保存。saveFeedback は data オブジェクトを受ける。
function saveDashboardComment(rowIndex) {
  var ta = document.getElementById('dash-detail-comment');
  if (!ta) return;
  var txt = ta.value || '';
  showLoading();
  runTeacher('saveFeedback', [{ rowIndex: parseInt(rowIndex, 10), feedbackText: txt }], function () {
    hideLoading();
    showToast('success', 'コメントを保存しました');
    var s = findDashSub(rowIndex);
    if (s) { s.status = 'graded'; s.feedbackText = txt; }
    closeDashboardDetail();
    renderDashboardGrid();
  }, function (e) {
    hideLoading();
    handleError(e);
  });
}

// 赤ペン添削（フルキャンバス）を開く。返却後の状態反映は「更新」で行う。
function openDashboardGrading(rowIndex) {
  var s = findDashSub(rowIndex);
  if (!s) return;
  closeDashboardDetail();
  if (typeof Worksheet !== 'undefined' && Worksheet.openGrading) {
    Worksheet.openGrading(s);
  } else {
    handleError({ message: '添削画面を開けませんでした' });
  }
}

// AI 一括コメント ------------------------------------------------------------
function openDashboardBatch() {
  var taskId = dashboardFilter.taskId;
  if (taskId === 'all') { showToast('info', '授業を1つ選んでください'); return; }
  showLoading();
  runTeacher('generateBatchComments', [taskId], function (res) {
    hideLoading();
    dashboardBatch = (res && res.comments) || [];
    dashboardBatchTitle = (res && res.taskTitle) || '';
    if (dashboardBatch.length === 0) {
      dashboardBatch = null;
      Swal.fire('対象なし', 'この授業に提出物がありません。', 'info');
      return;
    }
    renderTeacherDashboardView(document.getElementById('t-area'));
  }, function (e) {
    hideLoading();
    handleError(e);
  });
}

function cancelDashboardBatch() {
  dashboardBatch = null;
  renderTeacherDashboardView(document.getElementById('t-area'));
}

function renderDashboardBatchPanel() {
  var host = document.getElementById('dash-batch');
  if (!host) return;
  var rows = (dashboardBatch || []).map(function (c) {
    var graded = MiraiShared.normSubmission(c.status) === 'graded';
    var badge = graded ? '<span class="badge bg-primary ms-2">添削ずみ</span>' : '<span class="badge bg-success ms-2">提出ずみ</span>';
    return '<div class="card border-0 shadow-sm rounded-3 p-3 mb-2">'
      + '<div class="fw-bold">' + escapeHtml(c.studentName || '名無し') + badge + '</div>'
      + '<div class="small text-muted mb-2" style="white-space:pre-wrap">児童の記述: ' + (c.textContent ? escapeHtml(c.textContent) : '（未記入）') + '</div>'
      + '<textarea class="form-control" rows="3" data-batch-row="' + escapeHtml(String(c.rowIndex)) + '">' + escapeHtml(c.aiComment || '') + '</textarea>'
      + '</div>';
  }).join('');

  host.innerHTML =
    '<div class="d-flex justify-content-between align-items-center mb-3">'
    + '  <h6 class="fw-bold m-0"><i class="bi bi-robot me-1" aria-hidden="true"></i>AIコメント案：' + escapeHtml(dashboardBatchTitle || '') + '<span class="text-muted small ms-2">（編集してから返却してください）</span></h6>'
    + '  <div class="d-flex gap-2">'
    + '    <button class="btn btn-success btn-sm rounded-pill px-3" onclick="submitDashboardBatch()"><i class="bi bi-send-fill me-1" aria-hidden="true"></i>一括返却</button>'
    + '    <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="cancelDashboardBatch()">キャンセル</button>'
    + '  </div>'
    + '</div>'
    + rows;
}

function submitDashboardBatch() {
  var areas = document.querySelectorAll('#dash-batch [data-batch-row]');
  var list = [];
  areas.forEach(function (a) {
    var ri = parseInt(a.getAttribute('data-batch-row'), 10);
    var txt = a.value || '';
    if (ri && txt.trim()) list.push({ rowIndex: ri, feedbackText: txt });
  });
  if (list.length === 0) { showToast('info', '返すコメントがありません'); return; }
  showLoading();
  runTeacher('batchSaveFeedback', [list], function () {
    hideLoading();
    showToast('success', list.length + '件を返却しました');
    list.forEach(function (item) {
      var s = findDashSub(item.rowIndex);
      if (s) { s.status = 'graded'; s.feedbackText = item.feedbackText; }
    });
    dashboardBatch = null;
    renderTeacherDashboardView(document.getElementById('t-area'));
  }, function (e) {
    hideLoading();
    handleError(e);
  });
}

/**
 * [設計画面] ドラッグ＆ドロップで授業計画を立てる
 */
function renderTeacherDesignView(container) {
  // スクロール位置の保存
  const poolContainer = document.getElementById('teacher-pool-container');
  const poolScrollY = poolContainer ? poolContainer.scrollTop : 0;
  const designScrollContainer = document.getElementById('teacher-design-scroll-view');
  const designScrollY = designScrollContainer ? designScrollContainer.scrollTop : 0;

  container.className = "d-flex flex-column flex-grow-1 overflow-hidden h-100";
  container.style.height = "100%";

  // 単元がまだ1つも無いときは、設計ボードではなく作成への案内を出す
  if (!appState.unit.id) {
    container.innerHTML = teacherEmptyState('bi-pencil-ruler', 'まだ単元がありません',
      'まずは単元をつくりましょう。テンプレートなら、導入〜まとめまで組み立てずみの単元がワンクリックで用意できます。',
      `<button class="btn btn-primary btn-sm rounded-pill px-3" onclick="openUnitManagerModal()"><i class="bi bi-collection me-1" aria-hidden="true"></i>テンプレートから作成</button>`);
    return;
  }

  const currentTasks = getCurrentUnitTasks();
  const totalHours = appState.unit.totalHours;
  
  const taskPool = [];
  const hoursMap = {}; 
  
  for(let i = 1; i <= totalHours; i++) hoursMap[i] = [];
  
  currentTasks.forEach(t => {
    const stepNum = getStepNumber(t.step);
    if (stepNum > 0 && hoursMap[stepNum]) {
      hoursMap[stepNum].push(t);
    } else {
      taskPool.push(t);
    }
  });

  // 未配置プールのカードHTML生成
  let taskPoolHtml = '';
  taskPool.forEach(t => {
    const borderClass = getCategoryColorClass(t.category);
    const badge = t.format === 'teacher' ? '<span class="badge bg-info text-white me-1">先生</span>' : '';
    taskPoolHtml += `
      <div class="card p-2 mb-2 shadow-sm task-draggable ${borderClass}" data-id="${escapeHtml(t.taskId)}" onclick="openTeacherTaskEditModal('${escJs(t.taskId)}')" style="cursor:pointer">
        <div class="small fw-bold">${badge}${escapeHtml(t.title)}</div>
        <div class="d-flex justify-content-between align-items-center mt-1">
          <span class="badge bg-light text-secondary border rounded-pill" style="font-size:0.6rem">${escapeHtml(t.category)}</span>
          <div class="x-small text-muted">${escapeHtml(t.time)}分</div>
        </div>
      </div>`;
  });

  // 時数レーンのカードHTML生成
  let hoursHtml = '';
  for(let i = 1; i <= totalHours; i++) {
    let hourTasksHtml = '';
    let totalTime = 0;
    
    hoursMap[i].forEach(t => {
      totalTime += t.time;
      const borderClass = getCategoryColorClass(t.category);
      const badge = t.format === 'teacher' ? '<span class="badge bg-info text-white me-1">先生</span>' : '';
      hourTasksHtml += `
        <div class="card p-2 mb-2 shadow-sm task-draggable ${borderClass}" data-id="${escapeHtml(t.taskId)}" onclick="openTeacherTaskEditModal('${escJs(t.taskId)}')" style="cursor:pointer">
          <div class="d-flex justify-content-between">
            <span class="small fw-bold text-truncate">${badge}${escapeHtml(t.title)}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-1">
            <span class="badge bg-light text-secondary border rounded-pill" style="font-size:0.6rem">${escapeHtml(t.category)}</span>
            <div class="x-small text-muted text-end">${escapeHtml(t.time)}分</div>
          </div>
        </div>`;
    });

    const timeRatio = Math.min(totalTime / CONSTANTS.UNIT_TIME, 1) * 100;
    const barColor = totalTime > CONSTANTS.UNIT_TIME ? '#ffcdd2' : '#c8e6c9';
    const headerStyle = `background: linear-gradient(90deg, ${barColor} ${timeRatio}%, #f8f9fa ${timeRatio}%);`;

    hoursHtml += `
      <div class="plan-hour-row mb-3">
        <div class="plan-hour-header-v p-2 fw-bold text-center border rounded-top position-relative" style="${headerStyle}">
          第${i}時 <span class="small ms-2 fw-normal badge bg-white text-dark border">${totalTime}分</span>
        </div>
        <div class="plan-drop-zone-v p-2 border border-top-0 rounded-bottom teacher-design-dropzone" data-step="Step ${i}" style="min-height: 80px; background-color: #fff;">
          ${hourTasksHtml}
        </div>
      </div>`;
  }

  // 全体のレイアウト
  container.innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-3 p-3 pb-0 flex-shrink-0">
      <div class="d-flex align-items-center">
        <h5 class="fw-bold m-0 text-muted me-2">単元計画</h5>
        <button class="btn btn-light btn-sm text-secondary rounded-circle me-3" onclick="openUnitInfoEditModal()" title="単元情報の編集">
          <i class="bi bi-pencil-fill"></i>
        </button>
        <div class="input-group input-group-sm w-auto me-3">
          <span class="input-group-text">全</span>
          <input type="text" class="form-control text-center fw-bold" value="${totalHours}" style="width:50px;" readonly>
          <span class="input-group-text">時間</span>
          <button class="btn btn-outline-secondary" onclick="changeUnitTotalHours(1)"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
          <button class="btn btn-outline-secondary" onclick="changeUnitTotalHours(-1)"><i class="bi bi-dash-lg" aria-hidden="true"></i></button>
        </div>
        <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" onclick="createWorksheetsForCurrentUnit()" title="この単元のワークシートを用意する">
          <i class="bi bi-rocket-takeoff-fill me-2"></i>WS作成
        </button>
      </div>
    </div>
    
    <div class="row flex-grow-1 px-3 pb-3 mx-0" style="min-height:0; overflow:hidden;">
      <div class="col-4 h-100 p-0 d-flex flex-column border-end bg-white rounded-start overflow-hidden">
        <div class="p-2 border-bottom fw-bold text-muted d-flex justify-content-between align-items-center flex-shrink-0">
          <span><i class="bi bi-inbox me-2"></i>未配置・その他</span>
          <button class="btn btn-outline-primary btn-sm rounded-circle" onclick="openTeacherTaskEditModal('NEW')"><i class="bi bi-plus" aria-hidden="true"></i></button>
        </div>
        <div id="teacher-pool-container" class="flex-grow-1 overflow-auto p-2 teacher-design-dropzone" data-step="">
          ${taskPoolHtml}
        </div>
      </div>
      <div class="col-8 h-100 p-0 d-flex flex-column bg-light rounded-end overflow-hidden">
        <div id="teacher-design-scroll-view" class="flex-grow-1 overflow-auto p-3">
          <div class="alert alert-info small py-2 mb-3"><i class="bi bi-info-circle me-2"></i>ここでの変更は<strong>全員の初期計画（デフォルト）</strong>として保存されます。</div>
          ${hoursHtml}
        </div>
      </div>
    </div>`;

  // スクロール位置復元
  if (document.getElementById('teacher-pool-container')) document.getElementById('teacher-pool-container').scrollTop = poolScrollY;
  if (document.getElementById('teacher-design-scroll-view')) document.getElementById('teacher-design-scroll-view').scrollTop = designScrollY;

  // Sortable設定 (ドラッグ＆ドロップ)
  const dropZones = document.querySelectorAll('.teacher-design-dropzone');
  dropZones.forEach(el => {
    new Sortable(el, {
      group: 'teacher-design',
      sort: true,
      animation: 150,
      onAdd: function (evt) {
        const taskId = evt.item.getAttribute('data-id');
        const newStep = evt.to.getAttribute('data-step') || ""; 
        
        // ローカル更新
        const task = dataStore.masterTasks.find(t => t.taskId === taskId);
        if (task) {
          task.step = newStep;
          renderTeacherDesignView(document.getElementById('t-area')); 
          // サーバー保存。失敗すると画面は動いたのにDBは元のまま、という食い違いが残るため、
          // {success:false} も含めて失敗を検知して知らせる。
          runTeacher('updateUnitTask', [taskId, { step: newStep }], res => {
            if (res && res.success === false) handleError({ message: res.error || 'タスクの移動を保存できませんでした' });
          }, handleError);
        }
      }
    });
  });
}

      const tabStr = serializeMat(document.getElementById('ed-tab-name').value, document.getElementById('ed-tab-url').value);

      return {
        title: document.getElementById('ed-title').value,
        description: document.getElementById('ed-desc').value,

        const tempId = "TEMP_" + new Date().getTime();
        const tempTask = {
            unitId: appState.unit.id,
            taskId: tempId,
            title: newData.title,
            description: newData.description,
            estTime: newData.estTime,
            category: newData.category,
            format: newData.format,
            step: newData.step || '',
            time: newData.estTime,
            desc: newData.description,
            type: newData.type || 'must',
            textbook: newData.textbook,
            tablet: newData.tablet,
            print: newData.print
        };
        dataStore.masterTasks.push(tempTask);
        renderTeacherDesignView(document.getElementById('t-area'));
        
        // サーバー通信 (バックグラウンド)
        const rollbackAdd = (err) => {
          // 失敗時: ロールバック
          dataStore.masterTasks = dataStore.masterTasks.filter(t => t.taskId !== tempId);
          renderTeacherDesignView(document.getElementById('t-area'));
          handleError(err);
        };
        runTeacher('addUnitTask', [appState.unit.id, newData], res => {
          if (res && res.success) {
            // 成功時: IDを正式なものに差し替え
            const realId = res.taskId;
            const targetIndex = dataStore.masterTasks.findIndex(t => t.taskId === tempId);
            if (targetIndex > -1) {
              dataStore.masterTasks[targetIndex].taskId = realId;
              // IDが変わったので再描画してDOMのdata-idを更新しておく（次回の編集のため）
              renderTeacherDesignView(document.getElementById('t-area'));
            }
            showToast('success', '保存完了');
          } else {
            rollbackAdd(res);
          }
        }, rollbackAdd);
      } else {
        const t = dataStore.masterTasks.find(x => x.taskId === taskId);
        t.title = newData.title;
        t.desc = newData.description;
        t.time = newData.estTime;
        t.category = newData.category;
        t.format = newData.format;
        t.type = newData.type;
        t.step = newData.step;
        t.textbook = newData.textbook;
        t.tablet = newData.tablet;
        t.print = newData.print;
        
        renderTeacherDesignView(document.getElementById('t-area'));
        runTeacher('updateUnitTask', [taskId, newData], () => showToast('success', '更新しました'), handleError);
      }
    } else if (r.isDenied) {
      Swal.fire({ title: '削除しますか？', text: 'このタスクを削除します。', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: '削除実行' }).then(delRes => {
        if(delRes.isConfirmed) {
          dataStore.masterTasks = dataStore.masterTasks.filter(t => t.taskId !== taskId);
          renderTeacherDesignView(document.getElementById('t-area'));
          runTeacher('deleteUnitTask', [taskId], () => showToast('info', '削除しました'), handleError);
        }
      });
    }
  });
}

function changeUnitTotalHours(delta) {
  const current = appState.unit.totalHours;
  const next = current + delta;
  if (next < 1) return;
  appState.unit.totalHours = next;
  renderTeacherDesignView(document.getElementById('t-area'));
  runTeacher('updateUnitTotalHours', [appState.unit.id, next],
    () => showToast('success', '時数を変更しました'),
    e => { appState.unit.totalHours = current; handleError(e); renderTeacherDesignView(document.getElementById('t-area')); });
}

/**
 * [検証] AIインポート用JSONの内容チェック。
 * JSON.parse が通っても構造が違うとサーバー側で分かりにくいエラーになるため、
 * 何が足りないかを先生に日本語で具体的に伝える。
 * @returns {string[]} 問題点のリスト（空なら合格）
 */
function validateUnitJson(data) {
  const errors = [];
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    errors.push('全体が { } で囲まれたデータではありません');
    return errors;
  }
  if (!data.unitInfo || typeof data.unitInfo !== 'object') {
    errors.push('unitInfo（単元情報）がありません');
  } else if (!data.unitInfo.unitName && !data.unitInfo.title) {
    errors.push('unitInfo に unitName（単元名）がありません');
  }
  if (!Array.isArray(data.tasks) || data.tasks.length === 0) {
    errors.push('tasks（課題の配列）が空です');
  } else {
    const seen = new Set();
    data.tasks.forEach((t, i) => {
      if (!t || typeof t !== 'object') { errors.push(`${i + 1}番目の課題がデータの形になっていません`); return; }
      if (!t.title) errors.push(`${i + 1}番目の課題に title（タスク名）がありません`);
      if (t.id) {
        if (seen.has(t.id)) errors.push(`課題ID「${t.id}」が重複しています`);
        seen.add(t.id);
      }
    });
  }
  return errors;
}

function submitImportJson() {
  let jsonStr = document.getElementById('json-input').value.trim();
  if (!jsonStr) return;
  // AIの回答をそのまま貼ると ```json ～ ``` のコードフェンスが混ざりやすいので取り除く
  jsonStr = jsonStr.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');

  // このモーダルは確認ボタン非表示のため showValidationMessage は使えない
  let parsed;
  try { parsed = JSON.parse(jsonStr); } catch(e) { showToast('error', 'JSON形式が正しくありません（{ から } までを丸ごと貼り付けてください）'); return; }

  // 形式チェック：足りない項目を日本語で具体的に知らせる
  const problems = validateUnitJson(parsed);
  if (problems.length > 0) {
    Swal.fire({
      title: 'データに不足があります',
      html: `<div class="text-start small"><ul class="mb-0">${problems.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul><p class="mt-2 mb-0 text-muted">AIに「この形式で出力し直して」と伝えると直ることが多いです。</p></div>`,
      icon: 'warning'
    });
    return;
  }

  showLoading();
  runTeacher('importUnitJson', [jsonStr],
    d => {
      if (d.success) {
        google.script.run.withSuccessHandler(dataRes => {
          updateDataStore(dataRes.json);
          if (appState.unitList.length > 0) {
             const newUnit = appState.unitList[0];
             changeUnit(newUnit.id);
             renderUnitSelector();
          }
          hideLoading();
          Swal.close();
          Swal.fire('インポート完了', d.count + '件の課題を追加しました', 'success');
        }).withFailureHandler(handleError).getData();
      } else { handleError({ message: d.error }); }
    },
    handleError);
}

function loadRosterFromDB() {
  const classId = document.getElementById('roster-class').value;
  if (!classId) return;

  // 現在のストアからデータを取得してセット
  rosterEditData = dataStore.roster
    .filter(r => r.classId === classId)
    .sort((a,b) => a.number - b.number)
    .map(r => ({
      number: r.number || 999,
      name: r.name,
      isActive: r.isActive !== false // undefined or true -> true
    }));
  
  renderRosterTable();
}

function renderRosterTable() {
  const tbody = document.getElementById('roster-tbody');
  tbody.innerHTML = '';
  
  rosterEditData.forEach((student, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="number" class="form-control form-control-sm border-0 p-0 text-center" value="${escapeHtml(student.number)}" onchange="updateRosterData(${index}, 'number', this.value)"></td>
      <td><input type="text" class="form-control form-control-sm border-0 p-0 px-1" value="${escapeHtml(student.name)}" onchange="updateRosterData(${index}, 'name', this.value)"></td>
      <td class="text-center align-middle">
        <div class="form-check form-switch d-flex justify-content-center">
          <input class="form-check-input" type="checkbox" ${student.isActive ? 'checked' : ''} onchange="updateRosterData(${index}, 'isActive', this.checked)" title="${student.isActive?'表示':'非表示(転出)'}">
        </div>
      </td>
      <td class="text-center align-middle">
        <i class="bi bi-x text-danger cursor-pointer" role="button" tabindex="0" aria-label="この行を削除" onclick="removeRosterRow(${index})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); removeRosterRow(${index});}"></i>
      </td>
    `;
    // 非表示(転出)の場合は行をグレーアウト
    if (!student.isActive) {
        tr.style.backgroundColor = '#f8f9fa';
        tr.style.color = '#adb5bd';
        tr.querySelectorAll('input[type="text"], input[type="number"]').forEach(el => el.style.color = '#adb5bd');
    }
    tbody.appendChild(tr);
  });
  
  document.getElementById('roster-count').textContent = `${rosterEditData.length}名`;
}

function updateRosterData(index, field, value) {
  if (field === 'number') rosterEditData[index].number = parseInt(value) || 0;
  if (field === 'name') rosterEditData[index].name = value;
  if (field === 'isActive') {
      rosterEditData[index].isActive = value;
      renderRosterTable(); // 色更新のため再描画
  }
}

function addRosterRow() {
  const nextNum = rosterEditData.length > 0 ? Math.max(...rosterEditData.map(s=>s.number)) + 1 : 1;
  rosterEditData.push({ number: nextNum, name: '', isActive: true });
  renderRosterTable();
}

function removeRosterRow(index) {
  rosterEditData.splice(index, 1);
  renderRosterTable();
}

function handlePaste(e) {
  // クリップボードのテキストを直接読み、1回だけ解析する。
  const cb = e.clipboardData || window.clipboardData;
  if (cb) {
    const text = cb.getData('text');
    e.preventDefault();
    if (text) parsePastedText(text);
    if (e.target) e.target.value = '';
    return;
  }
  // clipboardData が使えない環境向けのフォールバック（貼り付け後の値を1回だけ読む）
  const el = e.target;
  setTimeout(() => {
    const text = el.value;
    if (text) parsePastedText(text);
    el.value = '';
  }, 100);
}

function parsePastedText(text) {
  // 改行で分割
  const lines = text.split(/\r\n|\n|\r/).filter(line => line.trim() !== '');
  if (lines.length === 0) return;

  let addedCount = 0;
  
  lines.forEach(line => {
    // タブまたはカンマで分割
    const cols = line.split(/\t|,/).map(c => c.trim()).filter(c => c);
    if(cols.length === 0) return;

    let num = 0;
    let name = "";
    
    // データ解析ロジック
    // パターン1: [番号] [名前] ...
    if (cols.length >= 2 && !isNaN(cols[0])) {
        num = parseInt(cols[0]);
        name = cols[1];
    } 
    // パターン2: [名前] のみ
    else if (cols.length >= 1) {
        // 自動採番: 現在の最大値 + 1
        const maxNum = rosterEditData.length > 0 ? Math.max(...rosterEditData.map(s=>s.number)) : 0;
        num = maxNum + 1;
        name = cols[0];
    }
    
    if (name) {
        // 名前が重複していないか簡易チェック（任意）
        rosterEditData.push({ number: num, name: name, isActive: true });
        addedCount++;
    }
  });
  
  if (addedCount > 0) {
      showToast('success', `${addedCount}件を取り込みました`);
      renderRosterTable();
  }
}

function loadRosterFromCSV(input) {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const buf = e.target.result;
    // まず UTF-8 として読む（Googleスプレッドシート等の書き出しはUTF-8）。
    // 文字化け（U+FFFD 置換文字）が出たら Shift_JIS として読み直す（Excel対策）。
    let text = '';
    try {
      text = new TextDecoder('utf-8', { fatal: false }).decode(buf);
      if (text.indexOf('�') !== -1) {
        text = new TextDecoder('shift_jis', { fatal: false }).decode(buf);
      }
    } catch (err) {
      // TextDecoder が使えない/未知のエンコーディングのときは UTF-8 の結果をそのまま使う
      try { text = new TextDecoder().decode(buf); } catch (e2) { text = ''; }
    }
    parsePastedText(text); // 既存のパース関数を流用
    input.value = ''; // リセット
  };
  reader.readAsArrayBuffer(file);
}

function cleanRosterData() {
  // 1. 名前のスペース整形（全角・半角スペースを統一）
  // 2. 空行削除
  // 3. 番号順にソート
  
  rosterEditData = rosterEditData.filter(s => s.name && s.name.trim() !== '');
  rosterEditData.forEach(s => {
      // 姓と名の間のスペースを半角スペース1つに統一
      s.name = s.name.replace(/\s+/g, ' ').trim(); 
  });
  
  // 番号順にソート
  rosterEditData.sort((a, b) => a.number - b.number);
  
  renderRosterTable();
  showToast('info', 'データを整理・ソートしました');
}

function submitSaveRoster() {
  const classId = document.getElementById('roster-class').value.trim();
  // このモーダルは確認ボタン非表示のため showValidationMessage は使えない
  if (!classId) { showToast('error', 'クラス名を入力してください'); return; }
  
  if (rosterEditData.length === 0) {
     if(!confirm('名簿が空ですが、このまま保存しますか？（現在の名簿が消去されます）')) return;
  }

  showLoading();
  runTeacher('saveClassRoster', [classId, rosterEditData], // オブジェクト配列を送信
    res => {
      if (res.success) {
        google.script.run.withSuccessHandler(d => {
          updateDataStore(d.json);
          hideLoading();
          Swal.close();
          showToast('success', `${classId}の名簿を更新しました`);
        }).getData();
      } else { handleError(res); }
    },
    handleError);
}

function showStudentTaskDetail(name, tid) {
  const t = dataStore.masterTasks.find(x => x.taskId === tid);
  if (!t) return;
  const p = (dataStore.clsProgress[name] && dataStore.clsProgress[name][tid]) || {};
  Swal.fire({
    title: `${escapeHtml(name)} さんの状況`,
    html: `<div class="text-start"><h6 class="fw-bold text-primary">${escapeHtml(t.title)}</h6><div class="mb-3"><span class="badge bg-secondary me-1">状態: ${escapeHtml(p.status||'未')}</span></div><div class="p-3 bg-light rounded mb-3 small">${escapeHtml(p.reflection)||'メモなし'}</div><hr><div class="d-flex justify-content-center gap-2"><button class="btn btn-outline-primary rounded-circle p-2" style="width:50px;height:50px;font-size:1.5rem" onclick="sendStamp('${escJs(name)}','${escJs(tid)}','check')">✅</button><button class="btn btn-outline-primary rounded-circle p-2" style="width:50px;height:50px;font-size:1.5rem" onclick="sendStamp('${escJs(name)}','${escJs(tid)}','good')">👍</button><button class="btn btn-outline-primary rounded-circle p-2" style="width:50px;height:50px;font-size:1.5rem" onclick="sendStamp('${escJs(name)}','${escJs(tid)}','great')">💮</button><button class="btn btn-outline-primary rounded-circle p-2" style="width:50px;height:50px;font-size:1.5rem" onclick="sendStamp('${escJs(name)}','${escJs(tid)}','support')">🚩</button></div></div>`,
    showConfirmButton: false,
    showCloseButton: true
  });
}

function sendStamp(name, tid, stamp) {
  if (!dataStore.clsFeedback[name]) dataStore.clsFeedback[name] = {};
  dataStore.clsFeedback[name][tid] = stamp;
  renderTeacherDashboardContent(); // 更新
  showToast('success', 'スタンプ送信');
  runTeacher('sendFeedback', [name, tid, stamp, appState.view.teacherClassId !== 'All' ? appState.view.teacherClassId : '']);
}

/**
 * [モーダル] タスク詳細表示（先生用・リンク対応）
 */
function showTeacherTaskDetailSimple(tid) {
  const t = dataStore.masterTasks.find(x => x.taskId === tid);
  if (!t) return;

  const parseMat = (str) => { try { return JSON.parse(str||'{}'); } catch(e){ return {name:str,url:''}; } };
  const materials = [
    { type: 'textbook', label: '教科書・資料', icon: 'bi-book', data: parseMat(t.textbook) },
    { type: 'tablet', label: 'タブレット・アプリ', icon: 'bi-tablet', data: parseMat(t.tablet) },
    { type: 'print', label: 'プリント・その他', icon: 'bi-file-earmark-text', data: parseMat(t.print) }
  ];

  let materialHtml = '';
  materials.forEach(m => {
    if (m.data.name) {
      if (m.data.url) {
        materialHtml += `<a href="${escUrl(m.data.url)}" target="_blank" rel="noopener" class="btn btn-outline-primary btn-sm w-100 mb-2 text-start text-truncate"><i class="bi ${m.icon} me-2"></i>${escapeHtml(m.data.name)}</a>`;
      } else {
        materialHtml += `<div class="mb-2 text-truncate"><span class="badge bg-light text-dark border me-2"><i class="bi ${m.icon}"></i> ${m.label}</span><span class="small">${escapeHtml(m.data.name)}</span></div>`;
      }
    }
  });

  Swal.fire({
    title: escapeHtml(t.title),
    html: `
      <div class="text-start">
        <p class="text-muted border p-3 rounded bg-light mb-3">${escapeHtml(t.desc || '説明なし')}</p>
        ${materialHtml ? '<div class="mb-3 border-top pt-2"><div class="small fw-bold text-muted mb-2">学習リソース</div>' + materialHtml + '</div>' : ''}
        <div class="text-end small text-muted">時間: ${escapeHtml(t.time)}分</div>
      </div>`,
    showConfirmButton: false,
    showCloseButton: true
  });
}
