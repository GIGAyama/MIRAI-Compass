<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="自由進度学習支援アプリケーション「みらいコンパス」">
  <meta name="theme-color" content="#1a73e8">
  <meta name="color-scheme" content="light">
  <title>みらいコンパス</title>

  <!--
    === Content Security Policy ===
    このページのスクリプトは app.js / install-hook.js の2本だけで、
    インラインの <script> も onclick= も使っていません。
    そのため 'unsafe-inline' を足さずに script-src 'self' で締められます。

    frame-src に script.google.com / googleusercontent.com が要るのは、
    アプリ本体（GAS）を iframe で表示するためです。

    ⚠️ frame-ancestors はここには書きません。<meta> で配ると無視され、
       読み込みのたびにコンソールへ警告が出るだけになります。
       他サイトへの埋め込みを止めるには HTTP ヘッダーが必要ですが、
       GitHub Pages では足せません。独自ドメインや CDN を挟むときに
       サーバー側で frame-ancestors 'self' を設定してください。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    frame-src https://script.google.com https://*.googleusercontent.com;
    worker-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!--
    ① インストールの合図を「いちばん先に」受け取る。
       Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
       ほかの読み込みより後だと合図を取りこぼし、通信が遅い端末で
       「インストール」ボタンが出なくなる。
  -->
  <script src="install-hook.js"></script>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <!-- ⚠️ apple-touch-icon には透明を含む画像を指さない。
       iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
       この画像は tools/build-icons.mjs が透明 0 画素で作り直したもの。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="みらいコンパス">

  <style>
    :root {
      --primary: #0a58ca;   /* 文字用。#1a73e8 は白地で 4.27 しかなく基準に届かない */
      --primary-bg: #1a73e8;/* 面用 */
      --muted: #5c636a;     /* 白地で 5.99。以前の #6c757d は 4.68、#adb5bd は 2.03 だった */
      --text: #3c4043;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* 100vh はモバイルのアドレスバー分だけはみ出すので dvh を使う */
    html, body { height: 100dvh; overflow: hidden; }
    @supports not (height: 100dvh) { html, body { height: 100vh; } }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      background: #f0f2f5;
      color: var(--text);
      line-height: 1.8;
      font-size: clamp(15px, 1.6vw + 10px, 18px);
      touch-action: manipulation;
    }

    /* ===== アプリ表示（全画面iframe） ===== */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff;
    }

    /* 設定を開くための隠しホットスポット（左上すみを5回タップ） */
    #settings-hotspot {
      position: fixed;
      top: var(--safe-t); left: var(--safe-l);
      width: 48px; height: 48px;
      z-index: 50;
      background: transparent;
    }

    /* ===== 初期設定 / 設定画面 ===== */
    #setup-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: calc(24px + var(--safe-t)) calc(24px + var(--safe-r))
               calc(24px + var(--safe-b)) calc(24px + var(--safe-l));
      background: #f0f2f5;
      z-index: 100;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .setup-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 32px 28px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .setup-card img { width: 84px; height: 84px; margin-bottom: 12px; }
    .setup-card h1 { font-size: clamp(20px, 2.6vw + 12px, 26px); color: var(--primary); margin-bottom: 8px; }
    .setup-card p.lead { font-size: .9em; color: var(--muted); margin-bottom: 20px; }
    .setup-card label {
      display: block;
      text-align: left;
      font-size: .8em;
      font-weight: bold;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .setup-card input[type="url"] {
      width: 100%;
      min-height: 44px;          /* 指で押せる高さ */
      padding: 12px 14px;
      font-size: .9em;
      border: 2px solid #dee2e6;
      border-radius: 12px;
      outline: none;
      margin-bottom: 6px;
    }
    .setup-card input[type="url"]:focus { border-color: var(--primary); }
    .setup-hint { font-size: .78em; color: var(--muted); text-align: left; margin-bottom: 18px; }
    .setup-error {
      display: none;
      font-size: .85em;
      color: #b02a37;            /* 白地で 5.09。以前の #ea4335 は 3.68 で基準未満だった */
      background: rgba(176, 42, 55, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      text-align: left;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      min-height: 44px;          /* タップ領域 */
      padding: 12px 32px;
      font-size: 1em;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s;
      text-decoration: none;
    }
    .btn:hover { opacity: .85; }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
      font-size: .9em;
      padding: 10px 20px;
    }
    .btn-install {
      background: #fff;
      color: var(--primary);
      border: 2px solid var(--primary);
      width: 100%;
      margin-top: 12px;
      display: none;             /* 案内できるときだけ出す */
    }
    .setup-footer { margin-top: 16px; font-size: .78em; color: var(--muted); }

    .ios-hint {
      display: none;
      margin-top: 14px;
      font-size: .82em;
      color: var(--muted);
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
    }

    /* オフライン通知バー */
    #offline-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      padding-top: calc(8px + var(--safe-t));
      background: #fbbc04;
      color: #3c4043;            /* #fbbc04 の上で 9.6:1 */
      font-size: .9em;
      font-weight: bold;
      text-align: center;
      padding-bottom: 8px;
      z-index: 200;
    }

    /* 更新の帯。押されるまで切り替えない。
       既定は非表示で、app.js が hidden 属性を外したときだけ出す。 */
    #update-bar {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      padding: 12px calc(16px + var(--safe-r)) calc(12px + var(--safe-b)) calc(16px + var(--safe-l));
      background: #0a58ca;
      color: #fff;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: .95em;
    }
    #update-bar[hidden] { display: none; }
    #btn-update {
      background: #fff;
      color: #0a58ca;
      padding: 8px 20px;
      min-height: 44px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (forced-colors: active) {
      .btn, .setup-card, input[type="url"] { border: 2px solid ButtonText; }
    }
  </style>
</head>
<body>

  <!-- オフライン通知 -->
  <div id="offline-bar" role="status" aria-live="polite">オフラインです。インターネットに接続すると利用できます。</div>

  <!-- アプリ本体（GAS）を表示する全画面フレーム -->
  <iframe id="app-frame" title="みらいコンパス"
          allow="clipboard-read; clipboard-write; autoplay"></iframe>

  <!-- 設定を開く隠しホットスポット（左上すみを素早く5回タップ） -->
  <div id="settings-hotspot"></div>

  <!-- 初期設定 / 設定画面 -->
  <div id="setup-screen">
    <div class="setup-card">
      <img src="icons/icon-192.png" width="84" height="84" alt="">
      <h1>&#129517; みらいコンパス</h1>
      <p class="lead">
        はじめに、先生から伝えられた<br>
        <strong>みらいコンパスのURL（Google Apps ScriptのウェブアプリURL）</strong><br>
        を入力してください。この設定は一度だけです。
      </p>

      <label for="gas-url">ウェブアプリURL</label>
      <input type="url" id="gas-url" placeholder="https://script.google.com/macros/s/........./exec"
             autocomplete="off" spellcheck="false">
      <div class="setup-hint">「デプロイ」で発行された <code>/exec</code> で終わるURLです。</div>
      <div class="setup-error" id="setup-error" role="alert"></div>

      <button class="btn btn-primary" id="btn-save" type="button">アプリをはじめる</button>

      <!-- インストールボタン。案内できるときだけ出る（app.js で制御）。 -->
      <button class="btn btn-install" id="btn-install" type="button">
        この端末にアプリとして入れる
      </button>

      <!-- iPhone / iPad には beforeinstallprompt が無いので手順を案内する -->
      <div class="ios-hint" id="ios-hint">
        <strong>iPhone・iPad の場合</strong><br>
        画面下の「共有」ボタン（□に↑）を押し、
        「ホーム画面に追加」を選ぶとアプリとして使えます。
      </div>

      <div id="extra-actions" style="display:none; margin-top: 14px;">
        <a class="btn btn-secondary" href="#" id="link-open-tab" target="_blank" rel="noopener">新しいタブで開く</a>
        <button class="btn btn-secondary" id="btn-clear" type="button">設定をリセット</button>
      </div>

      <div class="setup-footer">&copy; 2026 みらいコンパス Project</div>
    </div>
  </div>

  <!-- 更新の案内。押されるまで新しい版に切り替えない。 -->
  <div id="update-bar" role="status" aria-live="polite" hidden>
    <span>あたらしい ばんが あります</span>
    <button class="btn" id="btn-update" type="button">さいしんに する</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
