## **■ 授業デザインのルール**
### **1\. 授業の時間構成（サンドイッチ型）**
* **第1時**:  
  * 全体を teacher\_led（先生主導）とし、単元の導入と学習計画の作成（オリエンテーション）を行う。  
* **第2時以降**:  
  * 以下の順序で構成する（45分授業のモデル）。  
  * **① 導入（10分）**: 先生主導のミニレッスン。重要な概念の解説や、全体への共有事項。（teacher\_led, タイトルに【導入】と記載）  
  * **② 展開（30分）**: 児童主体の自由進度学習。（individual）  
  * **③ 終末（5分）**: 先生主導の振り返り、次時の予告。（teacher\_led, タイトルに【終末】と記載）
### **2\. タスク（課題）の作成方針**
* **必修課題 (must)**:  
  * 「標準的な進度」を示すため、推奨する実施回（step）を設定する。  
* **選択課題 (challenge)**:  
  * 児童の興味に合わせた発展的な課題や、別のアプローチの課題。  
  * 推奨回（step）を設定してもよいし、いつでも取り組めるプール課題として step を空欄（""）にしてもよい。  
* **時間の粒度**:  
  * 自由進度学習の時間は30分確保されているが、タスクの目安時間（estimatedTime）は15分〜45分など、内容に応じて柔軟に設定する（必ずしも15分刻みでなくてよい）。
### **3\. データ出力のルール（重要：アプリの仕様対応）**
アプリ側で正しく表示させるため、JSONの tasks 配列を出力する際は、**同一Step内で以下の順序になるように必ずソート（並べ替え）**して出力すること。
1. **先頭**: teacher\_led かつ タイトルに【導入】を含むタスク  
2. **中間**: individual なタスク（必修・選択）  
3. **最後**: teacher\_led かつ タイトルに【終末】を含むタスク

  // サーバー(Code.gs)の getAppInitialData 関数を呼び出す

/**
 * [機能] 初期データの受信処理

function handleInitialResponse(res) {
  if (!res.success) { handleError({ message: res.error }); return; }
  ssUrl = res.ssUrl;

  // 「DBを開く」ボタンの設定
  const btnSs = document.getElementById('btn-view-ss');
  if (btnSs && ssUrl) btnSs.onclick = () => window.open(ssUrl, '_blank');

  // システム未初期化（スプレッドシートがない）の場合
  if (!res.isInitialized) {
    renderSetupOverlay(); // 初期設定画面を表示
  } else {
    loadMainData();       // メインデータを読み込み開始
  }
}

/**
 * [機能] 自動更新タイマー（ポーリング）
 * 10秒ごとにサーバーから最新の「状況データ（LiveStatus）」だけを取得します。
 * これにより、先生の画面で子供たちのSOSなどがリアルタイムに反映されます。
 */
let pollTickCount = 0; // ポーリング回数（児童のパルス取得の間引きに使う）

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  pollTickCount = 0;

  autoRefreshTimer = setInterval(() => {
    // ブラウザのタブが裏に隠れている時は通信を止める（PC負荷軽減）
    if (document.hidden) return;
    pollTickCount++;

    // 【DB読込】LiveStatusシートのみを軽量取得
    google.script.run
      .withSuccessHandler(res => {
        if (res.success && res.live) {
          // データを更新
          dataStore.liveStatus = res.live;

          // 先生モードなら、画面全体を再描画せず、カードのステータスだけ書き換える（高速化）
          if (appState.mode === 'teacher') {
            if (typeof updateLiveViews === 'function') updateLiveViews(); // js_teacher.htmlで定義
            checkSosAndPlaySound();
          }
          // 生徒モードなら、先生からの呼び出し通知などをチェック
          else if (appState.mode === 'student') {
            checkScheduleAndNotify();
          }
        }
      })
      .withFailureHandler(e => console.error("Polling Error", e))
      .getLiveStatusSnapshot(); // サーバー側の軽量関数

    // 児童モードでは30秒に1回、先生スタンプと時間割の「パルス」も取得する。
    // これで開きっぱなしの児童画面にも先生の反応（スタンプ・授業配信）がほぼリアルタイムで届く。
    if (appState.mode === 'student' && appState.user.name && pollTickCount % 3 === 0) {
      fetchStudentPulse();
    }

    // 先生モードでは30秒に1回、クラスの進捗集計も取得する（進捗一覧のライブ更新）。
    if (appState.mode === 'teacher' && pollTickCount % 3 === 0 && typeof fetchTeacherProgressSnapshot === 'function') {
      fetchTeacherProgressSnapshot();
    }

  }, CONSTANTS.REFRESH_INTERVAL);
}

/**
 * [機能] 児童向け軽量同期（先生スタンプ・時間割）
 * getStudentProgress の全シート読みは重いので、専用の軽量APIを叩く。
 * 新しいスタンプが届いていたら、その場でお祝い演出つきで知らせる。
 */
function fetchStudentPulse() {
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success || !res.json) return;
      let d;
      try { d = JSON.parse(res.json); } catch (e) { return; }

      // 時間割はまるごと最新に差し替え（配信直後の児童画面にも通知バーが出る）
      if (Array.isArray(d.schedules)) {
        appState.schedules = d.schedules;
        if (appState.mode === 'student') checkScheduleAndNotify();
      }

      // スタンプは差分を取り、増えた分だけお知らせする
      if (d.feedback && typeof d.feedback === 'object') {
        const prev = dataStore.studentFeedback || {};
        const fresh = Object.keys(d.feedback).filter(tid => d.feedback[tid] && d.feedback[tid] !== prev[tid]);
        dataStore.studentFeedback = d.feedback;
        if (fresh.length > 0 && typeof onNewStampsArrived === 'function') {
          onNewStampsArrived(fresh); // js_student.html で演出とUI反映を行う
        }
      }
    })
    .withFailureHandler(e => console.error("Pulse Error", e))
    .getStudentPulse(appState.user.name);
}

/**
 * [機能] 取得したデータを変数(dataStore)に格納・整理する
 */
function updateDataStore(jsonStr) {
  const d = JSON.parse(jsonStr);
  dataStore.masterTasks = d.unit || [];
  dataStore.liveStatus = d.live || [];
  dataStore.clsProgress = d.progress || {};
  dataStore.clsFeedback = d.feedback || {};
  dataStore.clsMyTasks = d.myTasks || {};
  dataStore.clsPlans = d.plans || {};
  dataStore.clsReflections = d.dailyReflections || {};
  dataStore.clsPortfolios = d.portfolios || {};
  dataStore.roster = d.roster || [];
  appState.schedules = d.schedules || [];

  // 単元リストを作成（UnitMasterから単元IDごとにまとめる）
  const unitsMap = new Map();
  dataStore.masterTasks.forEach(t => {
    if (t.unitId && !unitsMap.has(t.unitId)) {
      const uInfo = t.unitInfo || {};
      unitsMap.set(t.unitId, {
        id: t.unitId,
        title: uInfo.title || '無題の単元',
        subject: uInfo.subject || '',
        totalHours: Number(t.totalHours) || 8,
        grade: uInfo.grade || '',
        goal: uInfo.goal || '',
        description: uInfo.description || ''
      });
    }
  });
  // 新しい単元順に並べ替え
  appState.unitList = Array.from(unitsMap.values()).sort((a, b) => b.id.localeCompare(a.id));

  // 現在の単元を選択（未選択なら最新の単元）
  if (appState.unitList.length > 0 && !appState.unit.id) {
    const savedId = localStorage.getItem(CONSTANTS.LS_KEY_UNIT);
    const target = appState.unitList.find(u => u.id === savedId) || appState.unitList[0];
    appState.unit.id = target.id;
    appState.unit.title = target.title;
    appState.unit.totalHours = target.totalHours;
  } else if (appState.unitList.length === 0) {
    appState.unit.id = "";
    appState.unit.title = "単元データなし";
  }

  // クラスリストを作成（データが存在するクラス一覧）
  const classes = new Set();
  dataStore.liveStatus.forEach(s => { if(s.classId) classes.add(s.classId); });
  dataStore.roster.forEach(r => { if(r.classId) classes.add(r.classId); });
  if(classes.size === 0) classes.add('1組');
  dataStore.classList = Array.from(classes).sort();
}

/**
 * [機能] 単元の切り替え
 * ドロップダウンで単元が変更された時に呼ばれます。
 */
function changeUnit(unitId) {
  const target = appState.unitList.find(u => u.id === unitId);
  if (target) {
    appState.unit.id = target.id;
    appState.unit.title = target.title;
    appState.unit.totalHours = target.totalHours;
    localStorage.setItem(CONSTANTS.LS_KEY_UNIT, unitId);
    
    // 生徒モード：自分のデータを再読み込み
    if(appState.mode === 'student' && appState.user.name) {
      if (typeof syncStudentPlan === 'function') syncStudentPlan();
      if (typeof renderStudentView === 'function') renderStudentView();
      if (typeof loginStudent === 'function') loginStudent(true); // サーバーからデータ取得
      if (typeof submitUserStatus === 'function') submitUserStatus(getSelfStatusMode()); 
    } 
    // 先生モード：画面再描画
    else if (appState.mode === 'teacher') {
      if (typeof renderTeacherView === 'function') renderTeacherView();
    }
  }
}

/**
 * [機能] モード切替（生徒 ⇔ 先生）
 */
function switchMode(newMode) {
  appState.mode = newMode;

  // 生徒モードへの切り替え時はデータを再取得して最新状態にする
  if(newMode === 'student') {
    showLoading();
    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          updateDataStore(res.json);
          renderApp(); // 画面描画
          startAutoRefresh(); // 自動更新開始
          hideLoading();
        } else {
          handleError({message: res.error});
        }
      })
      .withFailureHandler(handleError)
      .getData();
  } else {
    // 先生モードへは即時切り替え
    renderApp();
    startAutoRefresh(); // LIVEモニタリング用の自動更新を確実に開始
  }
}

/**
 * [機能] 画面全体の描画ディスパッチャ（振り分け）
 * 現在のモードに合わせて、生徒用または先生用の画面を描画します。
 */
function renderApp() {
  try {
    const mainEl = document.querySelector('main');
    const settingsBtn = document.getElementById('btn-settings');
    const exitBtn = document.getElementById('btn-exit-teacher');
    const presentBtn = document.getElementById('btn-presentation');

    if (appState.mode === 'teacher') {
      // 先生モード
      if (typeof removeStudentBottomNav === 'function') removeStudentBottomNav(); // 児童タブバーを消す
      // 児童モードの浮遊UI（タイマー・授業通知バー）が残らないよう片付ける
      ['my-timer-widget', 'timer-launcher', 'schedule-notify-bar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.remove();
      });
      document.body.classList.remove('has-schedule-bar');
      mainEl.classList.add('teacher-mode'); // 横幅制限を解除
      settingsBtn.classList.remove('d-none'); // 設定ボタン表示
      exitBtn.classList.remove('d-none');     // 終了ボタン表示
      if (presentBtn) presentBtn.classList.remove('d-none'); // 提示モードボタン表示
      if (typeof renderTeacherView === 'function') renderTeacherView();
    } else {
      // 生徒モード
      mainEl.classList.remove('teacher-mode');
      settingsBtn.classList.add('d-none');
      exitBtn.classList.add('d-none');
      if (presentBtn) presentBtn.classList.add('d-none');
      // 児童モードへ戻るときは提示モードも解除する
      document.body.classList.remove('presentation', 'names-hidden');
      const nameBtn = document.getElementById('btn-toggle-names');
      if (nameBtn) nameBtn.remove();

      const savedName = localStorage.getItem(CONSTANTS.LS_KEY_NAME);
      const savedClass = localStorage.getItem(CONSTANTS.LS_KEY_CLASS);
      
      // 名前がまだ入力されていない場合
      if (!appState.user.name && savedName) {
        // 保存された名前があれば自動ログイン
        appState.user.name = savedName;
        appState.user.classId = savedClass || "1組";
        if (typeof loginStudent === 'function') loginStudent(true);
      } else if (!appState.user.name) {
        // 名前入力画面を表示
        if (typeof renderNameEntry === 'function') renderNameEntry();
      } else {
        // ログイン済みなら学習画面を表示
        if (typeof syncStudentPlan === 'function') syncStudentPlan();
        if (typeof renderStudentView === 'function') renderStudentView();
      }
    }
  } catch (e) {
    console.error(e);
    handleError({ message: "描画エラー: " + e.message });
  }
}

    `<option value="${escapeHtml(u.id)}" ${u.id === appState.unit.id ? 'selected' : ''}>${u.subject ? '【'+escapeHtml(u.subject)+'】' : ''} ${escapeHtml(u.title)}</option>`

// スケジュール通知のチェック（生徒用）
function checkScheduleAndNotify() {
  if (!appState.user.classId || appState.schedules.length === 0) return;
  
  const now = new Date();
  const dateStr = now.getFullYear() + "-" + ('0' + (now.getMonth() + 1)).slice(-2) + "-" + ('0' + now.getDate()).slice(-2);
  const timeStr = ('0' + now.getHours()).slice(-2) + ":" + ('0' + now.getMinutes()).slice(-2);
  
  // 今の日時・クラスに一致するスケジュールを探す
  const currentSchedule = appState.schedules.find(s => 
    s.classId === appState.user.classId && 
    s.date === dateStr &&
    s.startTime <= timeStr && s.endTime >= timeStr
  );

  let notifyBar = document.getElementById('schedule-notify-bar');
  
  if (currentSchedule) {
    const unit = appState.unitList.find(u => u.id === currentSchedule.unitId);
    const unitTitle = unit ? unit.title : "不明な単元";
    const msg = currentSchedule.message || `ただ今の授業：${unitTitle} 第${currentSchedule.hour}時`;
    const msgHtml = escapeHtml(msg);
    
    // 通知バーを作成・更新
    if (!notifyBar) {
      notifyBar = document.createElement('div');
      notifyBar.id = 'schedule-notify-bar';
      notifyBar.className = 'bg-info text-white text-center py-2 px-3 shadow-sm cursor-pointer animate__animated animate__fadeInDown';
      notifyBar.style.cssText = 'position:fixed; top:60px; left:0; right:0; z-index:1020;';
      notifyBar.onclick = () => {
        // 通知クリックで該当単元へ移動
        if(unit) {
          changeUnit(unit.id);
          if (typeof changeCurrentHour === 'function') changeCurrentHour(currentSchedule.hour);
          if(currentSchedule.message) Swal.fire({ title: '先生からのメッセージ', text: currentSchedule.message, icon: 'info' });
        }
      };
      document.body.appendChild(notifyBar);
    }
    notifyBar.innerHTML = `<i class="bi bi-broadcast me-2"></i><span class="fw-bold">${msgHtml}</span> <small class="ms-2 border rounded-pill px-2">移動する</small>`;
    // バーは fixed なので、そのままだと画面上部の内容（あいさつ等）に重なる。
    // 本文側に余白を足すためのクラスを付ける（css.html 参照）。
    document.body.classList.add('has-schedule-bar');
  } else {
    // 時間外なら通知バーを消す
    if (notifyBar) notifyBar.remove();
    document.body.classList.remove('has-schedule-bar');
  }
}

// 音声通知（SOS用）
function unlockAudio() { 
  const audio = document.getElementById('sos-chime'); 
  if (audio && !appState.sound.unlocked) { 
    // ユーザー操作時に一度無音で再生して、ブラウザの自動再生制限を解除する
    audio.volume = 0; 
    audio.play().then(() => { 
      audio.pause(); 
      audio.currentTime = 0; 
      audio.volume = 0.5; 
      appState.sound.unlocked = true; 
    }).catch(e => {}); 
  } 
}

function checkSosAndPlaySound() {
  const currentSosCount = dataStore.liveStatus.filter(d => d.mode === 'たすけて' || d.mode === 'sos').length;
  // SOSの数が増えた時だけ音を鳴らす
  if (currentSosCount > appState.sound.prevSosCount) {
    const audio = document.getElementById('sos-chime');
    if (audio) {
      audio.play().catch(() => {
        // 音が鳴らせない（自動再生ブロック等）ときは、黙って握りつぶさず一度だけ画面で知らせる。
        if (!appState.sound.warned) {
          appState.sound.warned = true;
          showToast('warning', 'SOSがありました（音は再生できませんでした）');
        }
      });
    }
  }
  appState.sound.prevSosCount = currentSosCount;
}

// HTMLエスケープ（自由入力テキストを画面に埋め込む際のXSS・表示崩れ対策）
function escapeHtml(str) {
  return MiraiShared.escHtml(str);
}

// === MIRAI SHARED (両アプリ共通・バイト単位で同一に保つこと) ==========================
// みらいコンパス / みらいパスポート を単一プロジェクトへ統合するための共通土台。
// ここに書くものは両リポジトリで完全に同一。片方だけ直さないこと。
var MiraiShared = (function () {
  function escHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // href/src 用。javascript: など実行系スキームを無害化する。data:image/ だけは許可。
  function escUrl(url) {
    if (url === null || url === undefined) return '';
    var raw = String(url);
    var probe = raw.replace(/[\u0000-\u0020\u007F-\u00A0]/g, '').toLowerCase();
    if (/^(javascript|vbscript|file|blob):/.test(probe)) return '#';
    if (/^data:/.test(probe)) return /^data:image\//.test(probe) ? escHtml(raw) : '#';
    return escHtml(raw);
  }
  // JS文字列リテラルへ埋め込む値のエスケープ（onclick="f('...')" 用の移行保険。原則は addEventListener）。
  function escJs(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
      .replace(/"/g, '\\"').replace(/</g, '\\x3C').replace(/\r?\n/g, '\\n');
  }
  // 児童の在席ステータス。正規: 'normal' | 'focus' | 'sos'
  var PRESENCE = { NORMAL: 'normal', FOCUS: 'focus', SOS: 'sos' };
  var PRESENCE_LABEL = { normal: '通常', focus: 'しゅうちゅう', sos: 'たすけて' };
  function normPresence(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === 'sos' || s === 'たすけて' || s === 'help') return 'sos';
    if (s === 'focus' || s === 'しゅうちゅう' || s === '集中') return 'focus';
    return 'normal';
  }
  // 学習タスクの進捗。正規: 'todo' | 'doing' | 'done'
  var PROGRESS = { TODO: 'todo', DOING: 'doing', DONE: 'done' };
  function normProgress(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === 'done' || s === '完了' || s === 'できた') return 'done';
    if (s === 'doing' || s === 'working' || s === '途中' || s === 'とちゅう') return 'doing';
    return 'todo';
  }
  // 提出物のステータス（パスポート）。正規: 'draft' | 'submitted' | 'graded'
  var SUBMISSION = { DRAFT: 'draft', SUBMITTED: 'submitted', GRADED: 'graded' };
  function normSubmission(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === 'graded' || s === '添削済み' || s === '返却') return 'graded';
    if (s === 'submitted' || s === '提出' || s === 'done') return 'submitted';
    return 'draft';
  }
  return {
    escHtml: escHtml, escUrl: escUrl, escJs: escJs,
    PRESENCE: PRESENCE, PRESENCE_LABEL: PRESENCE_LABEL, normPresence: normPresence,
    PROGRESS: PROGRESS, normProgress: normProgress,
    SUBMISSION: SUBMISSION, normSubmission: normSubmission
  };
})();
// 既存コードとの互換のため、共通ヘルパーをグローバルへ橋渡しする。
var escUrl = MiraiShared.escUrl;
var escJs = MiraiShared.escJs;

// ステップ文字列 ("Step 1") から数値 (1) を取り出す
function getStepNumber(stepStr) {
  if(!stepStr) return -1;
  const match = stepStr.match(/\d+/);
  return match ? parseInt(match[0], 10) : -1;
}

// トースト通知（右上のポップアップ）
// ⚠️ SweetAlert2 は同時に1つしか表示できず、モーダル（名簿管理・単元管理など）を
//    開いている最中に Swal のトーストを出すと、モーダルごと閉じて編集内容が消える。
//    実際に、ポーリングの SOS 警告トーストが名簿編集中のモーダルを閉じる事故が起きる。
//    モーダル表示中は Swal を使わない自前の軽量トーストに切り替える。
function showToast(icon, title) {
  const popup = (typeof Swal !== 'undefined' && Swal.isVisible()) ? Swal.getPopup() : null;
  const modalOpen = popup && !popup.classList.contains('swal2-toast');
  if (modalOpen) {
    showLiteToast(icon, title);
  } else {
    Swal.fire({ toast: true, position: 'top-end', icon: icon, title: title, timer: 2000, showConfirmButton: false });
  }
  // スクリーンリーダー向けに読み上げる（エラー系アイコンは alert 領域へ）
  if (typeof announce === 'function') announce(title, icon === 'error' || icon === 'warning');
}

// Swal を使わない軽量トースト（モーダルと共存できる）
function showLiteToast(icon, title) {
  let host = document.getElementById('lite-toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'lite-toast-host';
    document.body.appendChild(host);
  }
  const colors = { success: '#2e9e63', info: '#1a73e8', warning: '#b5850c', error: '#d33333' };
  const icons = { success: 'bi-check-circle-fill', info: 'bi-info-circle-fill', warning: 'bi-exclamation-triangle-fill', error: 'bi-x-circle-fill' };
  const el = document.createElement('div');
  el.className = 'lite-toast';
  el.style.setProperty('--lt-color', colors[icon] || colors.info);
  el.innerHTML = `<i class="bi ${icons[icon] || icons.info}" aria-hidden="true"></i><span></span>`;
  el.querySelector('span').textContent = title; // textContent 代入なのでエスケープ不要
  host.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 350);
  }, 2200);
}

// エラー表示
function handleError(err) {
  hideLoading();
  const msg = (err && (err.message || (err.toString && err.toString()))) || 'エラーが発生しました';
  Swal.fire({ title: 'システムエラー', text: msg, icon: 'error' });
  // スクリーンリーダー向けにエラーを読み上げる
  if (typeof announce === 'function') announce(msg, true);
}

/**
 * [機能] 保存失敗の通知（楽観的更新の裏で走る書き込みが失敗したとき用）
 * これまで「保存しました」と出したまま裏で失敗すると子どもは気づけなかった。
 * どの保存が失敗したかを、児童にも分かる言葉で必ず画面に出す。
 */
function reportSaveFailure(what) {
  showToast('error', `${what}を ほぞんできなかったよ。もういちど ためしてね`);
}

/**
 * [機能] サーバー保存呼び出しの共通ラッパー。
 * google.script.run の「通信失敗」と、サーバーが返す {success:false}（ロック待ちなど）の
 * 両方を失敗として扱い、reportSaveFailure で必ず知らせる。
 * @param {string} what - 児童向けの保存対象名（例:「けいかく」）
 * @param {function} [onSuccess] - 成功時の追加処理（省略可）
 * @returns {object} google.script.run のチェーン（呼び出し側でサーバー関数を呼ぶ）
 */
function runSave(what, onSuccess) {
  return google.script.run
    .withSuccessHandler(res => {
      if (res && res.success === false) { reportSaveFailure(what); return; }
      if (onSuccess) onSuccess(res);
    })
    .withFailureHandler(err => {
      console.error(err);
      reportSaveFailure(what);
    });
}

/**
 * [機能] 提示モードの切り替え
 * 電子黒板に映して一斉授業をするときに押します。
 * 教室のうしろの席から読めるよう文字とボタンを大きくし、
 * 児童名は既定で伏せます（個人情報を教室の外へ出さないため）。
 */
function togglePresentationMode() {
  const on = document.body.classList.toggle('presentation');

  // 名前は既定で伏せる。先生が「なまえを出す」を押したときだけ表示する。
  document.body.classList.toggle('names-hidden', on);

  const btn = document.getElementById('btn-presentation');
  if (btn) {
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? '提示モードをやめる' : '大きく表示（提示モード）');
  }

  // 名前の出し入れボタンは提示モードのときだけ出す
  let nameBtn = document.getElementById('btn-toggle-names');
  if (on && !nameBtn) {
    nameBtn = document.createElement('button');
    nameBtn.id = 'btn-toggle-names';
    nameBtn.type = 'button';
    nameBtn.className = 'btn btn-outline-secondary btn-sm rounded-pill me-1';
    nameBtn.textContent = 'なまえを出す';
    nameBtn.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('names-hidden');
      nameBtn.textContent = hidden ? 'なまえを出す' : 'なまえを伏せる';
    });
    btn.parentNode.insertBefore(nameBtn, btn);
  } else if (!on && nameBtn) {
    nameBtn.remove();
  }

  // 全画面表示。ブラウザが断ることがあるので、失敗しても提示モード自体は続ける。
  try {
    if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else if (!on && document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  } catch (e) { /* GAS は iframe の中なので許可されないことがある */ }

  announce(on ? '提示モードにしました。なまえは伏せています。' : '提示モードをやめました。');
}

/**
 * [機能] 画面の変化を読み上げてもらう
 * 目で追えない人にも「保存できた」「エラーになった」が伝わるようにします。
 */
function announce(message, isError) {
  const el = document.getElementById(isError ? 'a11y-alert' : 'a11y-status');
  if (!el) return;
  // 同じ文言が続くと読み上げられないので、一度空にしてから入れる
  el.textContent = '';
  setTimeout(() => { el.textContent = message; }, 50);
}

 */
function showUnitInfoModal() {
  const unit = appState.unitList.find(u => u.id === appState.unit.id);
  if (!unit) return;

  Swal.fire({
    title: `<div class="fs-5 fw-bold text-primary">${escapeHtml(unit.subject || '')} ${unit.grade ? '('+escapeHtml(unit.grade)+')' : ''}</div><div class="fs-4">${escapeHtml(unit.title)}</div>`,
    html: `
      <div class="text-start p-2">
        <div class="mb-3">
          <label class="small text-muted fw-bold">単元のめあて</label>
          <div class="p-3 bg-light rounded border-start border-5 border-success">
            <i class="bi bi-flag-fill text-success me-2"></i>
            <span class="fw-bold text-dark">${escapeHtml(unit.goal) || '（目標は設定されていません）'}</span>
          </div>
        </div>
        <div class="mb-3">
          <label class="small text-muted fw-bold">概要</label>
          <div class="small text-secondary">
            ${unit.description ? escapeHtml(unit.description).replace(/\n/g, '<br>') : '（概要はありません）'}
          </div>
        </div>
        <div class="text-end small text-muted">
          総時数: ${unit.totalHours}時間
        </div>
      </div>
    `,
    showCloseButton: true,
    showConfirmButton: false,
    width: '500px'
  });
}

// ==========================================
//  お祝い演出キット（コンパスクエスト）
//  ── 追加ライブラリなし・prefers-reduced-motion を尊重する
//     すべてグローバル関数。演出だけで、データや点数は動かさない。
// ==========================================

/** 端末が「動きを減らす」設定かどうか。演出はすべてこれで門番する。 */
function cqReducedMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

const CQ_CONFETTI_COLORS = ['#eab308', '#1a73e8', '#2fb673', '#ef5f92', '#8b5cf6', '#0e9bb0', '#f5942a'];

/**
 * [演出] 紙ふぶきを降らせる。追加ライブラリは使わず、短い時間で自分から消える。
 * @param {number} [count] 紙の枚数（多いほど派手）
 */
function cqCelebrate(count) {
  if (cqReducedMotion()) return;
  const total = count || 60;
  const layer = document.createElement('div');
  layer.className = 'cq-confetti';
  layer.setAttribute('aria-hidden', 'true');
  let longest = 0;
  for (let i = 0; i < total; i++) {
    const piece = document.createElement('i');
    const duration = 1.6 + Math.random() * 1.4;
    longest = Math.max(longest, duration);
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.background = CQ_CONFETTI_COLORS[i % CQ_CONFETTI_COLORS.length];
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = (Math.random() * .5) + 's';
    piece.style.setProperty('--dx', (Math.random() * 180 - 90).toFixed(0) + 'px');
    piece.style.setProperty('--rot', (360 + Math.random() * 720).toFixed(0) + 'deg');
    if (i % 3 === 1) piece.style.borderRadius = '50%';
    if (i % 3 === 2) piece.classList.add('star');
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), (longest + 1) * 1000);
}

/** [演出] 要素をひとつだけ「ぷるっ」とさせる。 */
function cqPop(el) {
  if (!el || cqReducedMotion()) return;
  el.classList.remove('cq-pop');
  void el.offsetWidth;   // アニメーションをやり直すためのリセット
  el.classList.add('cq-pop');
}

/** [演出] 押したところから星がはじけ飛ぶ（小さなごほうびの演出）。 */
function cqBurst(el, count) {
  if (!el || cqReducedMotion()) return;
  const rect = el.getBoundingClientRect();
  if (!rect.width && !rect.height) return;
  const total = count || 12;
  const layer = document.createElement('div');
  layer.className = 'cq-burst';
  layer.setAttribute('aria-hidden', 'true');
  layer.style.left = (rect.left + rect.width / 2) + 'px';
  layer.style.top = (rect.top + rect.height / 2) + 'px';
  for (let i = 0; i < total; i++) {
    const star = document.createElement('i');
    const angle = (Math.PI * 2 * i) / total + Math.random() * .4;
    const distance = 45 + Math.random() * 55;
    star.style.background = CQ_CONFETTI_COLORS[i % CQ_CONFETTI_COLORS.length];
    star.style.setProperty('--bx', (Math.cos(angle) * distance).toFixed(0) + 'px');
    star.style.setProperty('--by', (Math.sin(angle) * distance).toFixed(0) + 'px');
    star.style.animationDelay = (Math.random() * .1).toFixed(2) + 's';
    layer.appendChild(star);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1000);
}

/**
 * [演出] 数字をパラパラと変化させる（きょうの がくしゅう N/M など）。
 * @param {HTMLElement} el
 * @param {number} to 最終的に表示する数
 */
function cqCountUp(el, to) {
  if (!el) return;
  const target = Number(to) || 0;
  const from = Number(String(el.textContent).replace(/[^\d-]/g, '')) || 0;
  if (from === target || cqReducedMotion()) { el.textContent = String(target); return; }
  const start = performance.now();
  const duration = 700;
  const step = now => {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = String(Math.round(from + (target - from) * eased));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/**
 * [演出] やさしいコピーのお祝いダイアログ（SweetAlert2）。
 * 動きを減らす設定でも、ダイアログ自体は出す（お祝いの言葉は届けたいため）。
 * @param {string} title 大きく出すお祝いの言葉
 * @param {string} [sub] そえる一言
 */
function cqCheer(title, sub) {
  Swal.fire({
    icon: 'success',
    title: escapeHtml(title || 'やったね！'),
    text: sub ? String(sub) : '',
    confirmButtonText: 'やった！',
    confirmButtonColor: '#2fb673',
    customClass: { popup: 'rounded-4' }
  });
  if (typeof announce === 'function') announce((title || '') + ' ' + (sub || ''), false);
}
