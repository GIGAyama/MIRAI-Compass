<style>
/* =========================================
   1. テーマ設定と変数 (Variables & Theming)
   =========================================
   * アプリ全体の色や影の設定を一括管理します。
   * 学校のイメージカラーに合わせてここを変更できます。
   */
:root {
  /* ブランドカラー (Google Material Colors準拠)
     ★ 明るい色をそのまま文字色に使わない。「面（帯・ボタンの地）」用と
        「文字・アイコン」用の2段階を用意している。
        面用をそのまま文字に使うと、Chromebook の安い液晶では読めなくなる。 */
  --color-primary: #1a73e8; /* 面用：メインカラー（青） */
  --color-success: #34a853; /* 面用：完了・成功（緑） */
  --color-warning: #fbbc04; /* 面用：注意・進行中（黄） */
  --color-danger: #ea4335;  /* 面用：SOS・警告（赤） */
  --color-info: #4285f4;    /* 面用：情報・集中（水色） */

  /* 文字・アイコン用（--bg-body #f0f2f5 の上で 4.5:1 以上を確保した濃さ）
     色相は変えていない。1〜2段濃くしただけなので、色の印象はほとんど変わらない。 */
  --color-primary-d: #0a58ca; /* 5.74 */
  --color-success-d: #146c43; /* 5.74 */
  --color-danger-d:  #b02a37; /* 5.09 */
  --color-info-d:    #087990; /* 4.53 */
  --color-warning-d: #664d03; /* 8.55 （黄は文字にできないので、かなり濃くする） */

  /* 背景色とテキスト色 */
  --bg-body: #f0f2f5;       /* アプリ全体の背景色 */
  --bg-card: #ffffff;       /* カードの背景色 */
  --bg-modal: #ffffff;      /* モーダルの背景色 */
  --bg-input: #ffffff;      /* 入力欄の背景色 */

  --text-main: #3c4043;     /* 基本文字色 */
  /* #6c757d は --bg-body の上で 4.18 しかなく、基準に届いていなかった。
     案内文・空状態・バッジなど「いちばん困っている人に向けた文」に
     使われている色なので、ここを直すのが効く。 */
  --text-muted: #5c636a;    /* 薄い文字色（5.42） */

  /* その他デザイン要素 */
  --border-color: #dee2e6;
  --shadow-sm: 0 .125rem .25rem rgba(0,0,0,.075);
  --bg-mytask: #fbf5ff;     /* 「じぶんの課題」の背景色（薄紫） */

  /* セーフエリア（ノッチ・ホームバー・丸角） */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  /* 文字サイズ。画面幅に応じて伸び縮みさせ、メディアクエリを何段も書かない。
     320px のスマホでも電子黒板でも、それぞれ妥当な大きさになる。 */
  --fs-body:  clamp(15px, 1.6vw + 10px, 18px);
  --fs-lead:  clamp(18px, 2.2vw + 12px, 24px);
  --fs-title: clamp(22px, 3.2vw + 14px, 40px);
  --fs-hero:  clamp(40px, 9vw, 120px);
}

/* 児童用アプリなので配色を固定する（端末のダークモードで勝手に反転させない） */
:root { color-scheme: light; }

/* =========================================
   2. 基本スタイル & レイアウト (Base Styles)
   ========================================= */
body {
  /* 学校のフィルタリングで Zen Maru Gothic が届かなくても字が崩れないよう、
     端末側の日本語フォントを必ず後ろに並べる。届かないときは字の形が
     変わるだけで、アプリは同じように動く。 */
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI",
               "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  color: var(--text-main);
  background-color: var(--bg-body);
  transition: background-color 0.3s ease, color 0.3s ease;

  font-size: var(--fs-body);

  /* アプリライクなフルスクリーンレイアウト設定
     100vh はモバイルのアドレスバー分だけはみ出すので dvh を使う。 */
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 画面全体のスクロールを禁止（内部でスクロールさせる） */

  /* 横向きにしたときノッチ側が欠けないようにする */
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);

  touch-action: manipulation; /* ダブルタップ拡大の300ms遅延を消す */
}
/* dvh を知らない古い端末向け。dvh を先に書き、@supports で受ける。 */
@supports not (height: 100dvh) {
  body { height: 100vh; }
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* ルビ（ふりがな）の調整 */
ruby {
  ruby-align: center;
}
rt {
  font-size: 0.6em;
  /* ★ 色を決め打ちしない。
     以前は var(--text-muted)（#6c757d）固定だったため、青いボタンの上で
     コントラスト比 1.04 になり、ほとんど見えなかった。
     ふりがなが要るのは低学年の児童なので、いちばん読めなくて困る人が
     いちばん読めない形になっていた。
     白地での既定値だけをここで決め、色のついた面では親の色を継がせる。 */
  color: #5f6368;
}
/* 色のついた面（ボタン・バッジ・帯・白抜き文字）では、まとめて継がせる。
   1か所ずつ潰すと必ずどこかが漏れる。 */
button rt,
.btn rt,
.badge rt,
.nav-link rt,
[class*="bg-"] rt,
[class*="btn-"] rt,
[class*="text-white"] rt,
.alert rt,
.heatmap-cell rt,
.skill-mini-badge rt { color: inherit; }

/* ヘッダー (ナビゲーションバー) */
nav.navbar {
  flex-shrink: 0; /* 縮小させない */
  margin-bottom: 0 !important;
  z-index: 1030;
  padding-top: var(--safe-t); /* ノッチの下に潜り込まないようにする */
}

/* メインコンテンツエリア */
main.container {
  flex-grow: 1;
  width: 100%;
  max-width: 960px;
  padding-top: 1rem;
  /* フッターの高さ分 + 余白。iPhone のホームバーの分も足す。 */
  padding-bottom: calc(80px + var(--safe-b));
  display: flex;
  flex-direction: column;
  overflow-y: auto;     /* コンテンツが多い時だけスクロール */
  -webkit-overflow-scrolling: touch; /* スマホでのスクロールを滑らかに */
  overscroll-behavior: contain; /* 引っぱり更新の暴発を防ぐ */
}

/* 先生モード時の全幅表示設定 */
main.teacher-mode {
  max-width: 100% !important;
  padding-left: 1.5rem;
  padding-right: 1.5rem;
}

/* アプリ内部コンテナ */
#app-container {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}

/* フッター (画面下に固定) */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  margin-top: 0 !important;
  background-color: var(--bg-card);
  border-top: 1px solid var(--border-color);
  z-index: 1040;
  /* iPhone X以降の下部バー対応。左右のノッチ分も足す。 */
  padding-bottom: var(--safe-b);
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);
}

/* =========================================
   児童用ボトムタブナビ (4-tab bottom nav)
   ─ 児童モードでログイン中だけ表示する固定タブバー。
     指で押しやすい大きさ（≥44px）にし、ノッチ／ホームバーの
     セーフエリアを避ける。フッター（著作権・教員ログイン）は
     ナビの上に少しだけ乗せて、教員ログインの導線を残す。
   ========================================= */
:root { --student-nav-h: 60px; }

.student-bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 1045;                 /* フッター(1040)より上・タイマー(1050)より下 */
  display: flex;
  align-items: stretch;
  background-color: var(--bg-card);
  border-top: 1px solid var(--border-color);
  box-shadow: 0 -2px 10px rgba(0,0,0,.06);
  /* セーフエリア（ホームバー・左右ノッチ）を避ける */
  padding-bottom: var(--safe-b);
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);
}
.student-bottom-nav .snav-btn {
  flex: 1 1 0;
  min-width: 0;
  min-height: 44px;              /* 指で押せる最小の当たり判定 */
  height: var(--student-nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 2px;
  transition: color .15s ease, background-color .15s ease;
}
.student-bottom-nav .snav-btn i { font-size: 1.35rem; line-height: 1; }
.student-bottom-nav .snav-btn .snav-label {
  font-size: clamp(10px, 2.4vw, 12px);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.student-bottom-nav .snav-btn:hover { background-color: var(--bg-body); }
.student-bottom-nav .snav-btn:focus-visible {
  outline: 3px solid var(--bs-primary, #1a73e8);
  outline-offset: -3px;
  border-radius: 8px;
}
.student-bottom-nav .snav-btn[aria-current="page"] {
  color: var(--bs-primary, #1a73e8);
}
.student-bottom-nav .snav-btn[aria-current="page"] i { transform: translateY(-1px); }

/* ナビが出ている間はコンテンツ・フッター・浮遊ウィジェットの位置を調整 */
body.has-student-nav main.container {
  /* フッター + タブバー + セーフエリアの分だけ下に余白を足す（内容が隠れない） */
  padding-bottom: calc(var(--student-nav-h) + 96px + var(--safe-b));
}
body.has-student-nav footer {
  /* フッターはタブバーの上に乗せる（教員ログインの導線を残す） */
  bottom: calc(var(--student-nav-h) + var(--safe-b));
  padding-bottom: .15rem;
}
body.has-student-nav #my-timer-widget,
body.has-student-nav #timer-launcher {
  /* タイマーの浮遊ボタンがタブバーと重ならないよう持ち上げる */
  bottom: calc(var(--student-nav-h) + var(--safe-b) + 20px) !important;
}

/* Bootstrapデフォルトの上書き */
.bg-light { background-color: var(--bg-body) !important; }
.bg-white { background-color: var(--bg-card) !important; }
.text-muted { color: var(--text-muted) !important; }
.border { border-color: var(--border-color) !important; }
.modal-content { background-color: var(--bg-modal); color: var(--text-main); }
.btn-close { filter: var(--btn-close-filter, none); }

/* =========================================
   3. UIコンポーネント (Components)
   ========================================= */

/* カード（タスクや生徒カード） */
.card {
  background-color: var(--bg-card);
  border: none;
  border-radius: 1rem;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  color: var(--text-main);
}
.card-task { border-left: 5px solid transparent; }
.card-task:hover {
  transform: translateY(-2px); /* ホバー時に少し浮く */
  box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important;
}

/* ロックされたタスク */
.card-locked {
  background-color: rgba(233, 236, 239, 0.5);
  opacity: 0.7;
  pointer-events: none; /* クリック無効化 */
  filter: grayscale(0.8);
}

/* タスクカテゴリ別の色帯 */
.border-start-manabu { border-left: 5px solid var(--color-primary) !important; }
.border-start-fukameru { border-left: 5px solid var(--color-success) !important; }
.border-start-matomeru { border-left: 5px solid var(--color-warning) !important; }
.border-start-mytask { border-left: 5px solid #9c27b0 !important; }
.border-start-other { border-left: 5px solid var(--text-muted) !important; }

/* ステータスアラート (SOS/集中) */
.sos-alert {
  border: 2px solid var(--color-danger) !important;
  background-color: rgba(234, 67, 53, 0.05);
  animation: pulse 1.5s infinite;
}
.focus-alert {
  border: 2px solid var(--color-info) !important;
  background-color: rgba(66, 133, 244, 0.05);
}

/* タブナビゲーション */
.nav-tabs .nav-link {
  color: var(--text-muted);
  border: none;
  border-bottom: 3px solid transparent;
  padding-bottom: 0.8rem;
}
.nav-tabs .nav-link:hover {
  color: var(--color-primary);
  border-color: transparent;
}
.nav-tabs .nav-link.active {
  color: var(--color-primary);
  background: transparent;
  border-bottom: 3px solid var(--color-primary);
}

/* スタンプバッジ (完了時のアニメーション用) */
.stamp-badge {
  position: absolute; top: -10px; right: -10px;
  font-size: 2.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  z-index: 20; pointer-events: none;
}

/* 先生用ビューのレイアウト調整 */
.teacher-view-card {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#t-area {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* =========================================
   4. モジュール & ビュー (Modules & Views)
   ========================================= */

/* タイムライン (学習進捗バー周辺) */
.timeline-container {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(5px); /* すりガラス効果 */
  border-bottom: 1px solid var(--border-color);
  margin-top: -1rem;
  padding-top: 1rem;
  margin-bottom: 1rem;
}

.progress-bar-striped {
  background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
  background-size: 1rem 1rem;
}

/* ヒートマップテーブル */
.heatmap-table th {
  background-color: var(--bg-card);
  color: var(--text-main);
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.85rem; text-align: center; vertical-align: middle;
}
.heatmap-cell-wrapper { cursor: pointer; padding: 2px; transition: transform 0.1s; }
.heatmap-cell-wrapper:hover { transform: scale(1.2); }
.heatmap-cell {
  width: 28px; height: 28px; border-radius: 4px;
  background-color: var(--border-color);
  margin: 0 auto; display: flex; align-items: center; justify-content: center;
}
.heatmap-done { background-color: var(--color-success) !important; color: #fff; }
.heatmap-doing { background-color: var(--color-warning) !important; color: #000; }
.heatmap-sos { background-color: var(--color-danger) !important; color: #fff; animation: pulse 2s infinite; }
.heatmap-focus { background-color: var(--color-info) !important; color: #fff; }

/* 計画作成画面 (Drag & Drop) */
.plan-drop-zone-v {
  transition: background-color 0.2s;
}
/* 計画づくりの2カラム。以前は style="height: calc(100vh - 150px)" を
   直書きしていたが、100vh はモバイルのアドレスバー分だけはみ出す。 */
.plan-columns { height: calc(100dvh - 150px); }
@supports not (height: 100dvh) {
  .plan-columns { height: calc(100vh - 150px); }
}
.sortable-ghost { /* ドラッグ中の半透明表示 */
  opacity: 0.4;
}

/* アニメーション定義 (Animate.css風) */
@keyframes heartBeat { 0% {transform:scale(1);} 14% {transform:scale(1.3);} 28% {transform:scale(1);} 42% {transform:scale(1.3);} 70% {transform:scale(1);} }
.animate__heartBeat { animation: heartBeat 1.3s ease-in-out; }

@keyframes flash { from, 50%, to {opacity:1;} 25%, 75% {opacity:0;} }
.animate__flash { animation: flash 2s infinite; }

@keyframes pulse { from {transform:scale3d(1,1,1);} 50% {transform:scale3d(1.05,1.05,1.05);} to {transform:scale3d(1,1,1);} }
.animate__pulse { animation: pulse 2s infinite; }

@keyframes bounceIn { 0% {opacity:0;transform:scale3d(0.3,0.3,0.3);} 20% {transform:scale3d(1.1,1.1,1.1);} 40% {transform:scale3d(0.9,0.9,0.9);} 60% {opacity:1;transform:scale3d(1.03,1.03,1.03);} 80% {transform:scale3d(0.97,0.97,0.97);} to {opacity:1;transform:scale3d(1,1,1);} }
.animate__bounceIn { animation: bounceIn 0.75s; }

/* ポートフォリオモーダルのスタイル */
.timeline-wrapper { border-left-color: var(--border-color) !important; }
.cursor-pointer { cursor: pointer; }
.edit-icon { opacity: 0.5; transition: opacity 0.2s; }
.edit-icon:hover { opacity: 1; color: var(--color-primary) !important; }

/* 振り返りスキルボタン (Check時の色変化) */
.btn-check:checked + .btn-outline-primary { background-color: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.btn-check:checked + .btn-outline-success { background-color: var(--color-success); color: #fff; border-color: var(--color-success); }
.btn-check:checked + .btn-outline-danger { background-color: var(--color-danger); color: #fff; border-color: var(--color-danger); }
.btn-check:checked + .btn-outline-warning { background-color: var(--color-warning); color: #000; border-color: var(--color-warning); }

/* 座席表ビュー */
.seating-wrapper {
  flex-grow: 1;
  position: relative;
  overflow: hidden; 
  display: flex;
  flex-direction: column;
}
.seating-canvas {
  background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
  background-size: 110px 110px; /* グリッドサイズ */
  background-position: -5px -5px;
  flex-grow: 1;
  width: 100%;
  height: 100%;
  overflow: auto;
  position: relative;
}
.seat-card {
  transition: box-shadow 0.2s, transform 0.2s, left 0.2s ease-out, top 0.2s ease-out;
}
.seat-card:hover {
  z-index: 100 !important;
  box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important;
  transform: scale(1.02);
}

/* ローディング画面のアニメーション (コンパス) */
.compass-loader {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #e3f2fd;
  border: 4px solid #90caf9;
  position: relative;
  box-shadow: 0 4px 15px rgba(144, 202, 249, 0.4);
  animation: float 3s ease-in-out infinite;
  display: flex;
  justify-content: center;
  align-items: center;
}
.compass-loader::before {
  content: ''; position: absolute; width: 10px; height: 10px; background: #f48fb1; border-radius: 50%; z-index: 10;
}
.compass-needle {
  width: 8px; height: 70px; position: absolute; animation: cuteSpin 2s infinite ease-in-out;
}
.compass-needle::before {
  content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 35px solid #ffab91;
}
.compass-needle::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 35px solid #80deea;
}
@keyframes cuteSpin {
  0% { transform: rotate(0deg); }
  40% { transform: rotate(190deg); }
  60% { transform: rotate(170deg); }
  100% { transform: rotate(360deg); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* 文字間隔調整 */
.spacing-1 { letter-spacing: 0.1em; }

/* まとめリスト（テーブルビュー） */
.summary-table-container {
  height: 100%;
  overflow: auto;
  border-radius: 12px;
  background-color: var(--bg-card);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}
.summary-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.summary-table th {
  position: sticky; top: 0; background-color: #f8f9fa; z-index: 10;
  padding: 0.8rem 1rem; border-bottom: 2px solid var(--border-color);
  color: var(--text-muted); font-size: 0.85rem; font-weight: bold;
}
.summary-table td {
  padding: 1rem; vertical-align: top; border-bottom: 1px solid var(--border-color);
  background-color: var(--bg-card);
}
.summary-table tr:hover td { background-color: #f8f9fa; }

/* テーブル列幅 */
.st-col-name { width: 140px; font-weight: bold; white-space: nowrap; }
.st-col-skills { width: 180px; }
.st-col-summary { min-width: 300px; }
.st-col-feedback { width: 350px; }

/* スキルバッジ */
.skill-badge-group { display: flex; flex-wrap: wrap; gap: 4px; }
.skill-mini-badge {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.7rem; padding: 2px 8px; border-radius: 12px;
  color: white; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

/* スタンプ選択アイコン */
.stamp-select-group {
  display: flex; gap: 10px; margin-bottom: 8px; background: #fff;
  padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-color); width: fit-content;
}
.stamp-option {
  cursor: pointer; opacity: 0.4; transition: all 0.2s ease;
  font-size: 1.4rem; filter: grayscale(1); line-height: 1;
}
.stamp-option:hover { opacity: 0.8; transform: scale(1.1); filter: grayscale(0.5); }
.stamp-input { display: none; }
.stamp-input:checked + .stamp-option { opacity: 1; transform: scale(1.2); filter: grayscale(0); }

/* まとめ文章エリア */
.summary-text-area {
  background-color: #f8f9fa; border-radius: 8px; padding: 12px;
  font-size: 0.95rem; white-space: pre-wrap; max-height: 150px; overflow-y: auto;
  border: 1px solid transparent; transition: max-height 0.3s;
}
.summary-text-area:hover { background-color: #fff; border-color: var(--border-color); }
.summary-text-area:focus { max-height: none; } /* フォーカス時に展開 */
.summary-empty { color: var(--text-muted); font-style: italic; font-size: 0.8rem; }

/* =========================================
   5. ギャラリーウォーク (Gallery Walk)
   ========================================= */

/* ギャラリーコンテナ */
.gallery-container {
  padding: 1rem;
  background-color: #f8f9fa;
  border-radius: 1rem;
  min-height: 100%;
}

/* 生徒カード */
.gallery-card {
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: default;
  border: 1px solid var(--border-color);
  background: white;
}
.gallery-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 .5rem 1rem rgba(0,0,0,.1);
}

/* ミニタイムライン（計画の可視化） */
.mini-timeline-row {
  display: flex;
  align-items: center;
  margin-bottom: 4px;
  height: 24px;
}
.mini-timeline-label {
  width: 30px;
  font-size: 0.7rem;
  color: var(--text-muted);
  text-align: right;
  padding-right: 6px;
  font-weight: bold;
}
.mini-timeline-track {
  flex-grow: 1;
  display: flex;
  gap: 2px;
  height: 100%;
  background: #f1f3f4;
  border-radius: 4px;
  overflow: hidden;
  padding: 2px;
}

/* タスクブロック（色分け） */
.mini-task-block {
  flex-grow: 1;
  height: 100%;
  border-radius: 2px;
  position: relative;
  min-width: 10px;
}
/* カテゴリ別の色（透明度を少し下げて柔らかく） */
.bg-manabu { background-color: var(--color-primary); opacity: 0.8; }
.bg-fukameru { background-color: var(--color-success); opacity: 0.8; }
.bg-matomeru { background-color: var(--color-warning); opacity: 0.8; }
.bg-mytask { background-color: #9c27b0; opacity: 0.8; }
.bg-other { background-color: var(--text-muted); opacity: 0.5; }

/* ツールチップ（ホバー時にタスク名表示） */
.mini-task-block:hover::after {
  content: attr(data-title);
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  white-space: nowrap;
  z-index: 1000;
  pointer-events: none;
  margin-bottom: 4px;
}

/* =========================================
   6. ライブラリの既定色の上書き（コントラスト）
   =========================================
   ★ アプリ固有の配色を疑う前に、フレームワークの既定色を疑うこと。

   このアプリは --color-primary: #1a73e8 を定義していたが、
   Bootstrap の .text-primary / .btn-info などは上書きしていなかった。
   そのため画面に実際に出ていたのは Bootstrap の既定色のほうだった。

   白地ではなく、このアプリの地色 --bg-body (#f0f2f5) の上での実測値:
     .text-primary        #0d6efd  4.01  → #0a58ca  5.74
     .text-secondary      #6c757d  4.18  → #5c636a  5.42
     .btn-outline-success #198754  4.04  → #146c43  5.74
     .btn-info の白抜き   白/#0dcaf0 1.96 → 白/#087990 5.08
     .swal2-close         #ccc     1.61  → #5c636a  5.42（白地では 5.99）
   ========================================= */
/* ⚠️ --bs-*-text-emphasis は【上書きしない】。
   これは Bootstrap が「淡い地（.alert-info など）の上に載せる文字」用に
   用意している変数で、既定値がすでに十分濃い（#055160 など）。
   ここを --color-*-d で上書きしたところ、.alert-info の文字が
   淡い水色の地の上で 4.34 に【悪化した】。実測して気づいた。
   濃くする一括置換は、こういう形で別の場所を壊す。 */
.text-primary   { color: var(--color-primary-d) !important; }
.text-success   { color: var(--color-success-d) !important; }
.text-danger    { color: var(--color-danger-d)  !important; }
.text-info      { color: var(--color-info-d)    !important; }
.text-warning   { color: var(--color-warning-d) !important; }
.text-secondary { color: var(--text-muted) !important; }

/* ★ 一括で濃くすると「濃い面の上に置いた薄い文字」まで濃くなり、逆に読めなくなる。
   色のついた面・白抜き指定の中では、上の上書きを打ち消して継がせる。 */
.btn-primary   .text-primary,   .btn-success .text-success,
.btn-danger    .text-danger,    .btn-info    .text-info,
.btn-warning   .text-warning,
[class*="bg-primary"] .text-primary, [class*="bg-success"] .text-success,
[class*="bg-danger"]  .text-danger,  [class*="bg-info"]    .text-info,
.text-white .text-muted, .text-white .text-secondary,
[class*="bg-primary"] .text-muted, [class*="bg-danger"] .text-muted,
[class*="bg-success"] .text-muted, [class*="bg-info"]   .text-muted {
  color: inherit !important;
}

/* 面としての色は据え置き、文字が載る側だけ濃くする */
.btn-info {
  --bs-btn-bg: var(--color-info-d);
  --bs-btn-border-color: var(--color-info-d);
  --bs-btn-hover-bg: #06657a;
  --bs-btn-hover-border-color: #06657a;
  --bs-btn-color: #fff;
  --bs-btn-hover-color: #fff;
}
.btn-outline-info    { --bs-btn-color: var(--color-info-d);    --bs-btn-border-color: var(--color-info-d); }
.btn-outline-primary { --bs-btn-color: var(--color-primary-d); --bs-btn-border-color: var(--color-primary-d); }
.btn-outline-success { --bs-btn-color: var(--color-success-d); --bs-btn-border-color: var(--color-success-d); }
.btn-outline-danger  { --bs-btn-color: var(--color-danger-d);  --bs-btn-border-color: var(--color-danger-d); }
.btn-outline-secondary { --bs-btn-color: var(--text-muted);    --bs-btn-border-color: #adb5bd; }
.btn-link { --bs-btn-color: var(--color-primary-d); --bs-btn-hover-color: #084298; }

/* SweetAlert2 の × は既定が #ccc で、白地でも比 1.61 しかない */
.swal2-close { color: var(--text-muted) !important; }
.swal2-close:hover { color: var(--color-danger-d) !important; }

/* =========================================
   7. タップ領域 44px
   =========================================
   ★ ボタン自体を大きくして満たさない。
     先生のビュー切替（LIVE／一覧／座席／まとめ／設計／進行）のように
     詰めて組んであるツールバーで min-height を当てると折り返しが起き、
     別の破綻を生む。疑似要素で当たり判定だけを広げる。
   ========================================= */
.btn, .nav-link, .btn-close, .page-link,
footer a, .stamp-option, .edit-icon, .heatmap-cell-wrapper {
  position: relative;
}
.btn::after, .nav-link::after, .btn-close::after, .page-link::after,
footer a::after, .stamp-option::after, .edit-icon::after,
.heatmap-cell-wrapper::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%; height: 100%;
  min-width: 44px; min-height: 44px;
  /* 見た目は変えない。当たり判定を広げるだけ。 */
}
/* すでに ::after を使っている箇所は、上の当たり判定で潰さない */
.mini-task-block::after, .stamp-badge::after { min-width: 0; min-height: 0; }

/* ボタン以外にも押せる要素がある。
   ・計画から課題を外す × （<i class="bi bi-x">、18×18 しかなかった）
   ・課題インデックスの表の見出しと行（37px / 34px しかなかった）
   これらも指で押せる大きさにする。表の行は縦に伸ばし、
   小さなアイコンは疑似要素で当たり判定だけを広げる。 */
i[onclick], span[onclick] { position: relative; display: inline-block; }
i[onclick]::after, span[onclick]::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%; height: 100%;
  min-width: 44px; min-height: 44px;
}
th[onclick], td[onclick], .col[onclick], [onclick].cursor-pointer {
  min-height: 44px;
  vertical-align: middle;
}
.heatmap-table th[onclick] { height: 44px; }

/* 「全○時間」の時数入力は width:40px 固定だった。指で押すには狭い。 */
input.form-control[readonly][style*="width:40px"],
input.form-control[readonly][style*="width: 40px"] { min-width: 44px; }

/* ★ チェックボックスとラジオには疑似要素が使えない（input は ::after を持てない）。
   囲みの <label> 側で高さを確保する。 */
.form-check {
  display: flex;
  align-items: center;
  min-height: 44px;
}
.form-check .form-check-input { width: 1.4em; height: 1.4em; margin-top: 0; }
.form-check .form-check-label { min-height: 44px; display: flex; align-items: center; padding-left: .25rem; }

/* 入力欄・選択欄も指で押せる高さにする */
.form-control, .form-select { min-height: 44px; }
.form-control-sm, .form-select-sm { min-height: 44px; }

/* =========================================
   8. 操作と見え方の下ごしらえ
   ========================================= */
* { -webkit-tap-highlight-color: transparent; }
.no-select { user-select: none; -webkit-user-select: none; }
:focus-visible {
  outline: 3px solid var(--color-primary-d);
  outline-offset: 2px;
}
/* 座席表・計画づくりは指で動かす面なので、操作中に画面ごと動かない */
.seating-canvas, .plan-drop-zone-v { touch-action: pan-y; }

/* クエスト系の押しボタンは背景がグラデーションで濃く、既定の青いリングが
   沈んで見えないことがある。白いふちどり＋青リングの二重にして、
   どの色の上でもキーボードフォーカスが確実に見えるようにする。 */
.cq-btn:focus-visible, .cq-door:focus-visible, .cq-today:focus-visible {
  outline: 3px solid var(--color-primary-d);
  outline-offset: 2px;
  box-shadow: 0 0 0 2px #fff, var(--cq-shadow);
}

/* =========================================
   8.5 スケルトン（読み込み中の骨組み表示）
   =========================================
   データ待ちの間、白画面やスピナーではなく「もうすぐ出る画面の形」を
   見せる。シマー（光の帯）は動きを減らす設定では止まる（§9の全体指定が効く）。
   ========================================= */
.skl {
  position: relative;
  overflow: hidden;
  background: #e9eef5;
  border-radius: var(--cq-radius-md);
}
.skl::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation: skl-shimmer 1.4s infinite;
}
.skl-hero { height: 120px; border-radius: var(--cq-radius-lg); }
.skl-block { height: 80px; }
@keyframes skl-shimmer {
  100% { transform: translateX(100%); }
}

/* =========================================
   9. 動きの配慮（感覚過敏・めまいへの配慮）
   =========================================
   ★ .01ms であって 0 ではない。
     0 にすると animation-fill-mode: forwards が効かなくなり、
     fadeIn 系を使っている要素が opacity: 0 のまま消える。
     「動きを止める」つもりが「中身を消す」ことになる。
   ========================================= */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* =========================================
   10. ハイコントラストモード
   =========================================
   背景色が無効化されても「押せる」と分かるように枠を残す。
   ========================================= */
@media (forced-colors: active) {
  .btn, .nav-link, .card, .form-control, .form-select {
    border: 2px solid ButtonText;
  }
  .nav-tabs .nav-link.active { border-bottom: 4px solid Highlight; }
  .heatmap-cell, .mini-task-block { border: 1px solid CanvasText; }
  /* 色だけで意味を伝えている箇所は、形と文字で補っている（SOS/集中はラベル付き） */
}

/* =========================================
   11. 提示モード（電子黒板・一斉授業）
   =========================================
   教室のうしろの席から読めることが要件。
   先生が「大きく表示」を押すと body に .presentation が付く。
   ========================================= */
.presentation { font-size: 150%; }
.presentation .btn { min-height: 64px; }
.presentation .btn-sm { min-height: 56px; font-size: 1rem; }
.presentation .card-title, .presentation h4, .presentation h5 { font-size: 1.6em; }
.presentation .heatmap-cell { width: 44px; height: 44px; }
.presentation .badge { font-size: .9em; }
/* 提示モードでは児童名を既定で伏せる（個人情報を教室の外へ出さない）。
   先生が「名前をみる」を押したときだけ表示する。 */
.presentation.names-hidden .student-name,
.presentation.names-hidden .seat-card .fw-bold,
.presentation.names-hidden .gallery-card .fw-bold {
  color: transparent !important;
  text-shadow: 0 0 12px rgba(0,0,0,.55);
}
/* 大画面では余白を活かして主役を大きく */
@media (min-width: 1600px) {
  :root { --fs-hero: clamp(64px, 8vw, 160px); }
}

/* =========================================
   12. 印刷（まとめ一覧・ポートフォリオを配る）
   ========================================= */
@media print {
  @page { size: A4 portrait; margin: 10mm; }
  body {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    font-family: "BIZ UDPMincho", "Yu Mincho", serif;
    font-size: 10.5pt; line-height: 1.5;
    height: auto; overflow: visible; display: block;
  }
  main.container {
    max-width: none; overflow: visible; height: auto;
    padding: 0; display: block;
  }
  /* 画面のためだけにある要素は出さない。
     あとから足した固定要素（タイマー・更新の帯）にも .no-print を付けてある。 */
  .no-print, nav, footer, .btn, .nav-tabs, #loading,
  #my-timer-widget, .timeline-container, .stamp-select-group { display: none !important; }
  .card, .summary-table-container { box-shadow: none !important; border: 1px solid #999 !important; }
  .page-break { break-before: page; }
  table { break-inside: avoid; }
  tr, .card, .gallery-card, .summary-table tr { break-inside: avoid; }
  .summary-table th { position: static; }
  a[href]::after { content: ""; }  /* URLを併記しない */
  .summary-text-area { max-height: none !important; overflow: visible !important; }
}
/* 横長の表（まとめ一覧・ヒートマップ）は A4 縦に入りきらない。
   印刷ダイアログで「横」を選んでもらう前提で、そのときに崩れないようにしておく。
   手順は MANUAL.md の「印刷する」に書いてある。 */
@media print and (orientation: landscape) {
  .summary-table-container, .heatmap-table { width: 100%; }
  .st-col-feedback { width: auto; }
}

/* =========================================================================
   13. コンパスクエスト（児童画面のやさしいデザイン一式）  ── prefix: cq-
   -------------------------------------------------------------------------
   まなびクエストの手ざわりを、みらいコンパスの児童画面に移植したもの。
   いちばんやってほしいこと「1つ」を大きく出し、色とアイコンで
   「どこを押せばいいか」が文字を読まなくても分かるようにする。
   ゲーム経済（レベル・ポイント・ガチャ）は入れない。演出だけ。
   ========================================================================= */
:root {
  /* -- 色ファミリー（カード・とびら・ボタンの色わけ） -- */
  --cq-blue:   #1a73e8;  --cq-blue-d:   #0a58ca;  --cq-blue-e:   #0d47a1;  --cq-blue-s:   #eaf3ff;
  --cq-green:  #2fb673;  --cq-green-d:  #146c43;  --cq-green-e:  #0f5132;  --cq-green-s:  #e6f8ef;
  --cq-orange: #f5942a;  --cq-orange-d: #b45309;  --cq-orange-e: #92400e;  --cq-orange-s: #fff2e0;
  --cq-pink:   #ef5f92;  --cq-pink-d:   #b83266;  --cq-pink-e:   #8f244c;  --cq-pink-s:   #ffedf3;
  --cq-purple: #8b5cf6;  --cq-purple-d: #6d28d9;  --cq-purple-e: #4c1d95;  --cq-purple-s: #f0edff;
  --cq-cyan:   #0e9bb0;  --cq-cyan-d:   #087990;  --cq-cyan-e:   #075668;  --cq-cyan-s:   #e2f8fb;
  --cq-gold:   #eab308;  --cq-gold-d:   #b8860b;  --cq-gold-e:   #8a6508;  --cq-gold-s:   #fff6dd;

  /* -- 文字・線・面 -- */
  --cq-ink:     #2f3d4f;
  --cq-ink-2:   #5b6b80;
  --cq-muted:   #5c636a;
  --cq-line:    #dbe6f3;
  --cq-surface: #ffffff;
  --cq-canvas:  #eef4fb;

  /* -- 角丸・影 -- */
  --cq-radius-lg: 1.25rem;
  --cq-radius-md: .9rem;
  --cq-radius-pill: 999px;
  --cq-shadow:    0 .35rem .9rem rgba(47, 61, 79, .10);
  --cq-shadow-lg: 0 .8rem 1.6rem rgba(47, 61, 79, .16);

  /* -- カードのアクセント（.cq-accent-* で上書きする） -- */
  --cq-accent:       linear-gradient(90deg, #5b9df5, #8bc0ff);
  --cq-accent-color: var(--cq-blue-d);
  --cq-accent-soft:  var(--cq-blue-s);
}

/* -- アクセント切りかえ（カード・とびら・見出しの色をファミリーで替える） -- */
.cq-accent-blue   { --cq-accent: linear-gradient(90deg,#5b9df5,#8bc0ff); --cq-accent-color: var(--cq-blue-d);   --cq-accent-soft: var(--cq-blue-s);   --cq-edge: var(--cq-blue-e); }
.cq-accent-green  { --cq-accent: linear-gradient(90deg,#35c47e,#8fe6b7); --cq-accent-color: var(--cq-green-d);  --cq-accent-soft: var(--cq-green-s);  --cq-edge: var(--cq-green-e); }
.cq-accent-orange { --cq-accent: linear-gradient(90deg,#f9a03f,#ffcf8a); --cq-accent-color: var(--cq-orange-d); --cq-accent-soft: var(--cq-orange-s); --cq-edge: var(--cq-orange-e); }
.cq-accent-pink   { --cq-accent: linear-gradient(90deg,#f472a0,#ffb0cb); --cq-accent-color: var(--cq-pink-d);   --cq-accent-soft: var(--cq-pink-s);   --cq-edge: var(--cq-pink-e); }
.cq-accent-purple { --cq-accent: linear-gradient(90deg,#9a8bff,#c9c0ff); --cq-accent-color: var(--cq-purple-d); --cq-accent-soft: var(--cq-purple-s); --cq-edge: var(--cq-purple-e); }
.cq-accent-cyan   { --cq-accent: linear-gradient(90deg,#28c3d6,#93e9f2); --cq-accent-color: var(--cq-cyan-d);   --cq-accent-soft: var(--cq-cyan-s);   --cq-edge: var(--cq-cyan-e); }
.cq-accent-gold   { --cq-accent: linear-gradient(90deg,#f7c63f,#ffe6a1); --cq-accent-color: var(--cq-gold-d);   --cq-accent-soft: var(--cq-gold-s);   --cq-edge: var(--cq-gold-e); }

/* =========================================================================
   きょうの あいさつ（ヒーローヘッダー）
   ========================================================================= */
.cq-hero {
  position: relative; overflow: hidden;
  border-radius: var(--cq-radius-lg);
  padding: 1.05rem 1.15rem 1.15rem;
  margin-bottom: 1rem;
  color: #fff;
  background: linear-gradient(135deg, #4f8ef7 0%, #7a6bf0 55%, #b163e6 100%);
  box-shadow: var(--cq-shadow-lg);
}
.cq-hero::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.35) 0 3px, transparent 4px),
    radial-gradient(circle at 78% 12%, rgba(255,255,255,.28) 0 4px, transparent 5px),
    radial-gradient(circle at 88% 62%, rgba(255,255,255,.22) 0 3px, transparent 4px),
    radial-gradient(circle at 32% 82%, rgba(255,255,255,.18) 0 2px, transparent 3px);
}
.cq-hero > * { position: relative; z-index: 1; }
