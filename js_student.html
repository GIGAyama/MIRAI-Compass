<script>
/**
 * 🧭 みらいコンパス Ver. 1.0 - Student Logic (児童用機能)
 * ==============================================================================
 * このファイルは、児童モード（学習者用画面）の動作を制御します。
 * ・ログイン（名前選択）
 * ・今日の学習リストの表示
 * ・計画の作成（ドラッグ＆ドロップ）
 * ・タスクの実行（完了・途中・メモ）
 * ・ふりかえり、ポートフォリオ、自分用タイマー
 */

// ==========================================
//  1. ログイン・初期表示 (Login & Entry)
// ==========================================

/**
 * [画面描画] 名前入力（ログイン）画面を表示
 */
function renderNameEntry() {
  if (typeof removeStudentBottomNav === 'function') removeStudentBottomNav(); // ログイン前はタブバーを出さない
  let classOptions = '';
  // クラスリストがあれば選択肢を作成
  if (dataStore.classList.length > 0) {
     classOptions = dataStore.classList.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  } else {
     classOptions = '<option value="1組">1組</option><option value="2組">2組</option>';
  }

  const container = document.getElementById('app-container');
  container.innerHTML = `
    <div class="row justify-content-center animate__animated animate__fadeIn">
      <div class="col-md-6">
        <div class="card shadow-sm p-5 text-center border-0 rounded-4">
          <h4 class="fw-bold mb-4"><ruby>始<rt>はじ</rt></ruby>める</h4>
          
          <!-- クラス選択 -->
          <div class="mb-3">
             <label class="form-label small text-muted">クラス</label>
             <select id="input-class" class="form-select form-select-lg text-center rounded-pill border-0 bg-light" onchange="updateNameSelect()">
               ${classOptions}
             </select>
          </div>
          
          <!-- 名前選択 (クラスを選ぶと自動更新) -->
          <div class="mb-4">
             <label class="form-label small text-muted">なまえ</label>
             <div id="name-input-container">
               <input type="text" id="input-name" class="form-control form-control-lg text-center rounded-pill border-0 bg-light" placeholder="例：やまだ たろう">
             </div>
          </div>
          
          <!-- 次回省略チェック -->
          <div class="form-check mb-4 d-inline-block">
            <input class="form-check-input" type="checkbox" id="rm-me" checked>
            <label class="form-check-label small" for="rm-me"><ruby>情報<rt>じょうほう</rt></ruby>を<ruby>保存<rt>ほぞん</rt></ruby>する</label>
          </div>
          
          <button class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm" onclick="handleLoginClick()">スタート</button>
          
          <div class="mt-4">
             <button class="btn btn-link text-muted btn-sm" onclick="attemptTeacherLogin()"><ruby>先生<rt>せんせい</rt></ruby>はこちら</button>
          </div>
        </div>
      </div>
    </div>`;
    
  updateNameSelect(); // 初期の名前リストを表示
}

/**
 * [内部処理] クラス選択に合わせて名前リストを更新
 * [改修] isActiveがfalse（転出など）の生徒は表示しない + 出席番号順にソート
 */
function updateNameSelect() {
  const classVal = document.getElementById('input-class').value;
  const container = document.getElementById('name-input-container');
  
  // 在籍中(isActive !== false)のみ抽出し、出席番号(number)順にソート
  const students = dataStore.roster
    .filter(r => r.classId === classVal && r.isActive !== false)
    .sort((a,b) => a.number - b.number);

  if (students.length > 0) {
    const options = students.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.number)}. ${escapeHtml(s.name)}</option>`).join('');
    container.innerHTML = `
      <select id="input-name" class="form-select form-select-lg text-center rounded-pill border-0 bg-light">
        <option value="" disabled selected>名前をえらんでね</option>
        ${options}
      </select>`;
  } else {
    container.innerHTML = `<input type="text" id="input-name" class="form-control form-control-lg text-center rounded-pill border-0 bg-light" placeholder="例：やまだ たろう">`;
  }
}

/**
 * [アクション] スタートボタンクリック時
 */
function handleLoginClick() {
  const nameInput = document.getElementById('input-name');
  const classInput = document.getElementById('input-class');
  const remember = document.getElementById('rm-me').checked;
  
  const name = nameInput.value.trim();
  const cls = classInput.value;
  
  if (!name) return; // 名前が空なら何もしない
  
  // ブラウザに情報を保存（次回省略用）
  if (remember) {
    localStorage.setItem(CONSTANTS.LS_KEY_NAME, name);
    localStorage.setItem(CONSTANTS.LS_KEY_CLASS, cls);
  } else {
    localStorage.removeItem(CONSTANTS.LS_KEY_NAME);
    localStorage.removeItem(CONSTANTS.LS_KEY_CLASS);
  }
  
  // アプリ状態を更新してログイン処理へ
  appState.user.name = name;
  appState.user.classId = cls;
  loginStudent(false);
}

/**
 * [サーバー通信] 生徒としてログインし、自分のデータを取得
 * @param {boolean} isAuto - 自動ログインかどうか（ローディング表示の制御用）
 */
function loginStudent(isAuto) {
  // 白い全画面ローダーで止めず、これから出る画面の「骨組み」を先に見せる
  // （待ち時間の体感を減らす。大手アプリの標準的な手法）
  if (!isAuto) renderStudentSkeleton();

  // サーバー(Code.gs)の getStudentProgress を呼び出し
  google.script.run
    .withSuccessHandler(res => {
      if (res.success) {
        const d = JSON.parse(res.json);
        
        // サーバーから受け取った個人データを格納
        dataStore.studentProgress = d.progress || {};
        dataStore.studentFeedback = d.feedback || {};
        dataStore.myTasks = d.myTasks || []; // 自分の「マイタスク」
        dataStore.portfolioData = d.portfolio || { summary: '' };
        dataStore.studentReflections = d.reflections?.[appState.unit.id] || {};

        // 自分の正準キー（クラス集計から自分の分を見分けるのに使う）
        appState.user.key = d.myKey || studentKeyOf('', appState.user.name);

        // 学習計画データ（クラス集計と同じ正準キーで持つ）
        if (d.plans && d.plans[appState.unit.id]) {
           dataStore.clsPlans[appState.user.key] = { [appState.unit.id]: d.plans[appState.unit.id] };
        }
        
        syncStudentPlan();      // 計画データの整合性チェック
        renderStudentView();    // 画面描画
        
        if (!isAuto) hideLoading();
        
        // 追加機能の起動
        renderMyTimer();        // タイマーウィジェット表示
        checkScheduleAndNotify(); // スケジュール確認
        unlockAudio();          // 音声再生準備
      }
    })
    .withFailureHandler(err => {
      handleError(err);
      renderNameEntry(); // スケルトンのまま止まらないよう、ログイン画面に戻す
    })
    .getStudentProgress(appState.user.name, appState.user.classId, appState.unit.id);
}

/**
 * [画面描画] 児童画面のスケルトン（読み込み中の骨組み表示）。
 * データ待ちの間、真っ白ではなく「もうすぐ出る画面の形」を見せる。
 */
function renderStudentSkeleton() {
  const container = document.getElementById('app-container');
  if (!container) return;
  container.innerHTML = `
    <div class="p-3" aria-hidden="true">
      <div class="skl skl-hero mb-3"></div>
      <div class="skl skl-block mb-3" style="height:110px"></div>
      <div class="d-flex gap-2 mb-3">
        <div class="skl skl-block flex-fill" style="height:72px"></div>
        <div class="skl skl-block flex-fill" style="height:72px"></div>
        <div class="skl skl-block flex-fill" style="height:72px"></div>
      </div>
      <div class="skl skl-block mb-2" style="height:96px"></div>
      <div class="skl skl-block mb-2" style="height:96px"></div>
      <div class="skl skl-block" style="height:96px"></div>
    </div>`;
}

// ==========================================
//  2. 画面描画制御 (View Controller)
// ==========================================

/**
 * [機能] 生徒画面の描画振り分け
 * 「今日の学習(daily)」か「計画作成(planning)」かを判断して描画します。
 */
function renderStudentView() {
  const view = appState.view.student;
  if (view === 'planning') {
    renderStudentPlanning();
  } else if (view === 'portfolio') {
    renderStudentPortfolio();
  } else if (view === 'plaza') {
    renderStudentPlaza();
  } else if (view === 'gallery') {
    renderGalleryWalk();
  } else {
    renderStudentDaily();
  }
  // ビューが入れかわったことが分かるよう、すっと入れる（動きを減らす設定では出さない）
  const appc = document.getElementById('app-container');
  if (appc && !cqReducedMotion()) {
    appc.classList.remove('cq-view-in');
    void appc.offsetWidth;
    appc.classList.add('cq-view-in');
  }
  // 児童タブバーを（無ければ）用意して、今のタブを目立たせる
  renderStudentBottomNav();
}

/**
 * [画面描画] モード切替（きょう / けいかく / ポートフォリオ / ひろば）
 */
function setStudentViewMode(mode) {
  // 計画ビューを離れるとき、デバウンス待ちの保存があれば先に送る（取りこぼし防止）
  if (appState.view.student === 'planning' && mode !== 'planning' && typeof planSaveTimer !== 'undefined' && planSaveTimer) {
    flushPlanSave();
  }
  appState.view.student = mode;
  // 内側スクロールを持つビュー（計画）から戻るときに位置が残らないよう先頭へ
  const main = document.querySelector('main.container');
  if (main) main.scrollTop = 0;
  renderStudentView();
}

// ==========================================
//  下部4タブナビ (child-friendly bottom nav)
// ==========================================

// タブ定義（アイコン + ふりがな寄りのラベル）
const STUDENT_NAV_TABS = [
  { id: 'daily',     icon: 'bi-house-door-fill', label: 'きょう' },
  { id: 'planning',  icon: 'bi-calendar-range',  label: 'けいかく' },
  { id: 'portfolio', icon: 'bi-journal-text',    label: 'ポートフォリオ' },
  { id: 'plaza',     icon: 'bi-people-fill',     label: 'ひろば' }
];

/**
 * [画面描画] 児童用の下部タブバーを用意し、現在のタブを反映する。
 * body へ1度だけ差し込み、以降はタブの選択状態だけ更新する（冪等）。
 * 実ボタン(<button>)なのでキーボード（Tab→Enter/Space）で操作できる。
 */
function renderStudentBottomNav() {
  // 児童モードでログイン済みのときだけ表示する
  if (appState.mode !== 'student' || !appState.user.name) { removeStudentBottomNav(); return; }
  document.body.classList.add('has-student-nav');
  document.body.classList.add('cq-student');

  let nav = document.getElementById('student-bottom-nav');
  if (!nav) {
    nav = document.createElement('nav');
    nav.id = 'student-bottom-nav';
    nav.className = 'student-bottom-nav no-print';
    nav.setAttribute('role', 'navigation');
    nav.setAttribute('aria-label', 'メインメニュー');
    nav.innerHTML = STUDENT_NAV_TABS.map(function (tab) {
      return `<button type="button" class="snav-btn" data-view="${escapeHtml(tab.id)}" onclick="setStudentViewMode('${escJs(tab.id)}')">
                <i class="bi ${escapeHtml(tab.icon)}" aria-hidden="true"></i>
                <span class="snav-label">${escapeHtml(tab.label)}</span>
              </button>`;
    }).join('');
    document.body.appendChild(nav);
  }
  // 現在のタブを目立たせる（aria-current で支援技術にも伝える）
  const current = appState.view.student;
  nav.querySelectorAll('.snav-btn').forEach(function (btn) {
    const isCurrent = btn.getAttribute('data-view') === current;
    const wasCurrent = btn.hasAttribute('aria-current');
    if (isCurrent) {
      btn.setAttribute('aria-current', 'page');
      // タブが「今」になった瞬間だけ、アイコンを「ぴょん」とはねさせる
      if (!wasCurrent && !cqReducedMotion()) {
        const ic = btn.querySelector('i');
        if (ic) { ic.classList.remove('cq-tab-pop'); void ic.offsetWidth; ic.classList.add('cq-tab-pop'); }
      }
    } else {
      btn.removeAttribute('aria-current');
    }
  });
}

/** [画面描画] 児童用タブバーを取り除く（先生モード・未ログイン時） */
function removeStudentBottomNav() {
  const nav = document.getElementById('student-bottom-nav');
  if (nav && nav.parentNode) nav.parentNode.removeChild(nav);
  document.body.classList.remove('has-student-nav');
  document.body.classList.remove('cq-student');
}

/**
 * [画面描画] 現在の時数を変更（1時間目、2時間目...）
 */
function changeCurrentHour(h) { 
  appState.unit.currentHour = parseInt(h); 
  renderStudentView(); 
}

// ==========================================
//  3. 今日の学習画面 (Daily View)  ── コンパスクエスト設計
// ==========================================

/**
 * [データ] いま表示している時数の「きょうのやること」リストを、計画の順で組み立てる。
 * renderStudentDaily と pickTodayGoal / submitTaskProgress が同じ並びを使えるよう、
 * 1か所にまとめている（計画順を正とし、未計画時は先生固定タスクを先頭に補う）。
 * @returns {Array<Object>} 今日のタスク（順序どおり）
 */
function buildTodaysTasks() {
  const currentTasks = getCurrentUnitTasks();
  const myTasksFiltered = dataStore.myTasks.filter(t => t.unitId === appState.unit.id);
  const allTasks = [...currentTasks, ...myTasksFiltered];

  const hourKey = String(appState.unit.currentHour);
  const plannedIds = dataStore.studentPlan[hourKey] || [];

  const todaysTasks = [];
  // 1. 計画にあるタスクを「順序通り」に追加
  plannedIds.forEach(tid => {
    const t = allTasks.find(at => at.taskId === tid);
    if (t) todaysTasks.push(t);
  });
  // 2. 計画に無い「先生固定タスク」は先頭に補う（未計画時の対応）
  const fixedTasks = allTasks.filter(t => t.format === 'teacher' && getStepNumber(t.step) === appState.unit.currentHour);
  fixedTasks.forEach(ft => {
    if (!todaysTasks.some(t => t.taskId === ft.taskId)) todaysTasks.unshift(ft);
  });
  return todaysTasks;
}

/** [判定] タスクが完了済みか */
function cqTaskDone(t) {
  const p = dataStore.studentProgress[t.taskId];
  return !!(p && p.status === '完了');
}

/** [判定] 前提タスク未了でロックされているか */
function cqTaskLocked(t) {
  if (!t.prerequisites || t.prerequisites.length === 0) return false;
  return !t.prerequisites.every(pid => {
    const p = dataStore.studentProgress[pid];
    return p && p.status === '完了';
  });
}

/** [判定] このタスクにワークシート（みらいパスポート）があるか */
function cqTaskHasWorksheet(t) {
  return t.format !== 'teacher' && t.category !== 'マイタスク';
}

/** [色] カテゴリを cq アクセント（色ファミリー）へ対応づける */
function cqCategoryAccent(cat) {
  cat = cat || '';
  if (cat.includes('まなぶ')) return 'blue';
  if (cat.includes('ふかめる')) return 'orange';
  if (cat.includes('まとめる')) return 'purple';
  if (cat === 'マイタスク') return 'pink';
  return 'cyan';
}

/** [色] カテゴリのアイコン（Bootstrap Icons） */
function cqCategoryIcon(cat) {
  cat = cat || '';
  if (cat.includes('まなぶ')) return 'bi-book-half';
  if (cat.includes('ふかめる')) return 'bi-search-heart';
  if (cat.includes('まとめる')) return 'bi-journal-check';
  if (cat === 'マイタスク') return 'bi-star-fill';
  return 'bi-pencil-fill';
}

/** きょうの やることが「できた」に変わった瞬間を見つけるための記録（演出用） */
let cqTodayWasPending = false;

/**
 * [動線] いま一番やってほしいこと「1つ」を、既存データだけから決める（優先の滝）。
 *   ① この時数の計画が空 → けいかくを立てよう
 *   ② 今日のリストに未完了がある → つぎは『◯◯』（ワークシートがあれば起動）
 *   ③ ぜんぶ完了・ふりかえり未記入 → きょうのふりかえりを書こう
 *   ④ ぜんぶ完了・ふりかえり済み → かんぺき！（押せない・お祝い）
 * @param {Array<Object>} todaysTasks buildTodaysTasks() の結果
 * @returns {{icon:string,label:string,title:string,note:string,accent:string,done?:boolean,go?:Function}}
 */
function pickTodayGoal(todaysTasks) {
  const hourKey = String(appState.unit.currentHour);
  const planned = dataStore.studentPlan[hourKey] || [];

  // ① 計画が空（先生固定タスクも無い）→ 計画を立てる
  if (planned.length === 0 && todaysTasks.length === 0) {
    return {
      icon: 'bi-calendar-plus', label: 'まず これ！',
      title: 'けいかくを たてよう',
      note: 'きょう やることを えらぼう',
      accent: 'blue',
      go: () => setStudentViewMode('planning')
    };
  }

  // ② 未完了のタスク（ロックされていない先頭を優先。全部ロックなら未完了の先頭）
  const notDone = todaysTasks.filter(t => !cqTaskDone(t));
  if (notDone.length > 0) {
    const next = notDone.find(t => !cqTaskLocked(t)) || notDone[0];
    const hasWs = cqTaskHasWorksheet(next);
    return {
      icon: 'bi-play-circle-fill', label: 'つぎは これ',
      title: `『${next.title}』`,
      note: hasWs ? 'タップして ワークシートを ひらこう' : 'タップして はじめよう',
      accent: cqCategoryAccent(next.category),
      go: () => {
        if (hasWs) { launchPassport(next.taskId); return; }
        // ワークシートが無いタスクは、そのカードへスクロールして目立たせる
        const card = document.getElementById('cq-task-' + next.taskId);
        if (card) {
          card.scrollIntoView({ behavior: cqReducedMotion() ? 'auto' : 'smooth', block: 'center' });
          cqPop(card);
        } else {
          openTaskDetailModal(next.taskId);
        }
      }
    };
  }

  // ③ ぜんぶ完了・この時数のふりかえりが未記入 → ふりかえりを書く
  const hourRef = dataStore.studentReflections && dataStore.studentReflections[appState.unit.currentHour];
  const reflected = !!(hourRef && (hourRef.comment || hourRef.achievement || (hourRef.skills && hourRef.skills.length)));
  if (todaysTasks.length > 0 && !reflected) {
    return {
      icon: 'bi-pencil-square', label: 'あと ひといき',
      title: 'きょうの ふりかえりを かこう',
      note: 'かんたんな しつもんに こたえるだけ',
      accent: 'orange',
      go: () => openDailyReflectionModal()
    };
  }

  // ④ ぜんぶ おわった
  return {
    done: true, icon: 'bi-trophy-fill', label: 'きょうは かんぺき！',
    title: 'やること ぜんぶ できたね',
    note: 'また あした がんばろう',
    accent: 'green'
  };
}

/** [画面描画] きょうの やることカード（大きな1つだけの案内） */
function renderTodayGoalCard(todaysTasks) {
  const goal = pickTodayGoal(todaysTasks);
  // 「未完了 → 完了」に変わった瞬間だけ、カードがうなずいてお祝いする
  const justDone = goal.done && cqTodayWasPending;
  cqTodayWasPending = !goal.done;

  const acc = goal.accent || 'blue';
  const html = `
    <div class="cq-accent-${escapeHtml(acc)}">
      <button type="button" id="cq-today-card" class="cq-today${goal.done ? ' done' : ''}"${goal.done ? ' disabled aria-disabled="true"' : ''}>
        <span class="cq-today-label"><i class="bi bi-stars" aria-hidden="true"></i>${escapeHtml(goal.label)}</span>
        <span class="cq-today-title">
          <span class="cq-today-emoji"><i class="bi ${escapeHtml(goal.icon)}" aria-hidden="true"></i></span>
          <span>${escapeHtml(goal.title)}</span>
        </span>
        <span class="cq-today-note">${escapeHtml(goal.note)}</span>
      </button>
    </div>`;

  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const card = wrap.querySelector('.cq-today');
  if (justDone) {
    card.classList.add('just-done');
    cqCelebrate(70);
  }
  if (goal.go) {
    card.addEventListener('click', () => { cqPop(card); setTimeout(goal.go, 90); });
  }
  return wrap;
}

function renderStudentDaily() {
  const container = document.getElementById('app-container');

  // 自分のステータス（SOSなど）取得
  const myStat = dataStore.liveStatus.find(d => d.name === appState.user.name) || { mode: '通常' };
  const isSos = (myStat.mode === 'たすけて' || myStat.mode === 'sos');
  const isFocus = (myStat.mode === 'しゅうちゅう' || myStat.mode === 'focus');

  // 今日のタスク（計画順）
  const todaysTasks = buildTodaysTasks();
  const doneCount = todaysTasks.filter(cqTaskDone).length;
  const totalCount = todaysTasks.length;
  const donePercent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

  // 時数選択肢（<option> の中は HTML 不可＝ルビが振れないため、ひらがな表記にする）
  const effectiveHours = getEffectiveTotalHours();
  let hourOptions = '';
  for (let i = 1; i <= effectiveHours; i++) {
    hourOptions += `<option value="${i}" ${i === appState.unit.currentHour ? 'selected' : ''}>${i}じかんめ</option>`;
  }

  // 単元タイトル・目標
  const currentUnit = appState.unitList.find(u => u.id === appState.unit.id) || {};
  const unitTitle = currentUnit.title || appState.unit.title || 'たんげん';

  // ステータスバッジ（ヒーロー内）
  let heroBadge = '';
  if (isSos) heroBadge = `<span class="cq-hero-badge sos"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>SOS</span>`;
  else if (isFocus) heroBadge = `<span class="cq-hero-badge focus"><i class="bi bi-headphones" aria-hidden="true"></i>しゅうちゅう</span>`;

  // 進捗バーのラベル（かんぺき時はやさしく）
  const barLabel = totalCount === 0
    ? 'まだ やることが ありません'
    : (doneCount >= totalCount ? 'きょうの がくしゅう ぜんぶ できたね！' : 'きょうの がくしゅう');

  // タスクリスト
  const taskListHtml = totalCount === 0
    ? `<div class="cq-card cq-accent-blue"><div class="cq-card-body text-center py-4">
         <div style="font-size:2.4rem;line-height:1" class="mb-2"><i class="bi bi-clipboard-heart text-primary" aria-hidden="true"></i></div>
         <p class="fw-bold mb-3" style="color:var(--cq-ink-2)">この <ruby>時間<rt>じかん</rt></ruby>の けいかくが まだ ないよ</p>
         <button type="button" class="cq-btn cq-btn-block" onclick="setStudentViewMode('planning')"><i class="bi bi-calendar-plus" aria-hidden="true"></i>けいかくを たてる</button>
       </div></div>`
    : `<div class="cq-stagger">${todaysTasks.map(t => createStudentTaskCard(t)).join('')}</div>`;

  container.innerHTML = `
    <div class="px-1 px-sm-2 pt-2">
      <!-- あいさつヘッダー -->
      <div class="cq-hero">
        <div class="cq-hello"><span class="cq-hello-emoji"><i class="bi bi-emoji-smile-fill" aria-hidden="true"></i></span>こんにちは、${escapeHtml(appState.user.name)}さん！</div>
        <div class="cq-hero-unit"><i class="bi bi-flag-fill" aria-hidden="true"></i>${escapeHtml(unitTitle)}</div>
        <div class="cq-hero-row">
          <label class="cq-hero-badge" style="cursor:pointer">
            <i class="bi bi-clock-fill" aria-hidden="true"></i>
            <select class="cq-hour-select" onchange="changeCurrentHour(this.value)" aria-label="なんじかんめ">${hourOptions}</select>
          </label>
          ${heroBadge}
        </div>
      </div>

      <!-- きょうの やること（大きな1つ） -->
      <div id="cq-today-slot"></div>

      <!-- きょうの がくしゅう（進捗バー） -->
      <div class="cq-bar-wrap">
        <div class="cq-bar-label"><span>${escapeHtml(barLabel)}</span><span class="cq-bar-count"><span id="cq-done-num">0</span> / ${totalCount}</span></div>
        <div class="cq-bar" id="cq-progress-bar"><span style="width:0%"></span></div>
      </div>

      <!-- ※以前ここにあった「けいかく／ポートフォリオ／ひろば」のとびらは、
           下部タブと完全に重複していたため削除した（ワークシートも上のゴールカードと
           課題カードのボタンから開ける）。課題リストが1画面に収まりやすくなる。 -->

      <!-- ステータス（SOS / しゅうちゅう） -->
      <div class="cq-section-title"><span class="cq-section-emoji"><i class="bi bi-hand-thumbs-up-fill" aria-hidden="true"></i></span>いまの きもち</div>
      <div class="d-flex flex-wrap gap-2 mb-2">
        <button type="button" class="cq-btn cq-btn-pink" onclick="submitUserStatus('たすけて')"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>SOS</button>
        <button type="button" class="cq-btn cq-btn-purple" onclick="submitUserStatus('しゅうちゅう')"><i class="bi bi-headphones" aria-hidden="true"></i>しゅうちゅう</button>
        <button type="button" class="cq-btn cq-btn-ghost ${(isSos||isFocus)?'':'d-none'}" onclick="submitUserStatus('通常')"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>もどす</button>
      </div>

      <!-- きょうの やること 一覧 -->
      <div class="cq-section-title"><span class="cq-section-emoji"><i class="bi bi-list-check" aria-hidden="true"></i></span>きょうの やること</div>
      ${taskListHtml}

      <div class="d-grid gap-2 mt-2 mb-3">
        <button type="button" class="cq-btn cq-btn-ghost cq-btn-block" onclick="openMyTaskModal()"><i class="bi bi-plus-circle-fill" aria-hidden="true"></i>じぶんの かだいを つくる</button>
        <div class="d-flex gap-2">
          <button type="button" class="cq-btn cq-btn-gold cq-btn-block" onclick="setStudentViewMode('gallery')"><i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>みんなの けいかく</button>
          <button type="button" class="cq-btn cq-btn-orange cq-btn-block" onclick="openDailyReflectionModal()"><i class="bi bi-pencil-square" aria-hidden="true"></i>ふりかえり</button>
        </div>
      </div>
    </div>`;

  // きょうの やることカードを差し込む（イベント付きなので DOM で組み立てる）
  const slot = document.getElementById('cq-today-slot');
  if (slot) slot.appendChild(renderTodayGoalCard(todaysTasks));

  // 進捗バーを、少し遅らせてのびるように（数字はカウントアップ）
  const bar = document.getElementById('cq-progress-bar');
  const numEl = document.getElementById('cq-done-num');
  if (bar) {
    const span = bar.querySelector('span');
    if (doneCount > 0) bar.classList.add('grew');
    requestAnimationFrame(() => { if (span) span.style.width = donePercent + '%'; });
  }
  if (numEl) cqCountUp(numEl, doneCount);
}

/**
 * [HTML生成] タスクカード1枚分（cq-card デザイン）。
 * 上に色帯・左に大きなアイコンチップ・大きな「できた」ボタン。
 */
function createStudentTaskCard(t) {
  const prog = dataStore.studentProgress[t.taskId] || {};
  const stamp = dataStore.studentFeedback[t.taskId];
  const isDone = prog.status === '完了';
  const isDoing = prog.status === '途中';
  const isLocked = cqTaskLocked(t);
  const acc = cqCategoryAccent(t.category);
  const catIcon = cqCategoryIcon(t.category);

  // 先生からのスタンプ
  const stampHtml = stamp
    ? `<div class="stamp-badge animate__animated animate__bounceIn">${{'check':'✅','good':'👍','great':'💮','support':'🚩'}[stamp] || ''}</div>`
    : '';

  // ワークシート起動ボタン
  let passportBtn = '';
  if (cqTaskHasWorksheet(t)) {
    passportBtn = `<button type="button" class="cq-btn cq-btn-purple" style="min-height:2.6rem;padding:.4rem 1rem;font-size:.9rem" onclick="event.stopPropagation(); launchPassport('${escJs(t.taskId)}')" title="ワークシートを ひらく"><i class="bi bi-rocket-takeoff-fill" aria-hidden="true"></i>ワークシート</button>`;
  }

  // アクションボタン
  let actionBtn = '';
  if (isDone) {
    actionBtn = `<button type="button" class="cq-btn cq-btn-green" style="min-height:2.6rem;padding:.4rem 1.1rem;font-size:.92rem" disabled><i class="bi bi-check-circle-fill" aria-hidden="true"></i>できた</button>`;
  } else {
    const doneBtn = `<button type="button" class="cq-btn cq-btn-green" style="min-height:2.6rem;padding:.4rem 1.1rem;font-size:.95rem" onclick="event.stopPropagation(); submitTaskProgress('${escJs(t.taskId)}','完了',this)">できた！</button>`;
    if (t.format !== 'teacher') {
      const doingCls = isDoing ? 'cq-btn-orange' : 'cq-btn-ghost';
      const doingBtn = `<button type="button" class="cq-btn ${doingCls}" style="min-height:2.6rem;padding:.4rem .9rem;font-size:.9rem" onclick="event.stopPropagation(); submitTaskProgress('${escJs(t.taskId)}','途中',this)">とちゅう</button>`;
      actionBtn = passportBtn + doingBtn + doneBtn;
    } else {
      actionBtn = doneBtn;
    }
  }

  const teacherTag = t.format === 'teacher' ? `<span class="cq-tag" style="--cq-accent-color:var(--cq-cyan-d);--cq-accent-soft:var(--cq-cyan-s)"><i class="bi bi-mortarboard-fill" aria-hidden="true"></i><ruby>先生<rt>せんせい</rt></ruby></span>` : '';
  const doingTag = (isDoing && !isDone) ? `<span class="cq-tag" style="--cq-accent-color:var(--cq-orange-d);--cq-accent-soft:var(--cq-orange-s)"><i class="bi bi-hourglass-split" aria-hidden="true"></i>とちゅう</span>` : '';

  const lockOverlay = isLocked
    ? `<div class="position-absolute top-50 start-50 translate-middle text-center" style="z-index:2"><i class="bi bi-lock-fill fs-1 text-secondary" aria-hidden="true"></i><br><span class="cq-tag" style="--cq-accent-color:var(--cq-muted);--cq-accent-soft:#eceff2">まだ ひらけないよ</span></div>`
    : '';

  return `
    <div id="cq-task-${escapeHtml(t.taskId)}" class="cq-card cq-accent-${acc}${isDone ? ' done' : ''}${isLocked ? ' locked' : ''} position-relative" style="cursor:pointer" onclick="openTaskDetailModal('${escJs(t.taskId)}')">
      ${stampHtml}
      ${lockOverlay}
      <div class="cq-card-head">
        <span class="cq-card-icon"><i class="bi ${catIcon}" aria-hidden="true"></i></span>
        <div class="cq-card-head-body">
          <h5 class="cq-card-title">${escapeHtml(t.title)}</h5>
          <div class="cq-card-note"><i class="bi bi-clock" aria-hidden="true"></i> ${escapeHtml(t.time)}<ruby>分<rt>ふん</rt></ruby>・${escapeHtml(t.category)}</div>
        </div>
        ${isDone ? `<span class="cq-card-icon" style="--cq-accent-color:var(--cq-green-d);--cq-accent-soft:var(--cq-green-s)"><i class="bi bi-check-lg" aria-hidden="true"></i></span>` : ''}
      </div>
      <div class="cq-card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div class="d-flex flex-wrap gap-1">${teacherTag}${doingTag}</div>
          <div class="d-flex flex-wrap gap-2 justify-content-end">${actionBtn}</div>
        </div>
      </div>
    </div>`;
}

// ==========================================
//  4.5 ギャラリーウォーク (Gallery Walk)
// ==========================================

let isGalleryAnonymous = true; // デフォルトは匿名

// みんなの計画の鮮度管理。開くたびに最新を取りにいくが、連続の再描画
// （名前の表示切替など）では取り直さないよう10秒の間隔を空ける。
let galleryLastFetch = 0;
let galleryFetchInFlight = false;

/** [サーバー通信] クラスの計画・マイタスクを取り直して、表示中なら描き直す */
function refreshGalleryData() {
  if (galleryFetchInFlight) return;
  galleryFetchInFlight = true;
  galleryLastFetch = Date.now();
  google.script.run
    .withSuccessHandler(res => {
      galleryFetchInFlight = false;
      if (!res || !res.success || !res.json) return;
      let d;
      try { d = JSON.parse(res.json); } catch (e) { return; }
      if (d.plans) dataStore.clsPlans = d.plans;
      if (d.myTasks) dataStore.clsMyTasks = d.myTasks;
      // 自分の計画は手元の編集が最新なので上書きしない
      if (appState.user.key && dataStore.studentPlan) {
        if (!dataStore.clsPlans[appState.user.key]) dataStore.clsPlans[appState.user.key] = {};
        dataStore.clsPlans[appState.user.key][appState.unit.id] = dataStore.studentPlan;
      }
      if (appState.mode === 'student' && appState.view.student === 'gallery') renderGalleryWalk();
    })
    .withFailureHandler(e => { galleryFetchInFlight = false; console.error('Gallery refresh error', e); })
    .getGalleryData();
}

function renderGalleryWalk() {
  const container = document.getElementById('app-container');
  const unitId = appState.unit.id;
  const currentTasks = getCurrentUnitTasks();
  // クラス全員のマイタスクも含める（自分のものだけだと友達の計画中のマイタスクが表示されないため）
  const classmateTasks = Object.values(dataStore.clsMyTasks || {}).flat();
  // 35人×8時間×数十タスクの三重ループで毎回 find すると数千回の線形探索になるため、
  // taskId → タスクの Map を1度だけ作って O(1) で引く。
  const taskById = new Map();
  [...currentTasks, ...dataStore.myTasks, ...classmateTasks].forEach(t => { if (!taskById.has(t.taskId)) taskById.set(t.taskId, t); });
  
  // クラス全員の計画データを取得
  // dataStore.clsPlans = { "生徒名": { "unitId": { "1": [ids], "2": [ids]... } } }
  // dataStore.roster をベースにすることで、計画未作成の子も表示する
  
  // 現在のクラスの生徒リスト
  const students = dataStore.roster.filter(r => r.classId === appState.user.classId).sort((a,b) => a.number - b.number);
  
  let cardsHtml = '';
  
  students.forEach((s, idx) => {
    // 計画は正準キーで引く（名簿のメール → ログイン記録 → 名前 の順で解決）
    const key = resolveStudentKey(s);

    // 自分はスキップ（自分の画面で見ているので）。キーで判定するため、
    // 名簿にメールが入っていれば同名の友だちを巻き込んでスキップしない。
    if (key === appState.user.key || (!sidFromKey(key) && s.name === appState.user.name)) return;

    const displayName = isGalleryAnonymous ? `おともだち ${s.number}` : s.name;
    const plan = (dataStore.clsPlans[key] && dataStore.clsPlans[key][unitId]) ? dataStore.clsPlans[key][unitId] : null;
    
    let planContentHtml = '';
    
    if (!plan) {
      planContentHtml = `<div class="text-center text-muted small py-4">まだ <ruby>計画<rt>けいかく</rt></ruby>が ないよ</div>`;
    } else {
      // 1時間目～総時数までの計画を可視化
      const totalHours = appState.unit.totalHours; // 共通時数を使用
      for (let h = 1; h <= totalHours; h++) {
        const taskIds = plan[String(h)] || [];
        let blocksHtml = '';
        
        taskIds.forEach(tid => {
          const t = taskById.get(tid);
          if (t) {
            // カテゴリごとの色クラス
            let colorClass = 'bg-other';
            if (t.category.includes('まなぶ')) colorClass = 'bg-manabu';
            else if (t.category.includes('ふかめる')) colorClass = 'bg-fukameru';
            else if (t.category.includes('まとめる')) colorClass = 'bg-matomeru';
            else if (t.category === 'マイタスク') colorClass = 'bg-mytask';
            
            blocksHtml += `<div class="mini-task-block ${colorClass}" data-title="${escapeHtml(t.title)}"></div>`;
          }
        });
        
        if (blocksHtml === '') blocksHtml = `<div class="w-100 text-center text-muted" style="font-size:0.6rem; background:#f8f9fa;">-</div>`;

        planContentHtml += `
          <div class="mini-timeline-row">
            <div class="mini-timeline-label">${h}</div>
            <div class="mini-timeline-track">${blocksHtml}</div>
          </div>`;
      }
    }

    cardsHtml += `
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card gallery-card h-100 shadow-sm border-0 rounded-3">
          <div class="card-header bg-white border-bottom-0 pt-3 pb-1">
            <div class="d-flex align-items-center">
              <div class="rounded-circle bg-light text-secondary d-flex align-items-center justify-content-center me-2 fw-bold small" style="width:32px; height:32px;">
                ${s.number}
              </div>
              <div class="fw-bold text-truncate text-secondary small">${escapeHtml(displayName)}</div>
            </div>
          </div>
          <div class="card-body px-2 py-2">
            ${planContentHtml}
          </div>
        </div>
      </div>
    `;
  });

  // 開いたら（10秒に1回まで）最新の計画を取りにいく。手元のキャッシュで即描画した上で、
  // 届いたら静かに描き直すので、待ち時間はない。
  if (Date.now() - galleryLastFetch > 10000) refreshGalleryData();

  const anonBtnText = isGalleryAnonymous ? '<i class="bi bi-eye"></i> <ruby>名前<rt>なまえ</rt></ruby>をみる' : '<i class="bi bi-eye-slash"></i> <ruby>名前<rt>なまえ</rt></ruby>をかくす';
  const anonBtnClass = isGalleryAnonymous ? 'btn-outline-secondary' : 'btn-secondary';

  container.innerHTML = `
    <div class="d-flex flex-column h-100 p-2">
      <!-- ヘッダー -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold m-0 text-primary"><i class="bi bi-grid-3x3-gap-fill me-2"></i>みんなの <ruby>計画<rt>けいかく</rt></ruby></h5>
        <div class="d-flex gap-2">
          <button class="btn ${anonBtnClass} btn-sm rounded-pill" onclick="toggleGalleryNames()">${anonBtnText}</button>
          <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="setStudentViewMode('daily')">もどる</button>
        </div>
      </div>
      
      <!-- 凡例 -->
      <div class="d-flex gap-3 mb-3 small text-muted justify-content-center flex-wrap">
        <div class="d-flex align-items-center"><span class="d-inline-block rounded-circle me-1 bg-manabu" style="width:10px;height:10px;"></span>まなぶ</div>
        <div class="d-flex align-items-center"><span class="d-inline-block rounded-circle me-1 bg-fukameru" style="width:10px;height:10px;"></span>ふかめる</div>
        <div class="d-flex align-items-center"><span class="d-inline-block rounded-circle me-1 bg-matomeru" style="width:10px;height:10px;"></span>まとめる</div>
        <div class="d-flex align-items-center"><span class="d-inline-block rounded-circle me-1 bg-mytask" style="width:10px;height:10px;"></span>マイタスク</div>
      </div>

      <!-- ギャラリー -->
      <div class="overflow-auto flex-grow-1">
        <div class="row g-3 pb-5">
          ${cardsHtml}
        </div>
      </div>
    </div>
  `;
}

function toggleGalleryNames() {
  isGalleryAnonymous = !isGalleryAnonymous;
  renderGalleryWalk();
}

// ==========================================
//  5. 計画作成画面 (Planning View)
// ==========================================

function renderStudentPlanning() {
  // スクロール位置の保存（再描画時にガタつかないように）
  const scrollContainer = document.getElementById('planning-scroll-view');
  const scrollY = scrollContainer ? scrollContainer.scrollTop : 0;
  
  const poolContainer = document.getElementById('task-pool-container'); 
  const poolScrollY = poolContainer ? poolContainer.scrollTop : 0;

  // タスクの整理
  const currentTasks = getCurrentUnitTasks();
  const myTasksFiltered = dataStore.myTasks.filter(t => t.unitId === appState.unit.id);
  const allTasks = [...currentTasks, ...myTasksFiltered];
  
  // 【左側】タスクプール（選択肢）
  let taskPoolHtml = `<div class="d-grid gap-2 mb-3 sticky-top bg-white pt-2 pb-2 border-bottom" style="top:0; z-index:5;"><button class="btn btn-outline-primary btn-sm rounded-pill border-dashed" onclick="openMyTaskModal()"><i class="bi bi-plus-lg me-1"></i><ruby>課題<rt>かだい</rt></ruby><ruby>作成<rt>さくせい</rt></ruby></button></div>`;
  
  allTasks.filter(t => t.format !== 'teacher').forEach(t => { 
    const borderClass = getCategoryColorClass(t.category);
    taskPoolHtml += `
      <div class="card p-2 mb-2 shadow-sm task-draggable ${borderClass}" style="${t.category==='マイタスク'?'background-color:#fbf5ff;':''}" data-id="${escapeHtml(t.taskId)}" onclick="openTaskDetailModal('${escJs(t.taskId)}')">
        <div class="small fw-bold">${escapeHtml(t.title)}</div>
        <div class="d-flex justify-content-between align-items-center mt-1">
          <span class="badge bg-light text-secondary border rounded-pill" style="font-size:0.6rem">${escapeHtml(t.category)}</span>
          <span class="x-small text-muted">${escapeHtml(t.time)}<ruby>分<rt>ふん</rt></ruby></span>
        </div>
      </div>`;
  });
  
  // 【右側】時数ごとの計画表
  const effectiveHours = getEffectiveTotalHours();
  let hoursHtml = '';
  
  for(let i = 1; i <= effectiveHours; i++) {
    let plannedTasksHtml = '';
    const plannedIds = dataStore.studentPlan[String(i)] || [];
    let hourTotalTime = 0;
    
    let displayTasks = [];
    
    // 計画済みのタスクを追加
    plannedIds.forEach(tid => {
      const t = allTasks.find(x => x.taskId === tid);
      if (t) displayTasks.push(t);
    });

    // 先生タスク（固定）を自動挿入
    const fixedTasks = allTasks.filter(t => t.format === 'teacher' && getStepNumber(t.step) === i);
    fixedTasks.forEach(ft => {
      if (!displayTasks.some(t => t.taskId === ft.taskId)) {
         displayTasks.unshift(ft);
      }
    });

    displayTasks.forEach(t => {
      hourTotalTime += (Number(t.time) || 0);
      const borderClass = getCategoryColorClass(t.category);
      const isTeacher = t.format === 'teacher';
      const badge = isTeacher ? `<span class="badge bg-info text-white me-1" style="font-size:0.6em"><ruby>固定<rt>こてい</rt></ruby></span>` : '';
      const deleteBtn = isTeacher ? '' : `<i class="bi bi-x text-danger" role="button" tabindex="0" aria-label="けいかくから はずす" style="cursor:pointer" onclick="event.stopPropagation(); removeFromPlan('${escJs(String(i))}', '${escJs(t.taskId)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); event.stopPropagation(); removeFromPlan('${escJs(String(i))}', '${escJs(t.taskId)}');}"></i>`;
      const bgStyle = t.category === 'マイタスク' ? 'background-color:#fbf5ff;' : (isTeacher ? 'opacity:0.9;' : '');
      
      plannedTasksHtml += `
        <div class="card p-2 mb-2 shadow-sm task-draggable ${borderClass}" style="${bgStyle}" data-id="${escapeHtml(t.taskId)}" onclick="openTaskDetailModal('${escJs(t.taskId)}')">
          <div class="d-flex justify-content-between align-items-center">
            <span class="small fw-bold text-truncate">${badge}${escapeHtml(t.title)}</span>
            ${deleteBtn}
          </div>
          <div class="d-flex justify-content-between align-items-center mt-1">
            <span class="badge bg-light text-secondary border rounded-pill" style="font-size:0.6rem">${escapeHtml(t.category)}</span>
            <span class="x-small text-muted">${escapeHtml(t.time)}<ruby>分<rt>ふん</rt></ruby></span>
          </div>
        </div>`;
    });

    // 時間配分の計算（色変化）
    const timeRatio = Math.min(hourTotalTime / CONSTANTS.UNIT_TIME, 1) * 100;
    const barColor = hourTotalTime > CONSTANTS.UNIT_TIME ? '#ffcdd2' : '#c8e6c9'; 
    const headerStyle = `background: linear-gradient(90deg, ${barColor} ${timeRatio}%, #f8f9fa ${timeRatio}%);`;

    hoursHtml += `
      <div class="plan-hour-row mb-3">
        <div class="plan-hour-header-v p-2 fw-bold text-center border rounded-top position-relative" style="${headerStyle}">
          <ruby>第<rt>だい</rt></ruby>${i}<ruby>時<rt>じ</rt></ruby> <span class="small ms-2 fw-normal badge bg-white text-dark border">${hourTotalTime}<ruby>分<rt>ふん</rt></ruby></span>
        </div>
        <div class="plan-drop-zone-v p-2 border border-top-0 rounded-bottom" data-hour="${i}" style="min-height: 80px; background-color: #fff;">
          ${plannedTasksHtml}

// 計画データの並び順を更新して保存
function updatePlanByOrder(hour, newOrderArray) {
  dataStore.studentPlan[hour] = newOrderArray;
  savePlan();
}

// 計画からタスクを削除
function removeFromPlan(hour, taskId) { 
  if (dataStore.studentPlan[hour]) { 
    dataStore.studentPlan[hour] = dataStore.studentPlan[hour].filter(id => id !== taskId); 
    savePlan(); 
    renderStudentPlanning(); 
  } 
}

// ------------------------------------
//  計画の保存（デバウンス + 保存状態の見える化）
// ------------------------------------
// ドラッグのたびに即時送信すると、連続操作で保存リクエストが束になって
// サーバーのロック待ちを起こす。800ms のデバウンスでまとめて1回にする。
let planSaveTimer = null;
let planSaveState = 'saved'; // 'saving' | 'saved' | 'error'

function renderPlanSaveStateLabel() {
  if (planSaveState === 'saving') return `<i class="bi bi-arrow-repeat" aria-hidden="true"></i>ほぞんちゅう…`;
  if (planSaveState === 'error') return `<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>ほぞんできてないよ`;
  return `<i class="bi bi-check-lg" aria-hidden="true"></i>ほぞんずみ`;
}

function setPlanSaveState(state) {
  planSaveState = state;
  const el = document.getElementById('plan-save-state');
  if (el) el.innerHTML = renderPlanSaveStateLabel();
}

// サーバーへ計画を保存（デバウンス入口）
function savePlan() {
  setPlanSaveState('saving');
  if (planSaveTimer) clearTimeout(planSaveTimer);
  planSaveTimer = setTimeout(flushPlanSave, 800);
}

// 実際の送信（ビューを離れるときにも呼んで、書きかけを取りこぼさない）
function flushPlanSave() {
  if (planSaveTimer) { clearTimeout(planSaveTimer); planSaveTimer = null; }
  google.script.run
    .withSuccessHandler(res => {
      if (res && res.success === false) { setPlanSaveState('error'); reportSaveFailure('けいかく'); }
      else setPlanSaveState('saved');
    })
    .withFailureHandler(err => {
      console.error(err);
      setPlanSaveState('error');
      reportSaveFailure('けいかく');
    })
    .saveStudentPlan(appState.user.name, appState.unit.id, dataStore.studentPlan, appState.user.classId);
}

// 生徒の学習計画用：総時数の変更
function getEffectiveTotalHours() {
  if (dataStore.studentPlan._meta && dataStore.studentPlan._meta.totalHours) {
    return parseInt(dataStore.studentPlan._meta.totalHours);
  }
  return appState.unit.totalHours;
}

function changeStudentTotalHours(delta) {
  const current = getEffectiveTotalHours();
  const next = current + delta;
  if (next < 1) return;

  if (!dataStore.studentPlan._meta) dataStore.studentPlan._meta = {};
  dataStore.studentPlan._meta.totalHours = next;
  
  savePlan(); 
  renderStudentPlanning(); 
}

// 計画データの同期（初期化）
function syncStudentPlan() { 
  const plans = dataStore.clsPlans[appState.user.key || 'name:' + appState.user.name] || {};
  const currentPlan = plans[appState.unit.id] || {}; 
  
  if (!currentPlan._meta) {
    currentPlan._meta = {}; 
  }

  const total = currentPlan._meta.totalHours || appState.unit.totalHours;
  for (let i = 1; i <= total; i++) { 
    if (!currentPlan[String(i)]) currentPlan[String(i)] = []; 
  } 
  dataStore.studentPlan = currentPlan; 
}

/**
 * [アクション] 課題の進捗を更新（できた・途中）
 */
function submitTaskProgress(taskId, status, btnElement) {
  if (status === '完了' && btnElement) {
    btnElement.disabled = true;
    btnElement.innerHTML = `<i class="bi bi-check-circle-fill" aria-hidden="true"></i>できた`;
  }
  const allTasks = [...dataStore.masterTasks, ...dataStore.myTasks];
  const t = allTasks.find(x => x.taskId === taskId);
  if (!t) { console.error('Task not found:', taskId); return; }

  if (!dataStore.studentProgress[taskId]) dataStore.studentProgress[taskId] = {};
  dataStore.studentProgress[taskId].status = status;
  const mem = dataStore.studentProgress[taskId].reflection || "";

  // サーバーへ送信（失敗したら必ず児童に知らせる）
  runSave('がくしゅうの きろく')
    .updateStatus(appState.user.name, t.taskId, t.title, status, '通常', mem, appState.user.classId, appState.unit.id);

  if (status === '途中') { showToast('info', 'とちゅうまで ほぞんしたよ'); return; }

  if (status === '完了') {
    // このカードを「ぷるっ」とさせて、紙ふぶきでお祝いする
    const card = document.getElementById('cq-task-' + taskId);
    cqPop(card || btnElement);

    // きょうのタスクが「これで ぜんぶ完了」になったか判定する
    const todays = buildTodaysTasks();
    const remaining = todays.filter(x => !cqTaskDone(x)).length;
    if (todays.length > 0 && remaining === 0) {
      cqCelebrate(110);
      cqCheer('ぜんぶ できたね！', 'きょうも よくがんばりました');
    } else {
      cqCelebrate(45);
    }
    // カードの「ぷるっ」を見せてから素早く更新する（以前は1秒待っていて操作が止まって見えた）
    setTimeout(renderStudentView, 380);
  }
}

/**
 * [アクション] 自分のステータス変更（SOS/集中）
 */
function submitUserStatus(mode) {
  const idx = dataStore.liveStatus.findIndex(d => d.name === appState.user.name);
  if (idx >= 0) {
    dataStore.liveStatus[idx].mode = (mode === '通常' ? '' : mode);
    dataStore.liveStatus[idx].classId = appState.user.classId;
    dataStore.liveStatus[idx].currentUnitId = appState.unit.id;
  }
  renderStudentView();
  
  let msg = "ステータス解除"; let icon = "success";
  if (mode === 'たすけて' || mode === 'sos') { msg = "SOS送信！"; icon = "warning"; }
  else if (mode === 'しゅうちゅう' || mode === 'focus') { msg = "集中モード開始"; icon = "info"; }
  
  if (mode !== '通常' && mode !== '') showToast(icon, msg);
  
  runSave('きもちの おしらせ')
    .updateStatus(appState.user.name, 'st_upd', 'ステータス', '更新', mode, '', appState.user.classId, appState.unit.id);
}

/**
 * [計算] ふりかえりから「発揮した力」の集計を作る（レーダーチャート用）。
 * @returns {{chartLabels:string[], chartData:number[], maxVal:number}}
 */
function computePortfolioSkillData(reflections, useKana = false) {
  const skillCounts = {};
  SKILL_DEFINITIONS.forEach(s => skillCounts[s.id] = 0);
  Object.values(reflections || {}).forEach(r => {
    if (r && r.skills && Array.isArray(r.skills)) {
      r.skills.forEach(sId => {
        if (skillCounts[sId] !== undefined) skillCounts[sId]++;
      });
    }
  });
  // Chart.js のレーダーは canvas 描画のためルビが振れない。
  // 児童画面（useKana=true）ではラベルをかなにする。先生画面は漢字のまま。
  const chartLabels = SKILL_DEFINITIONS.map(s => (useKana ? s.kana : s.label));
  const chartData = SKILL_DEFINITIONS.map(s => skillCounts[s.id]);
  const maxVal = Math.max(5, ...chartData) + 1;
  return { chartLabels, chartData, maxVal };
}

/**
 * [HTML生成] あゆみ（毎時ふりかえり）のタイムライン。
 * @param {Object} reflections {時数: {achievement,comment,skills}}
 * @param {Object} [opts] { editHandler:(h)=>string|null } 編集アイコンの onclick を返す関数（null で非表示）
 */
function buildPortfolioTimelineHtml(reflections, opts) {
  const editHandler = opts && opts.editHandler ? opts.editHandler : null;
  let html = '<div class="timeline-wrapper ps-2 border-start border-3 ms-3">';
  const sortedHours = Object.keys(reflections || {}).map(Number).sort((a, b) => a - b);
  if (sortedHours.length === 0) {
    html += '<div class="text-muted ms-3 small">まだ ふりかえりの きろくが ないよ</div>';
  } else {
    sortedHours.forEach(h => {
      const r = reflections[h];
      const achIcon = r.achievement === 'A' ? '◎' : (r.achievement === 'B' ? '〇' : '△');
      const achColor = r.achievement === 'A' ? 'text-primary' : (r.achievement === 'B' ? 'text-success' : 'text-secondary');
      let tagsHtml = '';
      if (r.skills && r.skills.length > 0) {
        tagsHtml = '<div class="mt-1">' + r.skills.map(sid => {
          const def = SKILL_DEFINITIONS.find(d => d.id === sid);
          return def ? `<span class="badge rounded-pill bg-light text-dark border me-1 small fw-normal">${escapeHtml(def.label)}</span>` : '';
        }).join('') + '</div>';
      }
      // h は Object.keys().map(Number) 由来の数値なので onclick へ直接埋め込んでよい
      const editIcon = editHandler
        ? `<i class="bi bi-pencil-square text-muted ms-2 cursor-pointer edit-icon" role="button" tabindex="0" aria-label="このふりかえりを なおす" onclick="${editHandler(h)}"></i>`
        : '';
      html += `
        <div class="position-relative mb-4 ms-3">
          <div class="position-absolute top-0 start-0 translate-middle rounded-circle bg-white border border-2" style="width:12px;height:12px;left:-22px!important;"></div>
          <div class="small fw-bold text-muted mb-1 d-flex align-items-center">
            <ruby>第<rt>だい</rt></ruby>${h}<ruby>時<rt>じ</rt></ruby> <span class="${achColor} ms-2 fs-6">${achIcon}</span>
            ${editIcon}
          </div>
          <div class="bg-light p-2 rounded small">${escapeHtml(r.comment) || 'コメントなし'}</div>
          ${tagsHtml}
        </div>`;
    });
  }
  html += '</div>';
  return html;
}

/**
 * [描画] スキルのレーダーチャートを描く（Chart.js）。
 * 高DPI端末での「ぼやけ」対策で dpr を 2 で頭打ちにする（3倍端末で 9倍の
 * 面積を描くとメモリ4GBの Chromebook がタブごと落ちるため）。
 */
function drawSkillRadar(canvasId, chartLabels, chartData, maxVal) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  // 同じキャンバスに前のチャートが残っているとインスタンスとリサイズ監視が
  // たまり続け、4GB端末では致命的。描き直す前に必ず破棄する。
  const prev = Chart.getChart(el);
  if (prev) prev.destroy();
  const ctx = el.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  new Chart(ctx, {
    type: 'radar',
    data: {
      labels: chartLabels,
      datasets: [{
        label: 'はっきした ちから',
        data: chartData,
        backgroundColor: 'rgba(26, 115, 232, 0.2)',
        borderColor: 'rgba(26, 115, 232, 1)',
        pointBackgroundColor: 'rgba(26, 115, 232, 1)',
        borderWidth: 2
      }]
    },
    options: {
      scales: {
        r: {
          angleLines: { display: true },
          suggestedMin: 0,
          suggestedMax: maxVal,
          ticks: { stepSize: 1, backdropColor: 'transparent' }
        }
      },
      plugins: { legend: { display: false } },
      maintainAspectRatio: false,
      devicePixelRatio: dpr,
      // 画面回転・分割画面・電子黒板への出力切替に追従させる
      responsive: true
    }
  });
}

 */
function loadPortfolioWorksheets() {
  const host = document.getElementById('portfolio-worksheets');
  if (!host) return;
  google.script.run
    .withSuccessHandler(function (subs) {
      const target = document.getElementById('portfolio-worksheets');
      if (!target) return;
      const list = Array.isArray(subs) ? subs : [];
      if (list.length === 0) {
        target.innerHTML = '<div class="text-muted small text-center py-3">まだ ていしゅつした ワークシートは ないよ</div>';
        return;
      }
      target.innerHTML = '<div class="row g-2">' + list.map(function (s) {
        const title = escapeHtml(s.stepTitle || 'むだい');
        const unit = escapeHtml(s.unitName || '');
        const statusMap = { submitted: 'ていしゅつずみ', graded: 'せんせいが みたよ', draft: 'かきかけ' };
        const statusLabel = escapeHtml(statusMap[s.status] || s.status || '');
        const statusClass = s.status === 'graded' ? 'bg-success' : (s.status === 'submitted' ? 'bg-primary' : 'bg-secondary');
        const hasFeedback = (s.feedbackText && String(s.feedbackText).trim() !== '') || s.status === 'graded';

          ? `<img src="${escUrl(s.canvasImage)}" alt="${title} のサムネイル" style="width:100%;height:90px;object-fit:cover;object-position:top;border-radius:.5rem .5rem 0 0;background:#fff;">`

        const fbBadge = hasFeedback
          ? '<span class="badge bg-warning text-dark"><i class="bi bi-chat-heart-fill me-1" aria-hidden="true"></i>コメント</span>'
          : '';
        return `
          <div class="col-6 col-md-4">
            <div class="card h-100 border-0 shadow-sm rounded-3" role="button" tabindex="0"
                 aria-label="${title} をひらく"
                 onclick="openMyWorksheet('${escJs(s.taskId)}','${escJs(s.stepTitle || '')}')"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openMyWorksheet('${escJs(s.taskId)}','${escJs(s.stepTitle || '')}');}">
              ${thumb}

// ひろばの状態（選択中のワークシートと、その共有回答の一覧）
let plazaState = { taskId: '', title: '', responses: [] };

/**
 * [画面描画] ひろば：友だちが公開したワークシートを見て、リアクションできる。

/**
 * [サーバー通信] 配信済みワークシート一覧を取得してピッカーを作る。
 */
function loadPlazaTaskList() {
  google.script.run
    .withSuccessHandler(function (listRaw) {
      const picker = document.getElementById('plaza-picker');
      if (!picker) return;
      const list = Array.isArray(listRaw) ? listRaw.filter(function (w) { return w && w.taskId; }) : [];
      if (list.length === 0) {
        picker.innerHTML = '<div class="text-muted small">まだ ワークシートが ありません</div>';
        return;
      }
      const options = list.map(function (w) {
        const label = (w.unitName ? w.unitName + '：' : '') + (w.stepTitle || '無題');
        const sel = w.taskId === plazaState.taskId ? ' selected' : '';
        return `<option value="${escapeHtml(w.taskId)}"${sel}>${escapeHtml(label)}</option>`;
      }).join('');
      picker.innerHTML = `
        <select id="plaza-task-select" class="form-select form-select-lg rounded-pill" onchange="onPlazaTaskPick(this.value, this.options[this.selectedIndex].text)">
          <option value="" ${plazaState.taskId ? '' : 'selected'} disabled>ワークシートを えらんでね</option>
          ${options}
        </select>`;
      // 既に選択済みなら再取得して復元
      if (plazaState.taskId) loadPlazaResponses(plazaState.taskId, plazaState.title);
    })
    .withFailureHandler(function (err) {
      const picker = document.getElementById('plaza-picker');
      if (picker) picker.innerHTML = '<div class="text-danger small">読み込みに失敗しました</div>';
      if (typeof console !== 'undefined') console.error(err);
    })
    .getStudentWorksheetList();
}

/** [アクション] ピッカーでワークシートを選んだとき */
function onPlazaTaskPick(taskId, label) {
  if (!taskId) return;
  plazaState.taskId = taskId;
  plazaState.title = label || '';
  loadPlazaResponses(taskId, label);
}

/**
 * [サーバー通信] 選んだワークシートの共有回答を取得してグリッド描画。
 * 他児童のメール/IDはサーバーが渡さない（表示名のみ）。
 */
function loadPlazaResponses(taskId, label) {
  const grid = document.getElementById('plaza-grid');
  if (grid) grid.innerHTML = '<div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>よみこみ中...</div>';
  google.script.run
    .withSuccessHandler(function (resRaw) {
      const target = document.getElementById('plaza-grid');
      if (!target) return;
      const responses = Array.isArray(resRaw) ? resRaw : [];
      // taskId をクライアント側で各回答へ添える（openPeer が必要とする）
      responses.forEach(function (r) { r.taskId = taskId; });
      plazaState.responses = responses;
      if (responses.length === 0) {
        target.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-emoji-smile fs-1 d-block mb-2" aria-hidden="true"></i>まだ 公開された作品が ありません</div>';
        return;
      }
      target.innerHTML = '<div class="row g-2">' + responses.map(function (r, idx) {
        const name = escapeHtml(r.studentName || 'おともだち');
        const reactCount = Array.isArray(r.reactions) ? r.reactions.length : 0;
        const thumb = r.canvasImage
          ? `<img src="${escUrl(r.canvasImage)}" alt="${name} の作品" style="width:100%;height:120px;object-fit:cover;object-position:top;border-radius:.5rem .5rem 0 0;background:#fff;">`
          : `<div class="d-flex align-items-center justify-content-center text-muted" style="height:120px;background:#f1f3f5;border-radius:.5rem .5rem 0 0;"><i class="bi bi-vector-pen fs-2" aria-hidden="true"></i></div>`;
        return `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card h-100 border-0 shadow-sm rounded-3" role="button" tabindex="0"
                 aria-label="${name} の作品をひらく"
                 onclick="openPlazaPeer(${idx})"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openPlazaPeer(${idx});}">
              ${thumb}
              <div class="card-body p-2">
                <div class="small fw-bold text-truncate"><i class="bi bi-person-circle me-1" aria-hidden="true"></i>${name}</div>
                ${reactCount ? `<div class="x-small text-muted mt-1"><i class="bi bi-heart-fill text-danger me-1" aria-hidden="true"></i>${reactCount}</div>` : ''}
              </div>
            </div>
          </div>`;
      }).join('') + '</div>';
    })
    .withFailureHandler(function (err) {
      const target = document.getElementById('plaza-grid');
      if (target) target.innerHTML = '<div class="text-danger small text-center py-3">よみこみに しっぱいしたよ</div>';
      if (typeof console !== 'undefined') console.error(err);
    })
    .getSharedResponses(taskId);
}

/** [アクション] ひろばの作品を開く（読み取り専用のピア閲覧） */
function openPlazaPeer(idx) {
  const r = plazaState.responses[idx];

  if (typeof Worksheet !== 'undefined' && Worksheet.openPeer) {

    cancelButtonText: 'やめる', 
    preConfirm: () => {
      const t = document.getElementById('mt-title').value.trim();
      if (!t) { Swal.showValidationMessage('タイトルを 入れてね'); return false; }
      return { title: t, desc: document.getElementById('mt-desc').value, time: parseInt(document.getElementById('mt-time').value, 10) || 15 };
    }
  }).then(r => { 
    if (r.isConfirmed) { 
      const v = r.value; 
      google.script.run.withSuccessHandler((res) => { 
        // サーバーから返されたIDを使用
        const newId = (res && res.taskId) ? res.taskId : "MT_TEMP";
        dataStore.myTasks.push({
          taskId: newId,
          title: v.title,
          desc: v.desc,
          time: v.time,
          category: 'マイタスク',
          type: 'challenge', 
          format: 'student',
          unitId: appState.unit.id
        }); 
        
        if (appState.view.student === 'planning') {
          renderStudentPlanning();
        } else {
          // Dailyビューの場合は、現在の時数に自動登録する
          const currentHour = String(appState.unit.currentHour);
          if (!dataStore.studentPlan[currentHour]) dataStore.studentPlan[currentHour] = [];
          dataStore.studentPlan[currentHour].push(newId);
          savePlan(); // 計画を保存

          // すでに手元のデータへ反映済みなので、サーバーからの全再取得はせず画面だけ描き直す
          renderStudentView();
        }
        showToast('success', 'かだいを つくって、けいかくに 入れたよ');
      }).withFailureHandler(err => { console.error(err); reportSaveFailure('じぶんの課題'); })
        .addMyTask(appState.user.name, v.title, v.desc, v.time, appState.unit.id, appState.user.classId);
    } 
  }); 
}

//  8. 自分用タイマー機能 (Timer Widget)
// ==========================================

function renderMyTimer() {
  if (document.getElementById('my-timer-widget')) return;
  
  const timerHtml = `
    <div id="my-timer-widget" class="no-print card shadow rounded-4 bg-white" style="position:fixed; bottom:20px; right:20px; width:180px; z-index:1050; border:1px solid #ddd;">
      <div id="my-timer-drag-handle" class="card-header bg-light border-0 py-1 d-flex justify-content-between align-items-center" style="cursor:move; touch-action:none;">
        <small class="fw-bold text-muted"><i class="bi bi-clock me-1"></i>Timer</small>
        <button type="button" class="btn-close btn-close-sm" aria-label="タイマーを閉じる" onclick="document.getElementById('my-timer-widget').classList.toggle('d-none')"></button>
      </div>
      <div class="card-body p-2 text-center">
        <div class="display-5 fw-bold mb-2" id="timer-display" style="font-family:monospace;">00:00</div>
        <div class="btn-group btn-group-sm w-100 mb-2">
          <button class="btn btn-outline-secondary" onclick="setTimerMode('up')">UP</button>
          <button class="btn btn-outline-secondary" onclick="setTimerMode('down')">DOWN</button>
        </div>
        <div class="input-group input-group-sm mb-2" id="timer-input-group" style="display:none;">
          <input type="number" id="timer-input-min" class="form-control" placeholder="分" min="1" max="60">
          <button class="btn btn-primary" onclick="setTimerTime()">セット</button>
        </div>
        <div class="d-flex justify-content-between">
          <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="toggleTimer()" id="timer-btn-toggle"><ruby>開始<rt>かいし</rt></ruby></button>
          <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="resetTimer()">リセット</button>
        </div>
      </div>
    </div>
    <button id="timer-launcher" class="no-print btn btn-primary rounded-circle shadow" style="position:fixed; bottom:20px; right:20px; width:50px; height:50px; z-index:1040;" aria-label="タイマーをひらく" onclick="document.getElementById('my-timer-widget').classList.remove('d-none');">
      <i class="bi bi-stopwatch fs-4"></i>
    </button>
  `;
  document.body.insertAdjacentHTML('beforeend', timerHtml);
  initTimerDrag();
}

function setTimerMode(mode) {
  myTimer.mode = mode;
  document.getElementById('timer-input-group').style.display = (mode === 'down' && !myTimer.isActive) ? 'flex' : 'none';
  resetTimer();
}

function setTimerTime() {
  const min = parseInt(document.getElementById('timer-input-min').value);
  if (min > 0) {
    myTimer.seconds = min * 60;
    updateTimerDisplay();
    document.getElementById('timer-input-group').style.display = 'none';
  }
}

function toggleTimer() {
  if (myTimer.isActive) {
    clearInterval(myTimer.interval);
    myTimer.isActive = false;
    document.getElementById('timer-btn-toggle').innerHTML = '<ruby>再開<rt>さいかい</rt></ruby>';
    document.getElementById('timer-btn-toggle').className = 'btn btn-primary btn-sm rounded-pill px-3';
  } else {
    if (myTimer.mode === 'down' && myTimer.seconds === 0) return;
    myTimer.isActive = true;
    document.getElementById('timer-btn-toggle').innerHTML = '<ruby>停止<rt>ていし</rt></ruby>';
    document.getElementById('timer-btn-toggle').className = 'btn btn-danger btn-sm rounded-pill px-3';
    
    myTimer.interval = setInterval(() => {
      if (myTimer.mode === 'up') {
        myTimer.seconds++;
      } else {
        myTimer.seconds--;
        if (myTimer.seconds <= 0) {
          clearInterval(myTimer.interval);
          myTimer.isActive = false;
          myTimer.seconds = 0;
          document.getElementById('timer-btn-toggle').innerHTML = '<ruby>開始<rt>かいし</rt></ruby>';
          document.getElementById('timer-btn-toggle').className = 'btn btn-primary btn-sm rounded-pill px-3';
          showToast('info', 'じかんだよ！');
        }
      }
      updateTimerDisplay();
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(myTimer.interval);
  myTimer.isActive = false;
  myTimer.seconds = 0;
  updateTimerDisplay();
  document.getElementById('timer-btn-toggle').innerHTML = '<ruby>開始<rt>かいし</rt></ruby>';
  document.getElementById('timer-btn-toggle').className = 'btn btn-primary btn-sm rounded-pill px-3';
  if(myTimer.mode === 'down') document.getElementById('timer-input-group').style.display = 'flex';
}

function updateTimerDisplay() {
  const m = Math.floor(myTimer.seconds / 60);
  const s = myTimer.seconds % 60;
  document.getElementById('timer-display').textContent = `${('0'+m).slice(-2)}:${('0'+s).slice(-2)}`;
}

// ウィジェットのドラッグ移動。
// Pointer Events で実装しているため、マウスだけでなくタブレットの指・ペンでも動かせる
// （旧実装は mousedown/mousemove のみで、GIGA端末のタッチ操作では動かせなかった）。
function initTimerDrag() {
  const widget = document.getElementById('my-timer-widget');
  const handle = document.getElementById('my-timer-drag-handle');
  if (!widget || !handle) return;

  let dragging = false;
  let startX = 0, startY = 0, origX = 0, origY = 0;

  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return; // 閉じるボタンはドラッグ扱いにしない
    dragging = true;
    const rect = widget.getBoundingClientRect();
    // 初期配置は bottom/right 指定。そのまま top/left を書くと最初のドラッグで
    // 位置が跳ぶため、つかんだ瞬間に top/left 基準へ切り替える。
    widget.style.top = rect.top + 'px';
    widget.style.left = rect.left + 'px';
    widget.style.bottom = 'auto';
    widget.style.right = 'auto';
    startX = e.clientX; startY = e.clientY;
    origX = rect.left;  origY = rect.top;
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    // 画面の外へ出て戻せなくならないよう、可動範囲を画面内に収める
    const nx = Math.min(Math.max(0, origX + e.clientX - startX), Math.max(0, window.innerWidth - widget.offsetWidth));
    const ny = Math.min(Math.max(0, origY + e.clientY - startY), Math.max(0, window.innerHeight - widget.offsetHeight));
    widget.style.left = nx + 'px';
    widget.style.top = ny + 'px';
  });

  const endDrag = () => { dragging = false; };
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
}
</script>
