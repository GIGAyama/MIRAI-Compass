    という壊れ方をしました。ローディング画面が消えず、d-none が効かないので
    児童画面と先生用ボタンが同時に出て、Swal / Chart / Sortable がすべて
    undefined になります。原因がアプリの外にあるので先生が調べても分かりません。
    そのため実行コードは1バイトも外から取りません。

    ⚠️ vendor_*.html は tools/build-vendor.mjs の生成物です。手で編集しないでください。

  -->
  <?!= include('vendor_css'); ?>
  <?!= include('vendor_icons'); ?>

  <!--
    フォント: Zen Maru Gothic (子供にも読みやすい丸ゴシック体)
    これは「見た目だけ」の依存です。学校のフィルタリングで届かなくても、
    css.html で端末側の日本語フォントを後ろに並べてあるので、
    字の形が変わるだけでアプリは動きます。だから自己ホストしません
    （日本語フォントの自己ホストは初回転送が数MBになり、校内Wi-Fiで
      40人が同時に開くという、いちばん避けたい状況を自分で作ります）。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
