  <!-- 
    === 基本設定 ===
    ページのタイトルや、スマホで見た時の表示倍率などを設定しています。
  -->
  <meta charset="UTF-8">
  <!-- viewport-fit=cover … ノッチ／ホームバー領域まで背景を伸ばすために必須。
       ⚠️ GAS は画面を iframe で包むため、この指定は index.html と code.gs の
          addMetaTag の【両方】に要る。片方だけでは安全領域が使えるようにならない。
       user-scalable=no と maximum-scale は書かない。誤ズーム防止より、
       見えづらい子が拡大できない害のほうが大きい。誤ズームは
       touch-action: manipulation で十分に防げる（css.html）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="自由進度学習支援アプリケーション">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">

    そこを塞いでいると「Bootstrap が当たっていない素の HTML が半分だけ動く」
    という壊れ方をしました。ローディング画面が消えず、d-none が効かないので
    児童画面と先生用ボタンが同時に出て、Swal / Chart / Sortable がすべて
    undefined になります。原因がアプリの外にあるので先生が調べても分かりません。
    そのため実行コードは1バイトも外から取りません。

    ⚠️ vendor_*.html は tools/build-vendor.mjs の生成物です。手で編集しないでください。
       ライブラリの版を変えるときは package.json を直して `npm run build` を実行します。
  -->
  <?!= include('vendor_css'); ?>
  <?!= include('vendor_icons'); ?>

    フォント: Zen Maru Gothic (子供にも読みやすい丸ゴシック体)
    これは「見た目だけ」の依存です。学校のフィルタリングで届かなくても、
    css.html で端末側の日本語フォントを後ろに並べてあるので、
    字の形が変わるだけでアプリは動きます。だから自己ホストしません
    （日本語フォントの自己ホストは初回転送が数MBになり、校内Wi-Fiで
      40人が同時に開くという、いちばん避けたい状況を自分で作ります）。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

        </button>

        <!-- 提示モード：電子黒板に映して一斉授業をするときに押す。

    </div>

    </div>

  <!-- 
    === メインコンテンツエリア ===
    ここに「今日の学習画面」や「先生用ダッシュボード」が表示されます。

  -->
  <main class="container">
    <div id="app-container"></div>
  </main>

  <!--
    === 読み上げ用の通知エリア ===
    保存できた・エラーになったといった画面の変化を、目で追えない人にも伝えます。
    見た目には出ません（.visually-hidden）。announce() から書き込みます。
  -->
  <div id="a11y-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="a11y-alert" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <footer class="no-print text-center text-muted py-2 border-top transition-bg d-flex justify-content-center align-items-center gap-3">

  <!--
    === JavaScriptライブラリの読み込み（自己ホスト） ===
    Bootstrap（モーダル・タブ）／SweetAlert2（ポップアップ）／
    Chart.js（レーダーチャート）／Sortable（計画づくりのドラッグ操作）。

    （sweetalert2@11 はメジャー内で勝手に上がり、chart.js は版指定すら無し）。
    いまは package.json で固定し、npm から取った実バイトを vendor_js.html に包んでいます。
  -->
  <?!= include('vendor_js'); ?>

  <!-- 
    === アプリケーションロジックの読み込み ===
    機能ごとに分割したJSファイルを順番に読み込みます。
    Code.gs の include() 関数によって結合されます。
  -->
  
  <!-- 1. 共通コア機能（設定、データ管理、通信） -->
  <?!= include('js_core'); ?>
  
  <!-- 2. 生徒用機能（学習計画、ログ記録） -->
  <?!= include('js_student'); ?>
  
  <!-- 3. 先生用機能（ダッシュボード、単元管理） -->
  <?!= include('js_teacher'); ?>

  <!-- 4. ワークシート統合（回答・作成・添削の自己完結モジュール） -->
  <?!= include('js_worksheet'); ?>
